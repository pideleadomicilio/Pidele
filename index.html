  const l = (S._negs || []).filter(n => (cat === 'Todos' || catsDe(n).includes(cat)) && n.id !== propio);
  box.innerHTML = `<div class="secHead"><h3>${cat === 'Todos' ? 'Restaurantes cerca de ti' : ICONO_CAT[cat] + ' ' + esc(cat)}</h3>${cat !== 'Todos' ? '<button onclick="verTodos()">Ver todos</button>' : ''}</div>` +
    (l.length ? `<div class="grid2">${l.map(tarjetaNegocio).join('')}</div>`
      : `<div class="vacio"><span class="big">🍽️</span>${S._negs && S._negs.length ? 'No hay negocios en esta categoría' : 'Aún no hay negocios disponibles. ¡Pronto!'}</div>`);
}

/** Categorías de un negocio o de la promo de un negocio (antes de 2.10 solo había una). */
function catsDe(x) { return x.categorias && x.categorias.length ? x.categorias : [x.categoria]; }
/* ---------- banner de promociones ---------- */
/** Promos ordenadas para este cliente: sus categorías y negocios favoritos primero, abiertos antes que cerrados. */
function promosOrdenadas(cat) {
  const pc = prefCategorias(), pf = prefs();
  const puntos = p => (pc[p.categoria] || 0) * 2 + (pf[p.negocioId] || 0) * 3 + (p.abierto ? 50 : 0) + (p.imagen ? 1 : 0);
  return (S.promos || []).filter(p => !cat || cat === 'Todos' || cat === 'Promociones' || catsDe(p).includes(cat))
    .slice().sort((a, b) => puntos(b) - puntos(a) || b.creado - a.creado);
}

function slidePromo(p) {
  const prods = p.productos || [], conPrecio = prods.filter(x => x.precioPromo);
  const mec = mecDe(p);
  const precio = mec && mec !== 'precio' ? `<div class="precioS">${esc(p.etiqueta || etiquetaPromo(p))}</div>`
    : conPrecio.length === 1 ? `<div class="precioS"><s>${money(conPrecio[0].precioAntes)}</s>${money(conPrecio[0].precioPromo)}</div>`
    : conPrecio.length > 1 ? `<div class="precioS"><s style="text-decoration:none">Ahorra hasta</s>${money(p.ahorroMax)}</div>` : '';
  const sub = p.todoMenu ? ' · en todo el menú' : mec === 'primera' ? ' · en tu primera compra' : prods.length === 1 ? ' · ' + esc(prods[0].nombre) + (prods[0].variante && prods[0].variante !== '*' ? ' ' + esc(prods[0].variante) : '') : prods.length > 1 ? ' · ' + prods.length + ' productos en promo' : '';
  return `<div class="slide" onclick="abrirPromo('${p.id}')">
    ${p.imagen ? `<img class="fondo" src="${esc(p.imagen)}" alt="" loading="lazy" decoding="async">` : `<div class="sinImg">${ICONO_CAT[p.categoria] || '🏷️'}</div>`}
    <div class="velo"></div>
    <span class="chip">${!p.abierto ? '🕒 Cerrado ahora' : esPromo(p) ? '🏷️ Promoción' : '📣 Novedad'}</span>
    <div class="txt">${p.logo ? `<img class="logoS" src="${esc(p.logo)}" alt="" loading="lazy">` : ''}
      <div class="grow"><b class="clamp2">${esc(p.titulo)}</b><small class="clamp1">${esc(p.negocio)}${sub}</small></div>${precio}</div></div>`;
}

function pintarBanner(cat) {
  const b = $('#promoBanner'); if (!b) return;
  clearInterval(S._carrusel);
  const l = cat === 'Promociones' ? [] : promosOrdenadas(cat).filter(p => !p.sinBanner).slice(0, 8); // plan Básico: sin banner de Inicio
  if (!l.length) { b.innerHTML = ''; return; }
  b.innerHTML = `<div class="promoWrap"><div class="promoFila" id="promoFila">${l.map(slidePromo).join('')}</div>
    ${l.length > 1 ? `<div class="puntos" id="puntos">${l.map((x, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}</div>`;
  if (l.length > 1) iniciarCarrusel(l);
}

/**
 * Avanza solo (cada anuncio dura los segundos de su plan); se detiene un rato si el cliente lo desliza con el dedo.
 * Visibilidad por peso: en cada vuelta, un banner de peso 2 (promoción o extra pagado) sale dos veces
 * y uno de peso 1 (anuncio) una vez. Ej. pesos [2,1,2,1] → orden 0,1,2,3,0,2.
 */
function iniciarCarrusel(l) {
  const f = $('#promoFila'); if (!f) return;
  const max = Math.max(...l.map(p => p.peso || 1));
  const seq = [];
  for (let r = 1; r <= max; r++) l.forEach((p, k) => { if ((p.peso || 1) >= r) seq.push(k); });
  let i = 0, j = 0, pausa = 0;
  const ancho = () => (f.children[0] ? f.children[0].offsetWidth + 10 : 1);
  f.addEventListener('scroll', () => {
    i = Math.round(f.scrollLeft / ancho());
    const pts = $('#puntos'); if (pts) [...pts.children].forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive: true });
  ['touchstart', 'pointerdown', 'wheel'].forEach(ev => f.addEventListener(ev, () => { pausa = Date.now(); }, { passive: true }));
  // cada anuncio se queda los segundos de su plan (Ajustes → Planes)
  let prox = Date.now() + (l[0].segundos || 5) * 1000;
  S._carrusel = setInterval(() => {
    if (!document.body.contains(f)) { clearInterval(S._carrusel); return; }
    if (document.hidden || Date.now() - pausa < 8000 || Date.now() < prox) return;
    j = (j + 1) % seq.length;
    if (seq[j] === i && seq.length > 1) j = (j + 1) % seq.length; // no repetir el mismo seguido
    f.scrollTo({ left: seq[j] * ancho(), behavior: 'smooth' });
    prox = Date.now() + (l[seq[j]].segundos || 5) * 1000;
  }, 500);
}

/** Renglones con los productos de una promoción (nombre, precio normal tachado y precio especial). */
function lineasPromo(p, max) {
  const l = p.productos || [], mec = mecDe(p);
  const vr = x => x.variante === '*' ? ' · todas' : x.variante ? ' · ' + esc(x.variante) : '';
  if (mec && mec !== 'precio') {
    const que = { nxm: 'Llevas ' + p.lleva + ', pagas ' + p.paga + ' (se cobran los de mayor precio)', pct: p.valor + '% de descuento por pieza', monto: money(p.valor) + ' menos por pieza',
      regalo: 'Por cada ' + (p.lleva > 1 ? p.lleva + ' piezas' : 'pieza') + ' te regalamos uno de los regalos', primera: p.valor + '% en tu primera compra' + (p.tope ? ' (hasta ' + money(p.tope) + ')' : '') }[mec] || '';
    return `<div class="small" style="margin-top:6px"><b>${esc(que)}</b>
      ${p.todoMenu ? '<div class="muted">Aplica en todo el menú</div>' : ''}
      ${l.slice(0, max || 6).map(x => `<div class="tot" style="padding:3px 0"><span>${esc(x.nombre)}${vr(x)}${x.disponible === false ? ' <span class="tag t-warn">Agotado</span>' : ''}</span><span class="muted">${money(x.precioAntes)}</span></div>`).join('')}
      ${(p.regalos || []).map(x => `<div class="tot" style="padding:3px 0"><span>🎁 ${esc(x.nombre)}${vr(x)}</span><b class="precioPromo">Gratis</b></div>`).join('')}
      ${mec !== 'primera' ? '<div class="muted">Los extras y opciones con costo se cobran aparte.</div>' : ''}</div>`;
  }
  if (!l.length) return '';
  max = max || 6;
  return `<div class="small" style="margin-top:6px">${l.slice(0, max).map(x => `<div class="tot" style="padding:3px 0"><span>${esc(x.nombre)}${x.variante ? ' · ' + esc(x.variante) : ''}${x.disponible === false ? ' <span class="tag t-warn">Agotado</span>' : ''}</span>
    <span>${x.precioPromo ? `<span class="tachado">${money(x.precioAntes)}</span><b class="precioPromo">${money(x.precioPromo)}</b>` : `<span class="muted">${money(x.precioAntes)}</span>`}</span></div>`).join('')}
    ${l.length > max ? `<div class="muted">y ${l.length - max} más…</div>` : ''}</div>`;
}

/** Categoría "Promociones": todas las promociones vigentes de todos los negocios. */
function listaPromos() {
  const l = promosOrdenadas('Promociones').filter(esPromo);
  if (!l.length) return `<div class="vacio"><span class="big">🏷️</span>Hoy no hay promociones. ¡Vuelve pronto!</div>`;
  return `<div class="secHead"><h3>🏷️ Promociones de hoy</h3><button onclick="verTodos()">Ver negocios</button></div>` +
    l.map(p => `<div class="promoCard">${slidePromo(p)}<div class="pie" onclick="abrirPromo('${p.id}')">
      ${p.descripcion ? `<div>${esc(p.descripcion)}</div>` : ''}
      ${(p.productos || []).length > 1 || (mecDe(p) && mecDe(p) !== 'precio') ? lineasPromo(p, 5) : ''}
      <div class="muted small" style="margin-top:3px">${ico('reloj', 's')} ${esc(p.vigencia)}${p.abierto ? '' : ' · el negocio está cerrado ahora'}</div></div></div>`).join('');
}

/** Al tocar una promo: abre el negocio y, si va ligada a un producto, su hoja con la opción ya elegida. */
function abrirPromo(id) {
  const p = (S.promos || []).find(x => x.id === id); if (!p) return;
  const prods = p.productos || [];
  // un solo producto: se abre su hoja; varios: el menú abre en la sección "Promo del día"
  if (prods.length === 1) { S._abrirProd = prods[0].productoId; S._abrirVar = prods[0].variante || ''; }
  else if (prods.length > 1) S._abrirSec = esPromo(p) ? SEC_PROMO : SEC_NOVEDAD;
  if (S.vista === 'negocio' && S.params === p.negocioId) {
    if (S._abrirProd) { const pid = S._abrirProd; S._abrirProd = null; abrirProducto(pid); }
    else if (S._abrirSec) { S._sec.tab = 'menu'; S._sec.s = S._abrirSec; S._abrirSec = null; tabNegocio('menu'); }
    return;
  }
  ir('negocio', p.negocioId);
}

/** Barra inferior: en un negocio muestra su carrito; en inicio, todos (indicando cuántos negocios). */
function barraCarrito(negId) {
  const it = itemsCarrito(negId); if (!it.length) return '';
  const n = it.reduce((s, x) => s + x.cant, 0);
  const t = (negId ? [S.carritos[negId]] : carritosLista()).filter(Boolean).reduce((s, c) => s + descCarrito(c).neto, 0);
  const otros = carritosLista().filter(c => c.negocioId !== negId).length;
  const txt = negId ? 'Ver pedido · ' + n + (otros ? ' <span style="opacity:.8;font-weight:700">+' + otros + ' negocio' + (otros > 1 ? 's' : '') + '</span>' : '')
    : (otros > 1 ? 'Ver carrito · ' + otros + ' negocios' : 'Ver pedido · ' + n);
  return `<div style="height:64px"></div><div class="barra" onclick="ir('carrito')"><span>${ico('bolsa', 's')} ${txt}</span><span>${money(t)}</span></div>`;
}

function vBuscar() {

function buscarDemora() { clearTimeout(S._tB); S._tB = setTimeout(buscarAhora, 350); }
async function buscarAhora() {

        ${p.foto ? `<img class="thumb" src="${esc(p.foto)}" alt="" loading="lazy">` : '<div class="thumb">🍽️</div>'}
        <div class="grow"><b>${esc(p.nombre)}</b><div class="muted small">${esc(p.negocio)}${p.abierto ? '' : ' · cerrado'}</div><div class="b" style="margin-top:4px">${precioTxt(p)}</div></div></div>`).join('')}</div>` : '') ||
      `<div class="vacio"><span class="big">🤔</span>No encontramos “${esc(q)}”</div>`;
  } catch (e) { $('#resB').innerHTML = `<div class="vacio">${esc(e.message)}</div>`; }
}

/* ============ PERFIL DEL NEGOCIO ============ */
/** Datos del negocio: el catálogo (fresco) manda sobre el menú guardado para abierto/cerrado y estrellas. */
function mezclarNegocio(d) {
  const enCat = (S._negs || []).find(x => x.id === d.negocio.id);
  return enCat ? Object.assign({}, d, { negocio: Object.assign({}, d.negocio, enCat) }) : d;
}

async function vNegocio(id, silencioso) {
  let d = menuLocal(id);
  const enCat = (S._negs || []).find(x => x.id === id);
  const guardado = menusLocales()[id];
  if (!d) { d = await api('menu', { negocioId: id }); aplicarMenuFresco(d); }
  else if ((enCat && guardado.ver !== enCat.menuVer) || Date.now() - guardado.t > 10 * 60000) refrescarMenu(id);
  if (S.vista !== 'negocio' || S.params !== id) return;
  if (!silencioso) sumarPref(id, 1);
  d = mezclarNegocio(d);
  S._menu = d;
  const n = d.negocio;
  const opciones = seccionesMenu(d);
  if (!S._sec || S._sec.neg !== id || !opciones.includes(S._sec.s)) S._sec = { neg: id, s: opciones[0], tab: 'menu' };
  if (S._abrirSec && opciones.includes(S._abrirSec)) { S._sec.s = S._abrirSec; S._sec.tab = 'menu'; }
  S._abrirSec = null;
  const km = distanciaTxt(n);
  html(`<div class="hero">${n.portada ? `<img src="${esc(n.portada)}" alt="">` : (ICONO_CAT[n.categoria] || '🍽️')}
      <button class="redondo" onclick="volver('inicio')" aria-label="Volver">${ico('atras')}</button>
      <button class="redondo compartir" onclick="compartirNegocio(this,'${n.id}',S._menu.negocio.nombre)" aria-label="Compartir">${ico('compartir')}</button></div>
    <div class="negH">
      ${n.logo ? `<img class="logoBig" src="${esc(n.logo)}" alt="">` : `<div class="logoBig">${ICONO_CAT[n.categoria] || '🍽️'}</div>`}
      <h1>${esc(n.nombre)}</h1>
      <div class="muted">${esc(n.categoria)}${km ? ' • ' + km : ''} • ${rangoTiempo(n)}</div>
      <div class="row" style="margin-top:6px;gap:8px">${estrellas(n.calif, n.numCalif)}${n.numCalif ? '<span class="muted small">reseñas</span>' : ''}
        <span class="tag ${n.abierto ? 't-ok' : 't-gray'}">${esc(n.estadoTexto)}</span></div>
      ${n.descripcion ? `<p class="muted" style="margin:10px 0 0">${esc(n.descripcion)}</p>` : ''}
    </div>
    <div class="tabs"><button class="${S._sec.tab === 'menu' ? 'on' : ''}" onclick="tabNegocio('menu')">Menú</button><button class="${S._sec.tab === 'info' ? 'on' : ''}" onclick="tabNegocio('info')">Información</button></div>
    <div id="tabCont"></div>
    <div id="barraC">${barraCarrito(n.id)}</div>`);
  pintarTabNegocio();
  if (S._abrirProd) { const pid = S._abrirProd; S._abrirProd = null; abrirProducto(pid); }
}

/** El menú guardado se mostró al instante; aquí se trae la versión nueva y se repinta sin mover la pantalla. */
function refrescarMenu(id) {
  api('menu', { negocioId: id }).then(m => {
    const antes = JSON.stringify((menuLocal(id) || {}).productos);
    aplicarMenuFresco(m);
    if (S.vista !== 'negocio' || S.params !== id || $('#modal').classList.contains('on')) return;
    S._menu = mezclarNegocio(m);
    if (JSON.stringify(m.productos) !== antes && $('#tabCont')) pintarTabNegocio();
    else if ($('#prods')) pintarProductos();
  }).catch(() => { });
}

function tabNegocio(t) {
  S._sec.tab = t;
  document.querySelectorAll('.tabs button').forEach((b, i) => b.classList.toggle('on', (i === 0) === (t === 'menu')));
  pintarTabNegocio();
}

function pintarTabNegocio() {
  const d = S._menu, n = d.negocio;
  if (S.map) { try { S.map.remove(); } catch (e) { } S.map = null; }
  if (S._sec.tab === 'info') {
    if (!window.L || !L.map) { $('#tabCont').innerHTML = '<div class="cargando">Cargando…</div>'; cargarLeaflet().then(() => { if (S._sec.tab === 'info' && S.vista === 'negocio') pintarTabNegocio(); }).catch(e => toast(e.message, 'err')); return; }
    const hs = n.horarios && n.horarios.length === 7 ? n.horarios : null;
    const hoy = new Date().getDay();
    const pagos = [n.pagos.efectivo && `<span class="tag t-pri">${ico('efectivo', 's')} Efectivo</span>`, n.pagos.transferencia && `<span class="tag t-pri">${ico('banco', 's')} Transferencia</span>`, n.pagos.codi && `<span class="tag t-pri">${ico('qr', 's')} CoDi</span>`].filter(Boolean).join(' ');
    $('#tabCont').innerHTML = `
      ${!n.abierto ? `<div class="aviso warn">${esc(n.estadoTexto)}</div>` : ''}
      <div class="card"><b>${ico('reloj', 's')} Horario</b><div style="margin-top:6px">${hs ? [1, 2, 3, 4, 5, 6, 0].map(i => `<div class="dia ${i === hoy ? 'hoy' : ''}"><span>${DIAS[i]}${i === hoy ? ' (hoy)' : ''}</span><span>${hs[i].on ? esc(hs[i].a) + ' – ' + esc(hs[i].c) : 'Cerrado'}</span></div>`).join('') : '<div class="muted">Abre según disponibilidad del negocio</div>'}</div></div>
      <div class="card"><b>${ico('pin', 's')} Ubicación</b><div class="muted" style="margin:4px 0 8px">${esc(n.direccion || 'La Cruz de Elota')}</div>
        <div id="mapaInfo" class="mapa"></div>
        <div class="btns"><a class="btn" href="${gmaps(n.lat, n.lng)}" target="_blank">${ico('mapa', 's')} Cómo llegar</a>${telLink(n.telefono)}</div></div>
      <div class="card"><b>Formas de pago</b><div class="row wrap" style="margin-top:8px;gap:6px">${pagos}</div>
        <div class="muted small" style="margin-top:8px">Pagas directo al negocio, sin comisiones. Preparación promedio: ${n.tiempoPrep} min.</div></div>`;
    const m = nuevoMapa('mapaInfo', n.lat, n.lng, 16);
    L.marker([n.lat, n.lng], { icon: pinIcono('🍴', '#22281D') }).addTo(m);
    return;
  }
  if (!d.productos.length) { $('#tabCont').innerHTML = '<div class="vacio">Este negocio aún no tiene menú</div>'; return; }
  const opciones = seccionesMenu(d);
  if (!opciones.includes(S._sec.s)) S._sec.s = opciones[0];
  const prNeg = promosDe(n.id);
  $('#tabCont').innerHTML = `${!n.abierto ? `<div class="aviso warn">Puedes ver el menú, pero ahora no recibe pedidos.</div>` : ''}
    ${prNeg.length ? `<div class="promoWrap"><div class="promoFila">${prNeg.map(slidePromo).join('')}</div></div>` : ''}
    <div class="menuWrap">
      <div class="secs">${opciones.map(s => `<button class="sec ${s === S._sec.s ? 'on' : ''}" data-s="${esc(s)}" onclick="elegirSec(this)">${esc(s)}</button>`).join('')}</div>
      <div class="prods" id="prods"></div></div>`;
  pintarProductos();
}

function elegirSec(el) {
  S._sec.s = el.dataset.s;
  document.querySelectorAll('.sec').forEach(x => x.classList.toggle('on', x === el));
  pintarProductos();
}

function pintarProductos() {
  const d = S._menu, s = S._sec.s;
  if (!$('#prods')) return;
  const enCarrito = {};
  itemsCarrito(d.negocio.id).forEach(x => enCarrito[x.id] = (enCarrito[x.id] || 0) + x.cant);
  const grupos = {}, ids = idsPromo(d.negocio.id);
  // la promoción del día va primero (en "Todo" y en su propia sección)
  if ((s === 'Todo' || s === SEC_PROMO) && ids.size) grupos[SEC_PROMO] = d.productos.filter(p => ids.has(p.id));
  const nov = idsPromo(d.negocio.id, 'anuncio');
  if ((s === 'Todo' || s === SEC_NOVEDAD) && nov.size) grupos[SEC_NOVEDAD] = d.productos.filter(p => nov.has(p.id));
  if (s !== SEC_PROMO && s !== SEC_NOVEDAD) d.productos.filter(p => s === 'Todo' || p.categoria === s).forEach(p => (grupos[p.categoria] = grupos[p.categoria] || []).push(p));
  const tarjeta = p => `<div class="pCard" onclick="abrirProducto('${p.id}')">
      ${enCarrito[p.id] ? `<span class="enCarrito">${enCarrito[p.id]}</span>` : ''}
      ${(et => et ? `<span class="tagPromo">${esc(et)}</span>` : '')(etiquetaProducto(d.negocio.id, p.id))}
      <div class="img">${p.foto ? `<img src="${esc(p.foto)}" alt="" loading="lazy" decoding="async">` : '🍽️'}</div>
      <div class="info"><b class="clamp2">${esc(p.nombre)}</b>
        ${p.descripcion ? `<div class="desc clamp2">${esc(p.descripcion)}</div>` : ''}
        <div class="pie"><div><span class="precio">${precioTxt(p)}</span><span class="min">${ico('reloj', 's')} ${p.tiempoPrep || d.negocio.tiempoPrep} min</span></div>
          <span class="mas">${ico('mas', 's')}</span></div></div></div>`;
  // dentro de cada sección, las subsecciones van como subtítulos (como en una carta)
  const bloque = (g, l) => {
    const subs = g === SEC_PROMO || g === SEC_NOVEDAD ? [] : [...new Set(l.map(p => p.subcategoria || ''))];
    if (subs.length <= 1 && !subs[0]) return `<div class="grid2" style="margin-bottom:12px">${l.map(tarjeta).join('')}</div>`;
    return subs.sort((a, b) => (a ? 1 : 0) - (b ? 1 : 0)).map(sb => `${sb ? `<div class="subTit">${esc(sb)}</div>` : ''}<div class="grid2" style="margin-bottom:12px">${l.filter(p => (p.subcategoria || '') === sb).map(tarjeta).join('')}</div>`).join('');
  };
  $('#prods').innerHTML = Object.keys(grupos).map(g => `${s === 'Todo' ? `<h3 class="secTit">${esc(g)}</h3>` : ''}${bloque(g, grupos[g])}`).join('');
}

/** Hoja de producto: extras, opciones "sin", indicaciones y cantidad. */
function abrirProducto(pid) {
  const d = S._menu, n = d.negocio, p = d.productos.find(x => x.id === pid);
  if (!p) return;
  const vars = p.variantes || [];
  // si viene de una promo de una variante, esa opción queda elegida
  let vi = vars.length ? Math.max(0, vars.findIndex(v => v.nombre === S._abrirVar)) : -1;
  S._abrirVar = '';
  S._hoja = { p, cant: 1, v: vi, grupos: gruposDe(p, d.grupos) };
  const prV = v => { const b = precioBase(n.id, p, v.nombre); return b.antes ? `<span class="tachado">${money(b.antes)}</span><span class="precioPromo">${money(b.precio)}</span>` : money(b.precio); };
  const promoTxt = promosDe(n.id).filter(x => mecDe(x) && mecDe(x) !== 'primera' && (enPromo(x, p.id, mecDe(x) === 'precio' ? x.productos : null) || (x.regalos || []).some(y => y.productoId === p.id)))
    .map(x => `<div class="aviso err" style="margin:8px 0 0;background:var(--err-s)">🏷️ ${mecDe(x) !== 'precio' ? '<b>' + esc(x.etiqueta || etiquetaPromo(x)) + '</b> · ' : ''}${esc(x.titulo)}${mecDe(x) === 'regalo' && (x.regalos || []).some(y => y.productoId === p.id) && !enPromo(x, p.id) ? ' (este producto es el regalo)' : ''} · ${esc(x.vigencia)}</div>`).join('');
  modal(`${p.foto ? `<img class="hojaImg" src="${esc(p.foto)}" alt="">` : ''}
    <div class="row between" style="align-items:flex-start"><h2 style="margin:0">${esc(p.nombre)}</h2><button class="redondo" onclick="cerrarModal()" aria-label="Cerrar">✕</button></div>
    ${p.descripcion ? `<p class="muted" style="margin:6px 0">${esc(p.descripcion)}</p>` : ''}
    <div class="row wrap" style="gap:14px;margin-top:4px"><b style="font-size:20px">${precioTxt(p, n.id)}</b><span class="muted">${ico('reloj', 's')} ${p.tiempoPrep || n.tiempoPrep} min de preparación</span></div>
    ${promoTxt}
    ${vars.length ? `<div class="grupoT"><b>Elige una opción</b><span class="tag t-pri">Obligatorio</span></div>
      ${vars.map((v, i) => `<label class="opc"><input type="radio" name="hVar" ${i === vi ? 'checked' : ''} onchange="S._hoja.v=${i};totalHoja()"><span>${esc(v.nombre)}</span><b>${prV(v)}</b></label>`).join('')}` : ''}
    ${S._hoja.grupos.map((g, gi) => `<div class="grupoT"><b>${esc(g.nombre)}</b><span class="${g.obligatorio ? 'tag t-pri' : 'muted small'}">${g.obligatorio ? 'Obligatorio' : 'Opcional'}${g.max > 1 ? ' · hasta ' + g.max : ''}</span></div>
      ${g.opciones.map((o, oi) => `<label class="opc"><input type="${g.max === 1 && g.obligatorio ? 'radio' : 'checkbox'}" name="hG${gi}" class="hGr" data-g="${gi}" data-o="${oi}" onchange="limiteGrupo(this);totalHoja()"><span>${esc(o.nombre)}</span><b>${o.precio ? '+' + money(o.precio) : ''}</b></label>`).join('')}`).join('')}
    ${p.extras.length ? `<div class="grupoT"><b>¿Agregar algo extra?</b><span class="muted small">Opcional</span></div>
      ${p.extras.map((e, i) => `<label class="opc"><input type="checkbox" class="hEx" data-i="${i}" onchange="totalHoja()"><span>${esc(e.nombre)}</span><b>${e.precio ? '+' + money(e.precio) : 'Gratis'}</b></label>`).join('')}` : ''}
    ${p.quitar.length ? `<div class="grupoT"><b>¿Prefieres sin…?</b><span class="muted small">Opcional</span></div>
      ${p.quitar.map((q, i) => `<label class="opc"><input type="checkbox" class="hSin" data-i="${i}"><span>Sin ${esc(q)}</span></label>`).join('')}` : ''}
    <div class="grupoT"><b>Indicaciones especiales</b><span class="muted small">Opcional</span></div>
    <textarea class="i" id="hNota" maxlength="120" placeholder="Ej. bien dorado, salsa aparte, poco hielo…"></textarea>
    <div class="row between" style="margin-top:16px">
      <div class="cant"><button onclick="cantHoja(-1)">${ico('menos', 's')}</button><b id="hCant">1</b><button onclick="cantHoja(1)">${ico('mas', 's')}</button></div>
      <button class="btn pri pill" style="flex:1;margin-left:12px" ${n.abierto || esAdminU() ? '' : 'disabled'} onclick="agregarHoja()">${n.abierto || esAdminU() ? 'Agregar · <span id="hTot">' + money(precioBase(n.id, p, vi >= 0 ? vars[vi].nombre : '').precio) + '</span>' : 'No recibe pedidos ahora'}</button></div>`);
}

function selHoja() {
  const p = S._hoja.p, negId = S._menu.negocio.id;
  const extras = [...document.querySelectorAll('.hEx')].filter(x => x.checked).map(x => p.extras[+x.dataset.i]);
  const sin = [...document.querySelectorAll('.hSin')].filter(x => x.checked).map(x => p.quitar[+x.dataset.i]);
  const nota = ($('#hNota').value || '').trim();
  const variante = S._hoja.v >= 0 ? p.variantes[S._hoja.v] : null;
  const b = precioBase(negId, p, variante ? variante.nombre : '');
  const mods = S._hoja.grupos.map((g, gi) => ({ g: g.id, grupo: g.nombre, o: [...document.querySelectorAll('.hGr[data-g="' + gi + '"]')].filter(x => x.checked).map(x => g.opciones[+x.dataset.o]) })).filter(m => m.o.length);
  const extra = extras.reduce((s, e) => s + e.precio, 0) + mods.reduce((s, m) => s + m.o.reduce((a, o) => a + (Number(o.precio) || 0), 0), 0);
  return { extras, sin, nota, mods, variante: variante ? variante.nombre : '', unit: b.precio + extra, antes: b.antes ? b.antes + extra : 0, promo: b.promo, base: b.antes || b.precio };
}
/** No deja marcar más opciones de las permitidas en un grupo (desmarca la más antigua). */
function limiteGrupo(el) {
  if (el.type !== 'checkbox' || !el.checked) return;
  const g = S._hoja.grupos[+el.dataset.g], marcadas = [...document.querySelectorAll('.hGr[data-g="' + el.dataset.g + '"]')].filter(x => x.checked && x !== el);
  if (marcadas.length >= g.max) marcadas.slice(0, marcadas.length - g.max + 1).forEach(x => { x.checked = false; });
}
function totalHoja() { const t = $('#hTot'); if (t) t.textContent = money(selHoja().unit * S._hoja.cant); }
function cantHoja(k) { S._hoja.cant = Math.max(1, Math.min(50, S._hoja.cant + k)); $('#hCant').textContent = S._hoja.cant; totalHoja(); }

function agregarHoja() {
  const n = S._menu.negocio, p = S._hoja.p, s = selHoja();
  const falta = S._hoja.grupos.find(g => g.obligatorio && !s.mods.some(m => m.g === g.id));
  if (falta) { toast('Elige ' + falta.nombre.toLowerCase(), 'err'); const el = document.querySelector('.hGr[data-g="' + S._hoja.grupos.indexOf(falta) + '"]'); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  // cada negocio tiene su propio carrito: agregar de otro negocio ya no vacía el anterior
  const c = S.carritos[n.id] = S.carritos[n.id] || { negocioId: n.id, negocio: n.nombre, logo: n.logo || '', lat: n.lat, lng: n.lng, items: {}, t: Date.now() };
  c.negocio = n.nombre; c.logo = n.logo || ''; c.lat = n.lat; c.lng = n.lng;
  if (!Object.keys(c.items).length && carritosLista().length >= 4) { toast('Puedes pedir a máximo 4 negocios a la vez', 'err'); return; }
  // misma combinación de extras/sin/nota = misma línea del carrito
  const key = [p.id, s.variante, s.extras.map(e => e.nombre).sort().join('+'), s.sin.slice().sort().join('+'), s.nota, s.mods.map(m => m.g + ':' + m.o.map(o => o.nombre).sort().join('+')).join(',')].join('|');
  const it = c.items[key] || { key, id: p.id, nombre: p.nombre, foto: p.foto, precio: s.unit, variante: s.variante, extras: s.extras, sin: s.sin, nota: s.nota, mods: s.mods, cant: 0 };
  it.precio = s.unit; it.antes = s.antes; it.promo = s.promo; it.base = s.base;
  it.cant = Math.min(50, it.cant + S._hoja.cant);
  c.items[key] = it;
  guardarCarritos();
  cerrarModal();
  toast('Agregado: ' + it.nombre + ' ✓');
  pintarProductos();
  $('#barraC').innerHTML = barraCarrito(n.id);
}

/* ============ CARRITOS (uno por negocio) ============ */
function subtotalCarrito(c) { return Object.values(c.items).reduce((s, x) => s + x.cant * x.precio, 0); }
function envioEstimado(c, lat, lng) {
  if (!lat || !c.lat || !S.conf) return null;
  const km = kmRuta(c.lat, c.lng, lat, lng);
  return km <= S.conf.kmMaximo || zonaDe(lat, lng) ? envioNegocio(c.negocioId, km, lat, lng) : -1; // -1 = fuera del área (las zonas siempre entregan)
}
/** Envío de un negocio: con reparto propio puede ser gratis o un precio fijo; si no, la tarifa de la app. */
function envioNegocio(negId, km, lat, lng) {
  const n = (S._negs || []).find(x => x.id === negId), e = n && n.envioPropio;
  if (e && e.tipo === 'gratis') return 0;
  if (e && e.tipo === 'fijo' && e.monto > 0) return e.monto;
  return tarifa(km, lat, lng);
}
function negocioAbierto(id) { const n = (S._negs || []).find(x => x.id === id); return n ? n.abierto : true; }

function vCarrito() {
  // precios al día con los menús y las promos guardadas (si una promo terminó, se ve aquí y no al confirmar)
  let cambio = false;
  carritosLista().forEach(c => { const m = menuLocal(c.negocioId); if (m && repreciarCarrito(m)) cambio = true; });
  if (cambio) toast('Actualizamos los precios de tu carrito');
  const lista = carritosLista(), u = S.user || {};
  // primera compra: se pregunta al servidor una vez y se vuelve a pintar
  if (S.token && !S._primeraCargando && lista.some(c => (S._primera || {})[c.negocioId] === undefined && mecsDe(c.negocioId).some(p => mecDe(p) === 'primera'))) {
    S._primeraCargando = true;
    cargarPrimera(lista.map(c => c.negocioId)).finally(() => { S._primeraCargando = false; if (S.vista === 'carrito') vCarrito(); });
  }
  const top = `<div class="titBar"><button class="redondo" onclick="volver('inicio')">${ico('atras')}</button><h2>${lista.length > 1 ? 'Tus pedidos' : 'Tu pedido'}</h2><span class="esp"></span></div>`;
  if (!lista.length) { html(top + `<div class="vacio"><span class="big">🛍️</span>Tu carrito está vacío<br><br><button class="btn pri pill" onclick="ir('inicio')">Ver restaurantes</button></div>`); return; }
  // qué carritos entran en este pedido (los de negocios cerrados quedan fuera, se guardan para después)
  S.sel = S.sel || {};
  lista.forEach(c => { if (S.sel[c.negocioId] === undefined) S.sel[c.negocioId] = true; if (!negocioAbierto(c.negocioId)) S.sel[c.negocioId] = false; });
  S._lineas = {};
  let sub = 0, env = 0, envSin = false, nSel = 0;
  const bloques = lista.map(c => {
    const abierto = negocioAbierto(c.negocioId), sel = S.sel[c.negocioId];
    const ds = descCarrito(c), s = ds.neto, e = envioEstimado(c, u.lat, u.lng);
    if (sel) { nSel++; sub += s; if (e > 0) env += e; else envSin = true; }
    const its = Object.values(c.items);
    S._lineas[c.negocioId] = its;
    return `<div class="card" style="${sel ? '' : 'opacity:.6'}">
      <div class="row between" style="margin-bottom:4px">
        <label class="row" style="gap:8px;cursor:pointer">${lista.length > 1 ? `<input type="checkbox" ${sel ? 'checked' : ''} ${abierto ? '' : 'disabled'} onchange="S.sel['${c.negocioId}']=this.checked;vCarrito()" style="width:20px;height:20px;accent-color:var(--pri)">` : ''}
          ${c.logo ? `<img src="${esc(c.logo)}" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover">` : ''}<b style="font-size:16px">${esc(c.negocio)}</b></label>
        <button class="lnk" onclick="vaciarCarrito('${c.negocioId}')">Quitar</button></div>
      ${abierto ? '' : '<div class="aviso warn" style="margin:6px 0">Este negocio no recibe pedidos ahora. Guardamos tu carrito para después.</div>'}
      ${its.map((x, i) => { const dd = detalleItem(x); return `<div class="linea">
        ${x.foto ? `<img class="thumb" src="${esc(x.foto)}" alt="">` : '<div class="thumb">🍽️</div>'}
        <div class="grow"><b>${esc(x.nombre)}</b>${x.promo ? ' <span class="tag t-err">PROMO</span>' : ''}${ds.porLinea[i] ? ' <span class="tag t-err">−' + money(ds.porLinea[i]) + '</span>' : ''}${dd ? `<div class="detalle">${dd}</div>` : ''}<div class="b" style="margin:6px 0 8px">${x.antes ? `<span class="tachado">${money(x.antes * x.cant)}</span><span class="precioPromo">${money(x.precio * x.cant)}</span>` : money(x.precio * x.cant)}</div>
          <div class="cant" style="display:inline-flex"><button onclick="cambiarCarrito('${c.negocioId}',${i},-1)">${ico('menos', 's')}</button><b>${x.cant}</b><button onclick="cambiarCarrito('${c.negocioId}',${i},1)">${ico('mas', 's')}</button></div></div>
        <button class="basura" onclick="cambiarCarrito('${c.negocioId}',${i},-99)" aria-label="Quitar">${ico('basura')}</button></div>`; }).join('')}
      ${ds.regalos.map(g => `<div class="aviso ok" style="margin:8px 0;cursor:pointer;display:flex;align-items:center;gap:8px" onclick="agregarRegalo('${c.negocioId}','${g.promo.id}')"><span style="font-size:22px">🎁</span><span class="grow"><b>¡Te toca ${g.faltan > 1 ? g.faltan + ' regalos' : 'un regalo'}!</b><br><span class="small">${esc(g.promo.titulo)}</span></span><span class="btn sm pri">Agrega tu regalo</span></div>`).join('')}
      <button class="lnk" onclick="ir('negocio','${c.negocioId}')">${ico('mas', 's')} Agregar más de ${esc(c.negocio)}</button>
      ${ds.total || ds.primeraNota ? `<div class="tot" style="margin-top:6px"><span>Productos</span><span>${money(ds.bruto)}</span></div>${lineasDesc(c, ds)}` : ''}
      <div class="tot" style="margin-top:6px"><span>Subtotal</span><span>${money(s)}</span></div>
      <div class="tot"><span>Envío</span><span>${e === null ? '<span class="muted small">Se calcula con tu dirección</span>' : e < 0 ? '<span style="color:var(--err)" class="small">Fuera del área</span>' : money(e)}</span></div></div>`;
  }).join('');
  html(top + bloques + `
    <div class="card"><b style="font-size:16px">Resumen</b>
      ${lista.length > 1 ? `<div class="muted small" style="margin-top:4px">${nSel} pedido${nSel === 1 ? '' : 's'}: cada negocio prepara y envía el suyo por separado, con su propio costo de envío.</div>` : ''}
      <div class="tot" style="margin-top:8px"><span>Subtotal</span><span>${money(sub)}</span></div>
      <div class="tot"><span>Envío${nSel > 1 ? 's (' + nSel + ')' : ''}</span><span>${envSin && !env ? '<span class="muted small">Se calcula con tu dirección</span>' : money(env) + (envSin ? '*' : '')}</span></div>
      <div class="tot g"><span>Total</span><span>${money(sub + env)}</span></div></div>
    ${S.modoServicio ? `<div class="aviso info">🛵 <b>Servicio para tu cliente:</b> el negocio te dirá a qué hora pasar. Pagas en efectivo al recogerlo; el envío lo arreglas tú con tu cliente.</div>` : ''}
    <button class="btn pri pill full" ${nSel ? '' : 'disabled'} onclick="continuarCarrito()">${S.modoServicio ? 'Enviar servicio al negocio' : 'Continuar' + (nSel > 1 ? ' con ' + nSel + ' pedidos' : '')}</button><div style="height:20px"></div>`);
}

function cambiarCarrito(negId, i, k) {
  const it = ((S._lineas || {})[negId] || [])[i]; if (!it) return;
  const c = S.carritos[negId]; if (!c) return;
  const x = c.items[it.key]; if (!x) return;
  x.cant = Math.min(50, x.cant + k); if (x.cant <= 0) delete c.items[it.key];
  guardarCarritos(); vCarrito();
}
function vaciarCarrito(negId) {
  const c = S.carritos[negId]; if (!c) return;
  if (!confirm('¿Quitar tu carrito de ' + c.negocio + '?')) return;
  delete S.carritos[negId]; guardarCarritos(); vCarrito();
}
/** Carritos que entran en este pedido. */
function carritosSel() { return carritosLista().filter(c => S.sel && S.sel[c.negocioId] !== false && negocioAbierto(c.negocioId)); }

function continuarCarrito() {
  if (!carritosSel().length) { toast('Elige al menos un negocio', 'err'); return; }
  if (S.modoServicio && esStaff()) { act(document.activeElement, enviarServicio); return; } // servicio del repartidor: va directo al negocio
  if (!S.token) { S.despues = 'entrega'; toast('Entra o crea tu cuenta para continuar'); ir('entrar'); return; }
  if (esAdminU() && !S.modoCliente) { S.modoCliente = true; ls('modoCliente', 1); S.modoRep = false; ls('modoRep', null); pintarNav(); }
  if (esStaff() && !S.modoCliente) { S.modoCliente = true; ls('modoCliente', 1); pintarNav(); }
  ir('entrega');
}

/* ============ DATOS DE ENTREGA (los mismos para todos los negocios) ============ */
function vEntrega() {
  const cs = carritosSel();
  if (!cs.length) { ir('carrito'); return; }
  const u = S.user;
  const e = S.entrega = S.entrega || {
    tipo: 'domicilio', direccion: u.direccion || '', referencia: u.referencia || '',
    lat: u.lat || 0, lng: u.lng || 0, recibeNombre: u.nombre, recibeTel: u.telefono, notas: '', metodos: {}
  };
  e.metodos = e.metodos || {};
  const nombres = cs.map(c => c.negocio).join(', ');
  html(`<div class="titBar"><button class="redondo" onclick="volver('carrito')">${ico('atras')}</button><h2>Datos de entrega</h2><span class="esp"></span></div>
    <h3 style="margin-top:4px">¿Cómo quieres recibir tu pedido?</h3>
    <div class="opcion ${e.tipo === 'domicilio' ? 'on' : ''}" onclick="tipoEntrega('domicilio')"><span class="radio"></span><span class="ico">${ico('casa')}</span>
      <div class="grow"><b>A domicilio</b><small>${cs.length > 1 ? 'Cada negocio te lo envía por separado' : 'Te lo llevamos hasta donde estés'}</small></div></div>
    <div class="opcion ${e.tipo === 'recoger' ? 'on' : ''}" onclick="tipoEntrega('recoger')"><span class="radio"></span><span class="ico">${ico('tienda')}</span>
      <div class="grow"><b>Recoger en ${cs.length > 1 ? 'los restaurantes' : 'restaurante'}</b><small>Tu pedido estará listo en ${esc(nombres)}</small></div></div>
    <div id="entregaCampos"></div>
    <h3>¿Quién recibe?</h3>
    <div class="card" style="padding:4px 14px 14px">
      <label class="f">Nombre</label><input class="i" id="eNom" value="${esc(e.recibeNombre)}">
      <label class="f">Teléfono</label><input class="i" id="eTel" type="tel" inputmode="numeric" maxlength="14" value="${esc(e.recibeTel)}">
      <div class="muted small" style="margin-top:6px">${ico('candado', 's')} El repartidor solo ve estos datos mientras tu pedido está abierto; se borran al entregarlo.</div>
      <label class="f">Notas para ${cs.length > 1 ? 'los restaurantes' : 'el restaurante'} (opcional)</label><textarea class="i" id="eNot" placeholder="Ej. traer cambio de $500, llamar al llegar…">${esc(e.notas)}</textarea>
    </div>
    <button class="btn pri pill full" onclick="act(this,continuarEntrega)">Continuar</button><div style="height:20px"></div>`);
  pintarCamposEntrega();
}

function guardarCamposEntrega() {
  const e = S.entrega, v = id => $('#' + id) ? $('#' + id).value : undefined;
  if (v('eDir') !== undefined) { e.direccion = v('eDir'); e.referencia = v('eRef'); }
  if (v('eNom') !== undefined) { e.recibeNombre = v('eNom'); e.recibeTel = v('eTel'); e.notas = v('eNot'); }
  ls('entrega', e);
}

function tipoEntrega(t) {
  guardarCamposEntrega();
  S.entrega.tipo = t;
  document.querySelectorAll('.opcion').forEach((o, i) => o.classList.toggle('on', (i === 0) === (t === 'domicilio')));
  pintarCamposEntrega();
}

function pintarCamposEntrega() {
  const e = S.entrega, cs = carritosSel();
  if (S.map) { try { S.map.remove(); } catch (x) { } S.map = null; }
  if (e.tipo === 'recoger') {
    $('#entregaCampos').innerHTML = cs.map(c => `<div class="entregaBox"><b>${ico('tienda', 's')} ${esc(c.negocio)}</b>
      <div class="muted small" style="margin-top:4px">Te avisamos cuando tu pedido esté listo para que pases por él. Sin costo de envío.</div>
      <div class="btns"><a class="btn sm" href="${gmaps(c.lat, c.lng)}" target="_blank">${ico('mapa', 's')} Cómo llegar</a></div></div>`).join('');
    return;
  }
  $('#entregaCampos').innerHTML = `<h3>Dirección de entrega</h3>
    <div class="conIco">${ico('pin', 's')}<input class="i" id="eDir" value="${esc(e.direccion)}" placeholder="Se llena sola al marcar el mapa (puedes corregirla)" oninput="S.entrega.dirManual=!!this.value"></div>
    <label class="f">Referencia (opcional)</label><input class="i" id="eRef" value="${esc(e.referencia)}" placeholder="Ej. Casa color blanco, junto al parque">
    <div class="row between" style="margin:12px 0 8px"><span class="muted small">Mueve el marcador a la puerta de tu casa</span>
      <button class="btn sm" onclick="miUbicacion((a,b)=>S._sel.fijar(a,b,true))">${ico('pin', 's')} Mi ubicación</button></div>
    <div id="mapaEnt" class="mapa"></div>
    <div class="muted small" id="eEnv" style="margin-top:6px"></div>`;
  S._sel = mapaSelector('mapaEnt', e.lat, e.lng, (la, ln) => {
    const movio = Math.abs((e.lat || 0) - la) > 1e-5 || Math.abs((e.lng || 0) - ln) > 1e-5;
    e.lat = la; e.lng = ln; ls('entrega', e);
    if (!e.dirManual && (movio || !e.direccion)) direccionDesdeMapa(la, ln);
    if (!S.conf) return;
    $('#eEnv').innerHTML = cs.map(c => {
      const v = envioEstimado(c, la, ln);
      return v < 0 ? `<div style="color:var(--err)">${esc(c.negocio)}: fuera del área de entrega</div>`
        : `<div>Envío ${cs.length > 1 ? 'de ' + esc(c.negocio) : 'estimado'}: <b>${money(v)}</b> (${kmRuta(c.lat, c.lng, la, ln).toFixed(1)} km)</div>`;
    }).join('') + (zonaDe(la, ln) ? `<div class="muted small">📍 ${esc(zonaDe(la, ln).nombre)}: tarifa fija de la zona</div>` : '');
  });
}

/** Calle y colonia del punto marcado (OpenStreetMap, gratis). Solo si el cliente no la escribió a mano. */
function direccionDesdeMapa(la, ln) {
  clearTimeout(S._geoT);
  S._geoT = setTimeout(async () => {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 5000);
    try {
      const r = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=es&lat=${la}&lon=${ln}`, { signal: ctl.signal })).json();
      const a = r.address || {};
      const calle = [a.road || a.pedestrian || a.footway || '', a.house_number || ''].filter(Boolean).join(' ');
      const col = a.neighbourhood || a.suburb || a.quarter || a.hamlet || '';
      const txt = [calle, col].filter(Boolean).join(', ') || (r.display_name || '').split(',').slice(0, 2).join(',');
      const i = $('#eDir');
      if (txt && S.entrega && !S.entrega.dirManual && i && i.tagName) { i.value = txt; S.entrega.direccion = txt; ls('entrega', S.entrega); }
    } catch (e) { } finally { clearTimeout(to); }
  }, 700);
}

async function continuarEntrega() {
  guardarCamposEntrega();
  const e = S.entrega;
  if (e.tipo === 'domicilio') {
    if (!e.lat) throw new Error('Marca en el mapa dónde te entregamos');
    if (!(e.direccion || '').trim()) e.direccion = 'Ubicación marcada en el mapa';
    const fuera = carritosSel().filter(c => envioEstimado(c, e.lat, e.lng) < 0);
    if (fuera.length) throw new Error(fuera.map(c => c.negocio).join(', ') + ' no entrega hasta tu ubicación. Quítalo del pedido o elige recoger.');
  }
  if ((e.recibeNombre || '').trim().length < 2) throw new Error('Escribe el nombre de quien recibe');
  if (String(e.recibeTel || '').replace(/\D/g, '').length < 10) throw new Error('El teléfono de quien recibe debe tener 10 dígitos');
  ir('pago');
}

/* ============ MÉTODO DE PAGO (uno por negocio: cada uno acepta formas distintas) ============ */
async function vPago() {
  const e = S.entrega, cs = carritosSel();
  if (!e || !cs.length) { ir('carrito'); return; }
  // datos del negocio: si el catálogo es reciente no se pregunta al servidor; si no, una sola llamada para todos
  const negs = {};
  const viejos = cs.filter(c => { const n = (S._negs || []).find(x => x.id === c.negocioId); if (n && Date.now() - (S._catT || 0) < 120000) { negs[c.negocioId] = n; return false; } return true; });
  if (viejos.length) {
    const ms = await api('menus', { ids: viejos.map(c => c.negocioId) });
    let cambio = false;
    ms.forEach(m => { aplicarMenuFresco(m); if (repreciarCarrito(m)) cambio = true; negs[m.negocio.id] = m.negocio; });
    if (cambio) { toast('Actualizamos los precios de tu carrito'); ir('carrito'); return; }
  }
  await cargarPrimera(cs.map(c => c.negocioId));
  e.metodos = e.metodos || {};
  S._pedirVerif = false; S._sinPago = false;
  let subT = 0, envT = 0;
  S._pagoTot = {};
  const bloques = cs.map(c => {
    const n = negs[c.negocioId] || {}, pg = n.pagos || { efectivo: true };
    const ds = descCarrito(c), sub = ds.neto, envio = e.tipo === 'domicilio' ? envioNegocio(c.negocioId, kmRuta(c.lat, c.lng, e.lat, e.lng)) : 0;
    subT += sub; envT += envio;
    S._pagoTot[c.negocioId] = { sub, envio, desc: ds.total };
    const ops = [];
    const conEnvio = n.envioEnTransfer && envio > 0, montoT = conEnvio ? sub + envio : sub;
    if (pg.transferencia) ops.push(['transferencia', 'banco', 'Transferencia bancaria', 'Pagas ' + money(montoT) + (conEnvio ? ' (comida y envío)' : '') + ' directo a ' + (n.nombre || c.negocio) + ' y adjuntas tu comprobante']);
    if (pg.codi) ops.push(['codi', 'qr', 'CoDi / Dimo', 'Escaneas el QR del negocio desde tu app del banco']);
    if (pg.efectivo) {
      // reglas de efectivo: la app avisa antes; el servidor tiene la última palabra
      const rg = reglaEfectivo(sub + envio, e.tipo);
      if (rg.verificar) S._pedirVerif = true;
      if (S.fueraZona || lsG('fuera')) ops.push(['efectivo', 'efectivo', 'Efectivo', 'Estás fuera de ' + PUEBLO.nombre + ': paga por transferencia', true]);
      else ops.push(['efectivo', 'efectivo', 'Efectivo', rg.ok ? (e.tipo === 'recoger' ? 'Pagas al recoger tu pedido' : 'Pagas ' + money(sub + envio) + ' al repartidor al recibir') + (rg.nota ? '. ' + rg.nota : '') : rg.motivo, !rg.ok]);
    }
    const disp = ops.filter(o => !o[4]);
    const m = e.metodos[c.negocioId];
    if (!disp.some(o => o[0] === m)) e.metodos[c.negocioId] = disp.length === 1 ? disp[0][0] : (disp.find(o => o[0] === 'efectivo') || disp[0] || [''])[0];
    if (!disp.length) S._sinPago = true;
    return `${cs.length > 1 ? `<h3>${esc(c.negocio)}</h3>` : ''}
      ${ops.map(o => o[4] ? `<div class="opcion" style="opacity:.55;cursor:default"><span class="radio"></span><span class="ico">${ico(o[1])}</span><div class="grow"><b>${o[2]}</b><small>🔒 ${esc(o[3])}</small></div></div>`
        : `<div class="opcion ${o[0] === e.metodos[c.negocioId] ? 'on' : ''}" data-n="${c.negocioId}" data-m="${o[0]}" onclick="elegirMetodo(this)"><span class="radio"></span><span class="ico">${ico(o[1])}</span>
        <div class="grow"><b>${o[2]}</b><small>${o[3]}</small></div></div>`).join('')}
      ${n.abierto === false ? `<div class="aviso warn">${esc(c.negocio)}: ${esc(n.estadoTexto || 'no recibe pedidos ahora')}</div>` : ''}
      <div class="muted small" id="nota_${c.negocioId}" style="margin:-2px 0 6px"></div>`;
  }).join('');
  ls('entrega', e);
  const cerrado = cs.some(c => (negs[c.negocioId] || {}).abierto === false);
  html(`<div class="titBar"><button class="redondo" onclick="volver('entrega')">${ico('atras')}</button><h2>Método de pago</h2><span class="esp"></span></div>
    ${S._pedirVerif ? tarjetaVerificar(true) : ''}
    ${S._sinPago ? '<div class="aviso warn">Un negocio de tu pedido solo acepta efectivo y por ahora no puedes pagar así. Verifica tu teléfono o quítalo del pedido.</div>' : ''}
    ${bloques}
    <div class="card" style="margin-top:6px"><b style="font-size:16px">Resumen</b>
      ${cs.map(c => `<div class="tot" style="margin-top:6px"><span>${esc(c.negocio)}${S._pagoTot[c.negocioId].desc ? ' <span class="tag t-err">ahorras ' + money(S._pagoTot[c.negocioId].desc) + '</span>' : ''}</span><span>${money(S._pagoTot[c.negocioId].sub)}</span></div>`).join('')}
      <div class="tot"><span>${e.tipo === 'recoger' ? 'Recoges en el restaurante' : 'Envío' + (cs.length > 1 ? 's (' + cs.length + ')' : '')}</span><span>${money(envT)}</span></div>
      <div class="tot g"><span>Total</span><span>${money(subT + envT)}</span></div></div>
    <div class="seguro">${ico('candado', 's')} Pagas directo a cada negocio, sin comisiones</div>
    ${esAdminU() ? `<label class="opcion" style="border-color:var(--warn)"><input type="checkbox" id="pMuestra" ${cerrado ? 'checked disabled' : S._muestra ? 'checked' : ''} onchange="S._muestra=this.checked">
      <div class="grow"><b>🧪 Pedido de muestra</b><small>Para enseñar la app: el negocio lo recibe en vivo y tú lo entregas en “Ver como repartidor”. No cuenta en ventas ni ranking y se borra a las 24 h.${cerrado ? ' Un negocio de tu pedido está cerrado: solo puede ser de muestra.' : ''}</small></div></label>` : ''}
    <button class="btn pri pill full" ${(cerrado && !esAdminU()) || S._sinPago ? 'disabled' : ''} onclick="act(this,confirmarPedido)">Confirmar ${cs.length > 1 ? cs.length + ' pedidos' : 'pedido'}</button><div style="height:20px"></div>`);
  cs.forEach(c => notaPago(c.negocioId));
}

function elegirMetodo(el) {

function notaPago(neg) {

    : 'Cuando el negocio acepte tu pedido verás sus datos para transferir ' + money(t.sub) + '.' + (t.envio ? ' El envío (' + money(t.envio) + ') se paga en efectivo al repartidor.' : '');

async function confirmarPedido() {
  const e = S.entrega, cs = carritosSel();
  if (cs.some(c => !e.metodos[c.negocioId])) throw new Error('Elige cómo vas a pagar en cada negocio');
  // efectivo a domicilio: se toma la ubicación actual para comprobar que el cliente está en el punto de entrega
  let gps;
  // efectivo: siempre con la ubicación actual (solo se acepta dentro de la ciudad)
  const muestra = esAdminU() && !!($('#pMuestra') && $('#pMuestra').checked);
  if (!muestra && cs.some(c => e.metodos[c.negocioId] === 'efectivo')) gps = await ubicacionActual();
  let r;
  try {
    // todos los pedidos en UNA sola llamada; el servidor valida todos antes de crear alguno
    r = await api('crearPedidos', {
      tipoEntrega: e.tipo, direccion: e.direccion, referencia: e.referencia, lat: e.lat, lng: e.lng, notas: e.notas,
      recibeNombre: e.recibeNombre, recibeTel: e.recibeTel, guardarDireccion: true, gps, muestra: muestra ? 1 : '',
      pedidos: cs.map(c => ({
        negocioId: c.negocioId, metodoPago: e.metodos[c.negocioId], subtotalEsperado: subtotalCarrito(c), descuentoEsperado: descCarrito(c).total,
        items: Object.values(c.items).map(x => ({ productoId: x.id, cant: x.cant, variante: x.variante || '', extras: x.extras.map(z => z.nombre), sin: x.sin, nota: x.nota, mods: (x.mods || []).map(m => ({ g: m.g, o: m.o.map(o => o.nombre) })) }))
      }))
    });
  } catch (err) {
    if (String(err.message).startsWith('EFECTIVO|')) throw new Error(err.message.slice(9));
    if (!String(err.message).startsWith('PRECIOS|')) throw err;
    const [, negId, msg] = err.message.split('|');
    if (S._primera) delete S._primera[negId];
    const ms = await api('menus', { ids: [negId] });
    ms.forEach(m => { aplicarMenuFresco(m); repreciarCarrito(m); });
    toast(msg, 'err');
    ir('carrito');
    return;
  }
  if (e.tipo === 'domicilio') { Object.assign(S.user, { direccion: e.direccion, referencia: e.referencia, lat: e.lat, lng: e.lng }); ls('user', S.user); }
  S._ultimos = r.map(x => Object.assign({}, x, { tipo: e.tipo }));
  r.forEach(x => { sumarPref(x.negocioId, 3); if (S._primera) S._primera[x.negocioId] = false; delete S.carritos[x.negocioId]; delete (S.sel || {})[x.negocioId]; });
  guardarCarritos();
  history.replaceState({ v: 'inicio' }, '');
  ir('listo');
}

/** Título y subtítulo de la píldora sobre el mapa. */
function estadoCliente(p) {
  const rec = p.tipoEntrega === 'recoger';
  const llega = p.eta ? (rec ? 'Listo a las ' : 'Llega aprox. ') + hora(p.eta) + ' (' + enMin(p.eta) + ')' : '';
  switch (p.estado) {
    case 'NUEVO': return { icono: 'tienda', titulo: 'Esperando que el negocio confirme', sub: p.negocio.nombre };
    case 'POR_PAGAR': return { icono: 'banco', titulo: 'Confirmado: realiza tu pago', sub: 'Transfiere y adjunta tu comprobante' };
    case 'PAGO_ENVIADO': return { icono: 'banco', titulo: 'Verificando tu pago', sub: 'El negocio está revisando' };
    case 'PREPARANDO': return { icono: 'reloj', titulo: 'Tu pedido se está preparando', sub: rec ? llega : p.repartidor ? 'Repartidor asignado: ' + p.repartidor.nombre.split(' ')[0] : p.propio ? 'Lo entrega el repartidor del negocio' : 'Buscando repartidor…' };
    case 'LISTO': return rec ? { icono: 'tienda', titulo: '¡Listo para recoger!', sub: 'Pasa por él a ' + p.negocio.nombre }
      : { icono: 'moto', titulo: 'Tu pedido está listo', sub: p.repartidor ? p.repartidor.nombre.split(' ')[0] + ' va por él' : p.propio ? 'Sale en un momento con el repartidor del negocio' : 'Buscando repartidor…' };
    case 'EN_CAMINO': return { icono: 'moto', titulo: 'Tu pedido está en camino', sub: (p.repPropio ? 'Con ' + p.repPropio.nombre + ' · ' : '') + llega };
    case 'ENTREGADO': return { icono: 'check', titulo: 'Pedido entregado', sub: '¡Buen provecho!' };
  }
  return { icono: 'recibo', titulo: EST[p.estado] ? EST[p.estado][0] : p.estado, sub: '' };
}

function tarjetaContacto(p) {
  if (p.tipoEntrega === 'recoger' || !p.repartidor) {
    const busc = p.tipoEntrega !== 'recoger' && !p.propio && ['PREPARANDO', 'LISTO'].includes(p.estado);

function pasos4(p) {

  const ancho = idx < 0 ? 0 : Math.min(idx, 3) / 3 * 80;
  return `<div class="pasos4"><div class="barraP" style="width:${ancho}%"></div>${nombres.map((n, i) =>
    `<div class="paso ${i < idx || (i === idx && i === 3) ? 'ok' : i === idx ? 'act' : ''}"><div class="p">${ico(iconos[i], 's')}</div>${n}</div>`).join('')}</div>`;
}

function dibujarTrk(p) {
  const n = p.negocio, rec = p.tipoEntrega === 'recoger';
  const m = nuevoMapa('mapaTrk', n.lat, n.lng, 15);
  const pts = [[n.lat, n.lng]];
  S._trk = { id: p.id, estado: p.estado };
  L.marker([n.lat, n.lng], { icon: pinIcono('🍴', '#22281D') }).addTo(m).bindPopup(esc(n.nombre));
  if (!rec && p.lat) { L.marker([p.lat, p.lng], { icon: pinIcono('🏠', '#3B5A2C') }).addTo(m).bindPopup('Tu entrega'); pts.push([p.lat, p.lng]); }
  const u = p.repartidor && p.repartidor.ubicacion;
  if (u && u.lat) {
    S._trk.mk = L.marker([u.lat, u.lng], { icon: pinIcono('🛵', '#D9822B'), zIndexOffset: 500 }).addTo(m)
      .bindPopup(esc(p.repartidor.nombre) + (u.fuente === 'gps' ? ' · hace ' + Math.max(0, Math.round((Date.now() - u.fecha) / 60000)) + ' min' : ' · última ubicación conocida'));
    pts.push([u.lat, u.lng]);
  }
  if (!rec && p.lat) {
    const linea = p.estado === 'EN_CAMINO' && u ? [[u.lat, u.lng], [p.lat, p.lng]] : [[n.lat, n.lng], [p.lat, p.lng]];
    S._trk.linea = L.polyline(linea, { color: '#3B5A2C', weight: 4, opacity: .8, dashArray: '2 9', lineCap: 'round' }).addTo(m);
  }
  if (pts.length > 1) m.fitBounds(pts, { padding: [50, 50], maxZoom: 17 });
}
function moverTrk(p) {
  const u = p.repartidor && p.repartidor.ubicacion;
  if (!u || !S._trk) return;
  if (S._trk.mk) S._trk.mk.setLatLng([u.lat, u.lng]);
  else { S._trk.mk = L.marker([u.lat, u.lng], { icon: pinIcono('🛵', '#D9822B'), zIndexOffset: 500 }).addTo(S.map); }
  if (S._trk.linea && p.estado === 'EN_CAMINO') S._trk.linea.setLatLngs([[u.lat, u.lng], [p.lat, p.lng]]);
}

/** Sube un comprobante: las imágenes se comprimen; los PDF (algunos bancos los comparten así) van tal cual. */
async function enviarComprobante(id, f) {
  if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '')) {
    if (f.size > 4 * 1024 * 1024) throw new Error('El PDF pesa más de 4 MB');
    const pdf = await new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).replace(/^data:[^;]*;/, 'data:application/pdf;')); r.onerror = () => mal(new Error('No se pudo leer el PDF')); r.readAsDataURL(f); });
    return api('subirComprobante', { pedidoId: id, pdf });
  }
  return api('subirComprobante', { pedidoId: id, imagen: await comprimir(f, 1400) });
}
async function subirComprobante(id, inp) {
  const f = inp.files[0]; if (!f) return;
  toast('Subiendo comprobante…');
  try { await enviarComprobante(id, f); toast('Comprobante enviado ✓'); pintar(true); }
  catch (e) { toast(e.message, 'err'); }
}

/** Revisa cada 6 s (máximo 3 min) si ya quedó verificado; la notificación push también lo actualiza. */
function esperarVerificacion() {
  clearInterval(S._verifT);
  const t0 = Date.now();
  S._verifT = setInterval(async () => {
    if (!S.token || Date.now() - t0 > 600000) { clearInterval(S._verifT); return; }
    if (document.hidden) return;
    try {
      const d = await api('yo');
      if (d.usuario.telVerificado) {
        clearInterval(S._verifT);
        S.user = d.usuario; ls('user', S.user);
        toast('✅ Teléfono verificado'); pintar(true);

    } catch (e) { }
  }, 6000);
}

/* ---------- reglas de efectivo (la app avisa antes; el servidor decide) ---------- */
function reglaEfectivo(totalEfectivo, tipo) {
  const u = S.user || {}, e = (S.conf && S.conf.efectivo) || {};
  if (e.verificado && !u.telVerificado) return { ok: false, motivo: 'Verifica tu teléfono para pagar en efectivo', verificar: true };
  if (e.topeNuevos > 0 && (u.entregados || 0) < e.pedidosNuevo && totalEfectivo > e.topeNuevos) return { ok: false, motivo: 'En tus primeros ' + e.pedidosNuevo + ' pedidos, máximo ' + money(e.topeNuevos) + ' en efectivo' };
  // con el teléfono verificado ya no se pide estar en el punto de entrega
  const gps = tipo === 'domicilio' && !u.telVerificado && ((u.entregados || 0) - (u.cancelados || 0)) < e.pedidosOtraDir;
  return { ok: true, gps, nota: gps ? 'Solo si estás en el punto de entrega (usaremos tu ubicación al confirmar)' : '' };
}
/** Ubicación actual para comprobar que el cliente está donde recibirá su pedido en efectivo. */
function ubicacionActual() {
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) { mal(new Error('Tu teléfono no permite ubicación. Paga por transferencia.')); return; }
    toast('Comprobando tu ubicación…');
    navigator.geolocation.getCurrentPosition(
      p => ok({ lat: p.coords.latitude, lng: p.coords.longitude, precision: Math.round(p.coords.accuracy || 0) }),
      () => mal(new Error('Activa tu ubicación para pagar en efectivo a domicilio, o elige transferencia.')),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }); // siempre una ubicación nueva, nunca una guardada
  });
}

/** Carga el lector de Excel solo cuando se necesita (con un segundo servidor de respaldo). */
function cargarXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  const fuentes = ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'];
  const probar = i => new Promise((ok, mal) => {
    if (i >= fuentes.length) { mal(new Error('No se pudo cargar el lector de Excel. Revisa tu internet.')); return; }
    const sc = document.createElement('script');
    sc.src = fuentes[i];
    sc.onload = () => window.XLSX ? ok(window.XLSX) : probar(i + 1).then(ok, mal);
    sc.onerror = () => probar(i + 1).then(ok, mal);
    document.head.appendChild(sc);
  });
  return probar(0);
}

function columnasMenu(cfg) {

/** Reconoce cada columna por su encabezado aunque cambie un poco el texto. */
function campoDeEncabezado(h) {
  const t = String(h || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  if (!t) return '';
  if (/^(variante|tamano|presentacion)/.test(t)) return 'variantes';
  if (/^opcion/.test(t)) return 'opciones';
  if (t.includes('extra')) return t.includes('sincosto') || t.includes('gratis') ? 'extrasGratis' : 'extras';
  if (t.includes('quitar') || /^sin/.test(t)) return 'quitar';
  if (/^(subseccion|subcategoria)/.test(t)) return 'subseccion';
  if (/^(seccion|categoria)/.test(t)) return 'seccion';
  if (/^(producto|nombre|platillo)/.test(t)) return 'producto';
  if (/^descripcion/.test(t)) return 'descripcion';
  if (/^(precio|costo)/.test(t)) return 'precio';
  if (t.includes('tiempo') || t.includes('preparacion')) return 'tiempo';
  if (/^disponible/.test(t)) return 'disponible';
  if (/^id/.test(t)) return 'id';
  return '';
}
function campoDeOpcion(h) {
  const t = String(h || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  if (/^grupo/.test(t)) return 'grupo';
  if (/^aplica/.test(t)) return 'aplica';
  if (/^obligatori/.test(t)) return 'obligatorio';
  if (/^(maximo|max)/.test(t)) return 'maximo';
  if (/^opcion/.test(t)) return 'opciones';
  if (/^(noaplica|excluir|excepto)/.test(t)) return 'excluir';
  if (/^id/.test(t)) return 'id';
  return '';
}
/** Lee una hoja: busca la fila de encabezados y arma objetos por campo. */
function leerHoja(XLSX, hoja, reconocer, clave) {
  const aoa = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: '', raw: true });
  const hi = aoa.findIndex(r => r.some(c => reconocer(c) === clave));
  if (hi < 0) return null;
  const campos = aoa[hi].map(reconocer), filas = [];
  aoa.slice(hi + 1).forEach((r, i) => {
    if (!r.some(c => String(c).trim() !== '')) return;
    const o = { _fila: hi + i + 2 };
    campos.forEach((c, j) => { if (c && o[c] === undefined) o[c] = typeof r[j] === 'string' ? r[j].trim() : r[j]; });
    filas.push(o);
  });
  return filas;
}

async function importarExcel(inp) {
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  toast('Leyendo archivo…');
  try {
    const XLSX = await cargarXLSX();
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    let filas = null, grupos = [];
    const hojas = wb.SheetNames.slice().sort((a, b) => (/^men[uú]/i.test(b) ? 1 : 0) - (/^men[uú]/i.test(a) ? 1 : 0));
    for (const nombre of hojas) { if (/^opcion/i.test(nombre)) continue; filas = leerHoja(XLSX, wb.Sheets[nombre], campoDeEncabezado, 'producto'); if (filas) break; }
    const ho = wb.SheetNames.find(n => /^opcion/i.test(n));
    if (ho) grupos = leerHoja(XLSX, wb.Sheets[ho], campoDeOpcion, 'grupo') || [];
    if (!filas && !grupos.length) throw new Error('No encontré la columna "Producto". Usa la plantilla de Pídele.');
    filas = filas || [];
    if (!filas.length && !grupos.length) throw new Error('El archivo no tiene productos');
    S._import = { filas, grupos };
    const r = await api('importarMenu', { filas, grupos });
    vistaPreviaImport(r, f.name);
  } catch (e) { toast(e.message, 'err'); }
}

/** Un grupo de opciones del producto: nombre, opciones en texto, obligatorio y cuántas se eligen. */
function filaOpcion(g) {

  d.querySelector('.opN').value = g.nombre || '';
  d.querySelector('.opO').value = (g.opciones || []).map(o => o.nombre + (o.precio ? ':' + o.precio : '')).join(', ');

  d.querySelector('.opM').value = String(g.max || 1);

function fechaISO(diasMas) { const d = new Date(Date.now() + (diasMas || 0) * 864e5); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function estadoPromoTag(p) {
  if (p.estado === 'oculta') return '<span class="tag t-err">Oculta por el administrador</span>';
  if (p.estado === 'pausada') return '<span class="tag t-gray">⏸️ Pausada</span>';
  if (p.vencida) return '<span class="tag t-gray">Vencida</span>';
  if (p.productos.length && p.agotados === p.productos.length) return '<span class="tag t-warn">Productos agotados: no se muestra</span>';
  if (p.vigenteAhora) return `<span class="tag t-ok">🟢 ${esPromo(p) ? 'Promoción' : 'Anuncio'} activo hoy</span>`;
  return `<span class="tag t-info">${Date.now() < p.inicio ? '📅 Programada' : '🕒 Activa otros días u horario'}</span>`;
}

/** Muestra los campos de la mecánica elegida. */
function actualizarMec() {
  const m = S._promoMec, an = S._promoTipo === 'anuncio', vis = (id, v) => { const e = $('#' + id); if (e) e.style.display = v ? '' : 'none'; };
  vis('prMecBox', !an);
  vis('prNxm', !an && m === 'nxm'); vis('prVal', !an && ['pct', 'monto', 'primera'].includes(m)); vis('prTopeB', m === 'primera'); vis('prReg', !an && m === 'regalo');
  vis('prTodoB', !an && ['pct', 'monto', 'nxm'].includes(m));
  const todo = !an && ['pct', 'monto', 'nxm'].includes(m) && $('#prTodo').checked;
  vis('prProdsB', an || (m !== 'primera' && !todo)); vis('prRegsB', !an && m === 'regalo');
  vis('prProdsT', an || (m !== 'primera' && !todo)); vis('prProdsN', an || (m !== 'primera' && !todo));
  if ($('#prValT')) $('#prValT').textContent = m === 'monto' ? 'Pesos menos por pieza ($)' : 'Descuento (%)';
  const ayuda = {
    precio: 'Pon el precio especial de cada producto. Los que dejes sin precio solo se destacan.',
    nxm: 'Elige los productos que entran. El cliente puede combinarlos y se cobran los de mayor precio. Ej. 2x1: lleva 2, paga el más caro.',
    pct: 'Se descuenta ese % del precio de cada pieza (los extras se cobran completos).',
    monto: 'Se descuentan esos pesos a cada pieza de los productos elegidos. Ej. $21 menos en cualquier hamburguesa.',
    regalo: 'Elige los productos que hay que comprar y abajo el regalo. En su carrito, al cliente le aparece "Agrega tu regalo".',
    primera: 'Para clientes que nunca te han comprado en Pídele. Se descuenta del total de productos (después de otras promos).'
  }[m] || '';
  if ($('#prMecAyuda')) $('#prMecAyuda').textContent = ayuda;
  if ($('#prProdsT')) $('#prProdsT').textContent = an ? 'Productos que quieres dar a conocer (opcional)' : m === 'regalo' ? 'Productos que hay que comprar' : 'Productos en promoción';
  if ($('#prProdsN')) $('#prProdsN').textContent = an ? 'Aparecen en la sección Novedades de tu menú.' : m === 'precio' ? 'Agrega los que quieras. Al menos uno con precio especial; los demás solo se destacan.' : 'Si el producto tiene opciones (tamaños), elige una o "Todas las opciones".';
  document.querySelectorAll('#prProds .prPre').forEach(i => { i.style.display = !an && m === 'precio' ? '' : 'none'; });
  document.querySelectorAll('.prV option[value="*"]').forEach(o => { o.disabled = an || m === 'precio'; if (o.disabled && o.selected) { o.selected = false; o.parentNode.selectedIndex = 1; } });
  prevPromo();
}

/** Renglón de producto en el formulario: producto, opción (si tiene variantes) y precio especial. */
function filaProdPromo(x, reg) {
  x = x || {};
  const prods = (S._prods || []).filter(p => p.disponible !== 'eliminado');
  const d = document.createElement('div');
  d.className = 'card prRow';
  d.style.cssText = 'box-shadow:none;border:1.5px solid var(--ln);padding:10px;margin-bottom:8px';
  d.innerHTML = `<div class="row"><select class="i prP" style="flex:1" onchange="filaProdCambio(this)"><option value="">Elige un producto…</option>
      ${prods.map(p => `<option value="${p.id}" ${p.id === x.productoId ? 'selected' : ''}>${esc(p.nombre)}${p.disponible === 'si' ? '' : ' (agotado)'}</option>`).join('')}</select>
      <button class="btn sm err" onclick="this.closest('.prRow').remove();prevPromo()" aria-label="Quitar">✕</button></div>
    <div class="row prDet" style="margin-top:6px"></div>`;
  $(reg ? '#prRegs' : '#prProds').appendChild(d);
  filaProdCambio(d.querySelector('.prP'), x);
}
function filaProdCambio(sel, x) {
  x = x || {};
  const fila = sel.closest('.prRow'), det = fila.querySelector('.prDet');
  const p = (S._prods || []).find(z => z.id === sel.value);
  if (!p) { det.innerHTML = ''; prevPromo(); return; }
  const vars = p.variantes || [];
  const sinPrecio = S._promoTipo === 'anuncio' || S._promoMec !== 'precio' || fila.closest('#prRegs'), sinTodas = S._promoTipo === 'anuncio' || S._promoMec === 'precio';
  const eleg = x.variante && (x.variante !== '*' || !sinTodas) ? x.variante : vars.length ? (sinTodas ? vars[0].nombre : '*') : '';
  det.innerHTML = `${vars.length ? `<select class="i prV" style="flex:1" onchange="filaNormal(this)"><option value="*" ${eleg === '*' ? 'selected' : ''} ${sinTodas ? 'disabled' : ''}>Todas las opciones</option>${vars.map(v => `<option value="${esc(v.nombre)}" ${v.nombre === eleg ? 'selected' : ''}>${esc(v.nombre)}</option>`).join('')}</select>` : ''}
    <input class="i prPre" type="number" inputmode="decimal" style="flex:1;${sinPrecio ? 'display:none' : ''}" placeholder="Precio especial" value="${x.precioPromo || ''}" oninput="prevPromo()">
    <span class="muted small prNor" style="white-space:nowrap"></span>`;
  filaNormal(det.querySelector('.prV') || det.querySelector('.prPre'));
}
function filaNormal(el) {
  const fila = el.closest('.prRow'), p = (S._prods || []).find(z => z.id === fila.querySelector('.prP').value);
  if (!p) return;
  const v = fila.querySelector('.prV'), vars = p.variantes || [];
  const todas = v && v.value === '*';
  const normal = vars.length ? (todas ? Math.min(...vars.map(x => Number(x.precio) || 0)) : (vars.find(x => x.nombre === (v ? v.value : '')) || vars[0]).precio) : p.precio;
  fila.dataset.normal = normal;
  fila.querySelector('.prNor').textContent = (todas ? 'Desde ' : 'Normal ') + money(normal);
  prevPromo();
}
function productosForm(reg) {
  return [...document.querySelectorAll((reg ? '#prRegs' : '#prProds') + ' .prRow')].map(f => {
    const p = (S._prods || []).find(z => z.id === f.querySelector('.prP').value);
    if (!p) return null;
    const v = f.querySelector('.prV'), pre = f.querySelector('.prPre');
    return { productoId: p.id, nombre: p.nombre, variante: v ? v.value : '', precioPromo: pre && S._promoTipo !== 'anuncio' && S._promoMec === 'precio' && !reg ? pre.value : '', precioAntes: Number(f.dataset.normal) || p.precio };
  }).filter(Boolean);
}

function prevPromo() {

  const n = S.negocio || {};

  const ahorros = prods.filter(x => x.precioPromo).map(x => x.precioAntes - x.precioPromo);
  box.innerHTML = `<div class="promoFila" style="padding:0">${slidePromo({
    id: '', tipo: S._promoTipo, titulo: ($('#prTit') || {}).value || (S._promoTipo === 'anuncio' ? 'Título de tu anuncio' : 'Título de tu promoción'), negocio: n.nombre || '', logo: n.logo || '', categoria: n.categoria,

    productos: prods, ahorroMax: ahorros.length ? Math.max(...ahorros) : 0, ...mecForm(), todoMenu: mecForm().todo
  }).replace('onclick="abrirPromo(\'\')"', '')}</div>`;

/** Datos de la mecánica en el formulario. */
function mecForm() {
  const m = S._promoTipo === 'anuncio' ? 'precio' : S._promoMec, v = id => ($('#' + id) || {}).value || '';
  const [lleva, paga] = m === 'nxm' ? v('prLP').split('-').map(Number) : [m === 'regalo' ? Number(v('prLleva')) || 1 : 0, 0];
  const o = { mecanica: m, valor: Number(v('prValor')) || 0, lleva, paga, tope: m === 'primera' ? Number(v('prTope')) || 0 : 0, todo: ['pct', 'monto', 'nxm'].includes(m) && !!($('#prTodo') || {}).checked };
  o.etiqueta = m === 'precio' ? '' : etiquetaPromo(o);
  return o;
}
async function guardarPromoForm() {
  const dias = [...document.querySelectorAll('.prDia')].filter(x => x.checked).map(x => +x.value);
  if (!dias.length) throw new Error('Elige al menos un día');

/** Mismo cálculo que el servidor. */
function montoSusc() {
  const d = S._susc, m = +$('#sMes').value, e = +$('#sExt').value;
  if (d.tipo === 'repartidor') return (!d.inscrito ? d.inscripcion : 0) + m * d.cuota;
  const cuota = $('#sPlan') && $('#sPlan').value ? d.planes[$('#sPlan').value].precio : d.cuota;
  if (m > 0) return m * cuota + e * d.precioBannerExtra * m;
  const rest = Math.max(1, Math.ceil((d.suscripcion.vence - Date.now()) / 864e5));
  return Math.ceil(e * d.precioBannerExtra * rest / d.diasPorPago / 5) * 5;

function ahoraSrv() { return Date.now() + (S._dt || 0); }
function mmss(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function textoEspera() {
  const ms = S.esperaHasta - Date.now();
  if (ms <= 0) return '<span style="color:var(--ok)">¡Disponible!</span>';
  const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function relojEspera() {
  clearInterval(S._reloj);
  const tick = () => {
    const e = $('#espera'); if (!e || !e.tagName) { clearInterval(S._reloj); return; }
    e.innerHTML = textoEspera();
    const espera = S.esperaHasta > Date.now();
    document.querySelectorAll('.tomar').forEach(b => {
      const desde = Number(b.dataset.desde) || 0, falta = desde - ahoraSrv();
      if (falta > 0) { b.disabled = true; b.textContent = '⏳ Disponible en ' + mmss(falta); b.dataset.p = 1; return; }
      if (b.dataset.p) { b.textContent = 'Tomar pedido'; delete b.dataset.p; b.dataset.w = 1; }
      if (espera) { b.disabled = true; b.dataset.w = 1; } else if (b.dataset.w) { b.disabled = !!S._bloqTomar; delete b.dataset.w; }
    });
  };
  tick(); S._reloj = setInterval(tick, 1000);
}

function urlRuta(ruta) {
  if (!ruta.length) return '#';
  const pts = ruta.map(s => s.lat + ',' + s.lng);
  const dest = pts.pop();
  let u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(dest);
  if (S.pos) u += '&origin=' + encodeURIComponent(S.pos.lat + ',' + S.pos.lng);
  if (pts.length) u += '&waypoints=' + encodeURIComponent(pts.slice(0, 9).join('|'));
  return u;
}
function dibujarRuta(ruta) {
  const ini = S.pos || ruta[0];
  const m = nuevoMapa('mapaRuta', ini.lat, ini.lng, 15);
  const pts = [];
  if (S.pos) { L.marker([S.pos.lat, S.pos.lng], { icon: pinIcono('🛵', '#D9822B') }).addTo(m); pts.push([S.pos.lat, S.pos.lng]); }
  ruta.forEach((s, i) => {
    L.marker([s.lat, s.lng], { icon: pinNum(i + 1, s.tipo === 'recoger' ? '#D9822B' : '#3B5A2C') }).addTo(m).bindPopup((s.tipo === 'recoger' ? 'Recoger: ' : 'Entregar: ') + esc(s.nombre));
    pts.push([s.lat, s.lng]);
  });
  if (pts.length > 1) {
    const recta = L.polyline(pts, { color: '#3B5A2C', weight: 4, opacity: .7, dashArray: '6 8' }).addTo(m);
    m.fitBounds(pts, { padding: [30, 30] });
    if (S.conf && S.conf.rutaCalles) rutaPorCalles(pts, m, recta);
  }
}
/**
 * Recorrido por calles (opcional, Ajustes → rutaCalles): lo calcula el teléfono del repartidor con el servicio
 * gratuito OSRM (OpenStreetMap); no usa el servidor de Pídele. Si falla o tarda, se queda la línea recta.
 */
async function rutaPorCalles(pts, m, recta) {
  const clave = pts.map(p => p[0].toFixed(4) + ',' + p[1].toFixed(4)).join('|');
  S._rutasCalle = S._rutasCalle || {};
  let geo = S._rutasCalle[clave];
  if (!geo) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 5000);
    try {
      const url = 'https://router.project-osrm.org/route/v1/driving/' + pts.map(p => p[1] + ',' + p[0]).join(';') + '?overview=full&geometries=geojson';
      const r = await (await fetch(url, { signal: ctl.signal })).json();
      if (r.code !== 'Ok' || !r.routes || !r.routes[0]) return;
      geo = { linea: r.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), km: r.routes[0].distance / 1000, min: r.routes[0].duration / 60 };
      S._rutasCalle[clave] = geo;
    } catch (e) { return; } finally { clearTimeout(to); }
  }
  if (S.map !== m || !document.body.contains(m.getContainer())) return;
  m.removeLayer(recta);
  L.polyline(geo.linea, { color: '#3B5A2C', weight: 5, opacity: .85 }).addTo(m);
  const info = $('#rutaInfo');
  if (info && info.tagName) info.textContent = geo.km.toFixed(1) + ' km por calles · ~' + Math.round(geo.min) + ' min';
}

/** Tablero general: el resumen de cada municipio (cada uno en su servidor) y el total. */
async function resumenPueblos(propio) {
  const filas = await Promise.all(PUEBLOS.map(async pb => {
    if (pb.id === PUEBLO.id) return { pb, d: propio, c: await api('adminComisiones').catch(() => null) };
    const tok = lsDe(pb.id, 'token');
    if (!tok) return { pb, falta: true };
    try { const [d, c] = await Promise.all([apiDe(pb, 'adminResumen', {}, tok), apiDe(pb, 'adminComisiones', {}, tok)]); return { pb, d, c }; }
    catch (e) { return { pb, falta: /SESION|solo para/.test(e.message), error: e.message }; }
  }));
  const el = $('#pueblosRes'); if (!el) return;
  const ok = filas.filter(f => f.d), suma = k => ok.reduce((s, f) => s + (Number(k(f.d)) || 0), 0);
  el.innerHTML = filas.map(f => `<div class="card"><div class="row between"><b>📍 ${esc(f.pb.nombre)}</b>
      ${f.pb.id === PUEBLO.id ? '<span class="tag t-gray">Este panel</span>' : f.d ? `<button class="btn sm" onclick="cambiarPueblo('${f.pb.id}')">Abrir panel ›</button>` : ''}</div>
    ${f.d ? `<div class="muted small" style="margin-top:4px">Hoy: ${f.d.hoy.pedidos} pedidos · ${f.d.hoy.entregados} entregados · ${money(f.d.hoy.vendido)} vendido · ${f.d.activos} activos</div>
      <div class="muted small">${f.d.negociosAbiertos} negocios abiertos · ${f.d.usuarios.negocios} negocios · ${f.d.usuarios.repartidores} repartidores · <b>${f.d.pendientes.length} por aprobar</b></div>
      ${f.c && f.c.hayLocal ? `<div class="small" style="margin-top:4px">💰 Comisiones sin liquidar: <b>${money(Math.abs(f.c.pendiente))}</b> ${f.c.pendiente >= 0 ? '(le pagas al local)' : '(el local te entrega)'}</div>` : ''}`

async function promoAdmin(id, estado) {

/* ============ ESTADÍSTICAS (solo el administrador general) ============ */
/** Barras simples en SVG: una serie, con valor al tocar cada barra. */
function barrasSVG(vals, etiquetas, fmt, id, cadaEt) {
  const W = 340, H = 150, izq = 34, abajo = 20, arriba = 8, n = vals.length;
  const max = Math.max(1, ...vals), paso = (W - izq) / n, ancho = Math.max(2, Math.min(22, paso * 0.68));
  const y = v => arriba + (H - abajo - arriba) * (1 - v / max);
  const corto = v => v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'k' : String(Math.round(v));
  const k = cadaEt || Math.ceil(n / 7);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">
    ${[1, 0.5].map(f => `<line x1="${izq}" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--ln)" stroke-width="1"/><text x="${izq - 4}" y="${y(max * f) + 3}" text-anchor="end" font-size="9" fill="var(--tx2)">${corto(max * f)}</text>`).join('')}
    <line x1="${izq}" x2="${W}" y1="${H - abajo}" y2="${H - abajo}" stroke="var(--ln)" stroke-width="1"/>
    ${vals.map((v, i) => { const x = izq + paso * i + (paso - ancho) / 2, yy = y(v), h = H - abajo - yy, r = Math.min(3, ancho / 2, h);
      const txt = esc(etiquetas[i] + ': ' + fmt(v));
      return `<g style="cursor:pointer" onclick="const c=document.getElementById('${id}');if(c)c.innerHTML='${txt.replace(/'/g, '&#39;')}'"><title>${txt}</title>
        <rect x="${izq + paso * i}" y="${arriba}" width="${paso}" height="${H - abajo - arriba}" fill="transparent"/>
        ${v > 0 ? `<path d="M${x},${H - abajo} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + ancho - r} Q${x + ancho},${yy} ${x + ancho},${yy + r} V${H - abajo} Z" fill="var(--pri)"/>` : ''}
        ${i % k === 0 ? `<text x="${x + ancho / 2}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--tx2)">${esc(etiquetas[i].replace(/^Semana del /, ''))}</text>` : ''}</g>`; }).join('')}
  </svg><div class="muted small" id="${id}" style="min-height:18px;text-align:center">Toca una barra para ver el dato</div>`;
}
