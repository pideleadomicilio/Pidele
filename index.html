<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pídele</title>
<meta name="description" content="Tu comida favorita, a un click · La Cruz de Elota">
<meta property="og:type" content="website">
<meta property="og:title" content="Pídele · Comida a domicilio en La Cruz de Elota">
<meta property="og:description" content="Pide a tus negocios favoritos y paga directo, sin comisiones. Tu comida favorita, a un click.">
<meta property="og:image" content="https://pideleadomicilio.github.io/Pidele/icons/icon-512.png">
<meta property="og:url" content="https://pideleadomicilio.github.io/Pidele/">
<meta name="theme-color" content="#3B5A2C">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- conexiones anticipadas: servidor, imágenes y tipografía (ahorran ~0.3–1 s en la primera llamada) -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://drive.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<!-- Mapas (Leaflet) y Firebase ya no frenan la primera pantalla: se cargan cuando hacen falta -->
<script src="firebase-config.js"></script>
<style>
:root{
  --pri:#3B5A2C; --pri2:#2C4521; --pri-s:#E5ECDC; --pri-xs:#F0F4EA;
  --bg:#F6F1E8; --card:#FFFDF8; --tx:#22281D; --tx2:#716C60; --ln:#E8E1D3;
  --ok:#3B7A2C; --ok-s:#E1F0D8; --warn:#9A6206; --warn-s:#FBEFD5; --err:#B42318; --err-s:#FBE3E0;
  --info:#2F5D8A; --info-s:#E2ECF6; --star:#E9A23B; --moto:#D9822B;
  --r:18px; --sh:0 1px 2px rgba(40,35,20,.05),0 4px 14px rgba(40,35,20,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.42 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.sinNav{padding-bottom:0}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
svg.ic.s{width:17px;height:17px} svg.ic.l{width:28px;height:28px}

/* splash */
#splash{position:fixed;inset:0;z-index:999;background:var(--pri);color:#F6F1E8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s}
#splash.fuera{opacity:0;pointer-events:none}
.marcaTxt{font-weight:900;font-size:58px;letter-spacing:-1.5px;line-height:1}
.marcaSub{font-size:12.5px;letter-spacing:3px;font-weight:700;text-transform:uppercase;opacity:.9;text-align:center}

/* barra superior (negocio, repartidor, admin) */
header{position:sticky;top:0;z-index:50;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:none;align-items:center;gap:10px}
header .logo{font-weight:900;font-size:21px;flex:1;letter-spacing:-.4px}
header .yo{font-size:12px;opacity:.92;text-align:right;line-height:1.15;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:7px 13px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}

main{max-width:720px;margin:0 auto;padding:14px 16px 24px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--card);border-top:1px solid var(--ln);display:none;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:110px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:#9A9486;padding:2px;cursor:pointer;position:relative}
nav button.on{color:var(--pri)}
nav .badge,.badgeC{position:absolute;top:-4px;right:calc(50% - 22px);background:var(--pri);color:#fff;border:2px solid var(--card);border-radius:999px;font-size:10px;font-weight:800;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* tipografía y bloques */
h1{font-size:25px;font-weight:900;margin:6px 0 14px;letter-spacing:-.4px;line-height:1.15}
h2{font-size:20px;font-weight:800;margin:6px 0 12px}
h3{font-size:16.5px;font-weight:800;margin:18px 0 10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2);font-size:13.5px}
.small{font-size:12.5px}
.b{font-weight:800}
.hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
.titBar{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.titBar h2{margin:0;flex:1;text-align:center;font-size:19px}
.titBar .esp{width:40px}
.redondo{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);flex-shrink:0;position:relative;text-decoration:none}
.redondo.verde{background:var(--pri-s);color:var(--pri);box-shadow:none}

/* botones y formularios */
.btn{border:1.5px solid var(--ln);background:var(--card);border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--tx);font-size:14.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pill{border-radius:999px;padding:14px 18px;font-size:16px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.err{color:var(--err);border-color:#EFC4BE}
.btn.full{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1;min-width:118px}
label.f{display:block;margin:12px 0 5px;font-size:13.5px;font-weight:800;color:var(--tx)}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--ln);border-radius:14px;padding:12px 13px;background:var(--card);outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
textarea.i{min-height:70px;resize:vertical}
.conIco{position:relative}
.conIco svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx2)}
.conIco input{padding-left:42px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.t-ok{background:var(--ok-s);color:var(--ok)} .t-warn{background:var(--warn-s);color:var(--warn)} .t-err{background:var(--err-s);color:var(--err)}
.t-info{background:var(--info-s);color:var(--info)} .t-gray{background:#EEE8DD;color:var(--tx2)} .t-pri{background:var(--pri-s);color:var(--pri)}
.aviso{border-radius:14px;padding:11px 13px;margin:0 0 12px;font-size:14px;font-weight:700}
.aviso.warn{background:var(--warn-s);color:var(--warn)} .aviso.err{background:var(--err-s);color:var(--err)}
.aviso.info{background:var(--info-s);color:var(--info)} .aviso.ok{background:var(--ok-s);color:var(--ok)}
.vacio{text-align:center;color:var(--tx2);padding:36px 12px}
.vacio .big{font-size:42px;display:block;margin-bottom:8px}
.cargando{text-align:center;color:var(--tx2);padding:48px}
.cargando:before{content:"";display:block;width:30px;height:30px;margin:0 auto 10px;border:3px solid var(--pri-s);border-top-color:var(--pri);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.estrella{color:var(--star)}

/* inicio */
.ubicTop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ubicTop .u{flex:1;min-width:0;cursor:pointer}
.ubicTop .u b{display:flex;align-items:center;gap:4px;font-size:14px}
.ubicTop .u small{display:block;color:var(--tx2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buscar{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--ln);border-radius:16px;padding:12px 14px;background:var(--card);color:var(--tx2);cursor:text;margin-bottom:14px}
.buscar input{border:0;outline:none;background:none;flex:1;min-width:0;color:var(--tx)}
.catFila{display:flex;gap:12px;overflow-x:auto;margin:0 -16px 4px;padding:2px 16px 10px;scrollbar-width:none}
.catFila::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;width:66px;text-align:center;cursor:pointer;background:none;border:0;padding:0}
.cat .cu{width:62px;height:62px;margin:0 auto;border-radius:18px;background:var(--card);border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:27px;transition:.15s}
.cat b{display:block;font-size:11.5px;font-weight:700;margin-top:6px;color:var(--tx);line-height:1.15}
.cat.on .cu{background:var(--pri);border-color:var(--pri);box-shadow:0 6px 14px rgba(59,90,44,.3)}
.secHead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px}
.secHead h3{margin:0}
.secHead button{background:none;border:0;color:var(--pri);font-weight:800;cursor:pointer;font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nCard{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.nCard .img{aspect-ratio:4/3;background:linear-gradient(135deg,var(--pri-s),#D8E2CB);display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;overflow:hidden}
.nCard .img img.portada{width:100%;height:100%;object-fit:cover}
.nCard .img .mini{position:absolute;left:8px;bottom:8px;width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#fff}
.nCard .img .tag{position:absolute;top:8px;right:8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.nCard .info{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px}
.nCard .info b{font-size:15px;line-height:1.2}
.nCard .pie{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;margin-top:3px}
.nCard.cerrado .img{filter:grayscale(.85);opacity:.75}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* perfil del negocio */
.hero{position:relative;margin:-14px -16px 0;height:210px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .redondo{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px}
.logoBig{width:84px;height:84px;border-radius:50%;border:4px solid var(--bg);background:var(--card);margin-top:-42px;position:relative;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:var(--sh)}
.negH h1{margin:8px 0 4px}
.tabs{display:flex;gap:4px;background:#EDE7DB;border-radius:999px;padding:4px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px 4px;font-weight:800;font-size:14px;cursor:pointer;color:var(--tx2)}
.tabs button.on{background:var(--pri);color:#fff}
.menuWrap{display:flex;gap:10px;align-items:flex-start}
.secs{flex:0 0 86px;position:sticky;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 120px);overflow-y:auto}
.sec{background:var(--card);border:1.5px solid var(--ln);border-radius:14px;padding:10px 6px;font-size:12.5px;font-weight:800;color:var(--tx2);cursor:pointer;text-align:center;line-height:1.2}
.sec.on{background:var(--pri);border-color:var(--pri);color:#fff}
.prods{flex:1;min-width:0}
.pCard{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column}
.pCard .img{aspect-ratio:1;background:#EFE9DE;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.pCard .img img{width:100%;height:100%;object-fit:cover}
.pCard .info{padding:8px 9px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.pCard .info b{font-size:13.5px;line-height:1.2}
.pCard .desc{font-size:11.5px;color:var(--tx2);line-height:1.25}
.pCard .pie{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:5px}
.pCard .precio{font-weight:900;font-size:15px}
.pCard .min{font-size:11px;color:var(--tx2);display:block}
.mas{width:30px;height:30px;border-radius:10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;border:0;flex-shrink:0}
.pCard .enCarrito{position:absolute;top:7px;right:7px;background:var(--pri);color:#fff;border-radius:999px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;padding:0 6px;border:2px solid #fff}
.secTit{font-size:15px;margin:2px 0 8px}
.dia{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--ln);font-size:14px}
.dia:last-child{border-bottom:0}
.dia.hoy{font-weight:900;color:var(--pri)}
.mapa{height:220px;border-radius:16px;overflow:hidden;border:1px solid var(--ln);z-index:1}
.mapa.alto{height:330px}

/* hoja de producto y modales */
#modal{position:fixed;inset:0;z-index:200;background:rgba(25,20,10,.5);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .caja{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.hojaImg{width:calc(100% + 32px);margin:-16px -16px 12px;aspect-ratio:16/10;object-fit:cover;border-radius:24px 24px 0 0;display:block;background:#EFE9DE}
.opc{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.opc:last-child{border-bottom:0}
.opc input{width:21px;height:21px;accent-color:var(--pri);flex-shrink:0}
.opc span{flex:1}
.grupoT{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 2px}
.grupoT b{font-size:15.5px}
.detalle{font-size:12.5px;color:var(--tx2);line-height:1.35}
.cant{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ln);border-radius:12px;padding:3px}
.cant button{width:30px;height:30px;border-radius:9px;border:0;background:none;font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.cant b{min-width:18px;text-align:center}
#visor{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
#visor.on{display:flex}
#visor img{max-width:100%;max-height:80vh;border-radius:10px;background:#fff}

/* carrito */
.linea{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);align-items:flex-start}
.linea:last-child{border-bottom:0}
.thumb{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#EFE9DE;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.linea .der{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:10px;align-self:stretch}
.basura{background:none;border:0;color:var(--tx2);cursor:pointer;padding:2px}
.tot{display:flex;justify-content:space-between;padding:5px 0;gap:10px}
.tot.g{font-size:18px;font-weight:900;border-top:1px solid var(--ln);margin-top:6px;padding-top:10px}
.barra{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:55;max-width:692px;margin:0 auto;background:var(--pri);color:#fff;border-radius:999px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(44,69,33,.35)}

/* opciones (entrega / pago) */
.opcion{display:flex;align-items:center;gap:13px;border:1.5px solid var(--ln);background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.opcion .radio{width:24px;height:24px;border-radius:50%;border:2px solid #C9C1B1;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opcion.on{border-color:var(--pri);background:var(--pri-xs)}
.opcion.on .radio{background:var(--pri);border-color:var(--pri)}
.opcion.on .radio:after{content:"";width:9px;height:9px;border-radius:50%;background:#fff}
.opcion .ico{width:42px;height:42px;border-radius:12px;background:var(--pri-s);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opcion b{display:block;font-size:15px}
.opcion small{color:var(--tx2);font-size:12.5px}
.seguro{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--tx2);font-size:12.5px;margin:12px 0}

/* confirmación */
.listo{text-align:center;padding:30px 10px}
.check{width:104px;height:104px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;margin:20px auto 18px;box-shadow:0 0 0 10px var(--pri-s)}
.check svg{width:56px;height:56px;stroke-width:3}

/* seguimiento */
.segTop{background:var(--pri);color:#fff;margin:-14px -16px 0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.segTop h2{margin:0;flex:1;text-align:center;font-size:18px;color:#fff}
.segTop .redondo{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
.mapaSeg{position:relative;margin:0 -16px;height:330px;background:#DCE3D3}
.mapaSeg #mapaTrk{height:100%;width:100%}
.pildora{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:500;background:rgba(34,40,29,.9);color:#fff;border-radius:16px;padding:9px 14px;display:flex;gap:9px;align-items:center;font-size:13.5px;max-width:92%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pildora small{display:block;opacity:.8;font-size:12px}
.hojaSeg{background:var(--card);border-radius:24px 24px 0 0;margin:-22px -16px 12px;padding:18px 16px 6px;position:relative;z-index:2;box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--pri-s);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex-shrink:0}
.pasos4{display:flex;justify-content:space-between;position:relative;margin:18px 4px 6px}
.pasos4:before{content:"";position:absolute;top:15px;left:10%;right:10%;height:3px;background:var(--ln)}
.pasos4 .barraP{position:absolute;top:15px;left:10%;height:3px;background:var(--pri);transition:width .4s}
.paso{position:relative;flex:1;text-align:center;font-size:11.5px;font-weight:700;color:#A79F90;line-height:1.2}
.paso .p{width:33px;height:33px;border-radius:50%;background:var(--card);border:3px solid var(--ln);margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.paso.ok{color:var(--tx)} .paso.ok .p{background:var(--pri);border-color:var(--pri);color:#fff}
.paso.act{color:var(--pri);font-weight:900} .paso.act .p{background:var(--pri);border-color:var(--pri-s);color:#fff;box-shadow:0 0 0 4px var(--pri-s)}
.pin{width:36px;height:36px;border-radius:50%;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pinN{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.estrellas{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
.estrellas button{background:none;border:0;font-size:34px;cursor:pointer;color:#D9D1C1;padding:0 2px;line-height:1}
.estrellas button.on{color:var(--star)}

/* operación (negocio / repartidor / admin) */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.kpi b{display:block;font-size:22px;font-weight:900}
.kpi span{font-size:12.5px;color:var(--tx2)}
.sw{position:relative;width:52px;height:30px;flex-shrink:0}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:#D3CBBC;border-radius:999px;transition:.2s;cursor:pointer}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--pri)} .sw input:checked+i:after{left:25px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rol{border:1.5px solid var(--ln);background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer}
.rol span{font-size:28px;display:block}
.rol.on{border-color:var(--pri);background:var(--pri-s)}
.entrar{max-width:420px;margin:10px auto}
.entrar .marca{text-align:center;margin:8px 0 18px;color:var(--pri)}
.prod{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.prod:last-child{border-bottom:0}
.fotoP{width:62px;height:62px;border-radius:12px;object-fit:cover;background:#EFE9DE;flex-shrink:0}
.copiar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--pri-xs);border-radius:14px;padding:10px 12px;margin:6px 0}
.copiar .v{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;word-break:break-all}
.chat{display:flex;flex-direction:column;height:78vh}
.msgs{flex:1;overflow-y:auto;padding:8px 2px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;background:#EFE9DE;border-radius:16px 16px 16px 4px;padding:8px 11px;align-self:flex-start}
.msg small{display:block;font-size:11px;color:var(--tx2);margin-bottom:2px}
.msg.mio{align-self:flex-end;background:var(--pri-s);border-radius:16px 16px 4px 16px}
.msg.sis{align-self:center;background:var(--info-s);color:var(--info);font-size:13px;text-align:center;border-radius:12px;max-width:94%}
.chatIn{display:flex;gap:8px;align-items:center;padding-top:8px;border-top:1px solid var(--ln)}
.chatIn input{flex:1}
.lnk{background:none;border:0;color:var(--pri);font-weight:800;padding:4px 0;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:400;background:var(--tx);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1} #toast.err{background:var(--err)}
.parada{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.parada:last-child{border-bottom:0}
.num{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.num.r{background:var(--moto)} .num.e{background:var(--pri)}
.espera{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.hRow{display:grid;grid-template-columns:100px 1fr 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.hRow:last-child{border-bottom:0}
.hRow label{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px}
.hRow input[type=time]{padding:8px;border:1.5px solid var(--ln);border-radius:10px;width:100%;background:var(--card)}
.hRow.off input[type=time]{opacity:.35}
.exRow{display:grid;grid-template-columns:1fr 90px 40px;gap:6px;margin-bottom:6px}
.entregaBox{background:var(--pri-xs);border-radius:16px;padding:12px;margin-top:10px}
.qrCaja{background:#fff;border-radius:18px;padding:14px;display:inline-block;margin:6px auto 10px;box-shadow:var(--sh)}
.qrCaja img,.qrCaja canvas{display:block;width:210px!important;height:210px!important}
.hero .compartir{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;left:auto}
.compartirCard{display:flex;gap:12px;align-items:center;background:var(--pri-xs);border:1.5px dashed var(--pri);border-radius:18px;padding:13px 14px;margin:18px 0 6px;cursor:pointer}
.bannerPush{display:flex;gap:12px;align-items:center;background:var(--pri);color:#fff;border-radius:18px;padding:13px 14px;margin-bottom:14px}
.bannerPush .t{flex:1;font-size:13.5px;line-height:1.3}
.bannerPush .t b{display:block;font-size:15px}
.bannerPush .btn{background:#F6F1E8;color:var(--pri);border:0;padding:9px 13px;font-size:13.5px}
.bannerPush .x{background:none;border:0;color:#fff;opacity:.7;font-size:18px;cursor:pointer;padding:0 2px}

/* promociones */
.promoWrap{margin:0 -16px 14px;position:relative}
.promoFila{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;scrollbar-width:none;scroll-behavior:smooth}
.promoFila::-webkit-scrollbar{display:none}
.slide{flex:0 0 88%;max-width:560px;scroll-snap-align:center;aspect-ratio:2.15/1;border-radius:20px;overflow:hidden;position:relative;cursor:pointer;background:linear-gradient(130deg,var(--pri),#5E7F3E 60%,#C98A2B);color:#fff;box-shadow:var(--sh)}
.promoFila .slide:only-child{flex-basis:100%}
.slide img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(20,24,14,.82) 100%)}
.slide .sinImg{position:absolute;right:-18px;top:-18px;font-size:120px;opacity:.16;line-height:1}
.slide .txt{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:flex-end;gap:10px}
.slide .txt .grow b{display:block;font-size:18px;font-weight:900;line-height:1.15;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.slide .txt .grow small{display:block;font-size:12.5px;opacity:.92;margin-top:2px}
.slide .logoS{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#fff;flex-shrink:0}

.slide .precioS s{display:block;font-size:11px;color:var(--tx2);font-weight:700}
.slide .chip{position:absolute;top:10px;left:12px;background:rgba(246,241,232,.95);color:var(--pri2);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:900}
.puntos{display:flex;justify-content:center;gap:5px;margin-top:8px}
.puntos i{width:6px;height:6px;border-radius:999px;background:#D3CBBC;transition:.2s}
.puntos i.on{width:18px;background:var(--pri)}
.promoCard{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;margin-bottom:12px;cursor:pointer}
.promoCard .slide{flex:none;width:100%;max-width:none;border-radius:0;box-shadow:none}
.promoCard .pie{padding:10px 13px 12px}
.tachado{text-decoration:line-through;color:var(--tx2);font-weight:700;font-size:.82em;margin-right:4px}
.precioPromo{color:var(--err)}
.tagPromo{position:absolute;top:7px;left:7px;background:var(--err);color:#fff;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:900;letter-spacing:.3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{border:1.5px solid var(--ln);border-radius:999px;padding:6px 11px;font-weight:800;font-size:13px;cursor:pointer;user-select:none}
.chips input{display:none}
.chips label:has(input:checked){background:var(--pri);border-color:var(--pri);color:#fff}
.esqueleto{background:linear-gradient(90deg,#EEE8DD 25%,#F6F1E8 50%,#EEE8DD 75%);background-size:200% 100%;animation:brillo 1.2s infinite;border-radius:18px}
@keyframes brillo{to{background-position:-200% 0}}

<script>
/* ============ CONFIGURACIÓN ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbw16py7HK64D_1W5C5leitt313r_tviHv9NYsgH2_ZSu_z_1IWJcynEMsNSySrTUqu7pQ/exec';
const APP = 'Pídele';

/* ============ ESTADO ============ */
const S = {
  token: ls('token'), user: ls('user'), negocio: ls('negocio'), conf: ls('conf'),
  // un carrito por negocio: { negocioId: { negocioId, negocio, logo, lat, lng, items } }
  carritos: ls('carritos') || {},
  entrega: ls('entrega') || null,
  vista: null, params: null, auto: false, pos: null, firma: '', nuevos: 0, chat: null,
  map: null, tabNeg: 'atender', tabAdmPed: 'activos', esperaHasta: 0, instalar: null, ticks: 0, cat: 'Todos',
  // catálogo guardado en el teléfono: la pantalla principal se pinta al instante y se actualiza por detrás
  _negs: ls('negs') || null, promos: ls('promos') || [], _catT: 0
};
// la v1.5 tenía un solo carrito: se convierte al formato nuevo
(function () {
  const viejo = ls('carrito');
  if (viejo && viejo.negocioId && Object.keys(viejo.items || {}).length && !S.carritos[viejo.negocioId]) S.carritos[viejo.negocioId] = viejo;
  if (viejo) ls('carrito', null);
  Object.keys(S.carritos).forEach(k => { const c = S.carritos[k]; if (!c || !c.items || Object.values(c.items).some(x => !x.key)) delete S.carritos[k]; });
  const e = ls('entrega'); if (e && !e.metodos) { e.metodos = {}; ls('entrega', e); }
})();

const EST = {
  NUEVO: ['Enviado al negocio', '📨'], POR_PAGAR: ['Esperando pago', '💳'], PAGO_ENVIADO: ['Verificando pago', '🔎'],
  PREPARANDO: ['En preparación', '👩‍🍳'], LISTO: ['Listo', '📦'], EN_CAMINO: ['En camino', '🛵'],
  ENTREGADO: ['Entregado', '✅'], CANCELADO: ['Cancelado', '✖️']
};
const ACTIVOS = ['NUEVO', 'POR_PAGAR', 'PAGO_ENVIADO', 'PREPARANDO', 'LISTO', 'EN_CAMINO'];
const CATEGORIAS = ['Comida', 'Mariscos', 'Tacos', 'Hamburguesas', 'Pizza', 'Antojitos', 'Café y postres', 'Bebidas', 'Abarrotes', 'Farmacia', 'Otro'];
const ICONO_CAT = { Promociones: '🏷️', Todos: '🍽️', Comida: '🍲', Mariscos: '🦐', Tacos: '🌮', Hamburguesas: '🍔', Pizza: '🍕', Antojitos: '🫓', 'Café y postres': '☕', Bebidas: '🥤', Abarrotes: '🛒', Farmacia: '💊', Otro: '🏪' };
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const PAGO_TXT = { efectivo: 'Efectivo', transferencia: 'Transferencia', codi: 'CoDi' };

/* ============ ÍCONOS ============ */
const ICONOS = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  recibo: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  bolsa: '<path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  atras: '<path d="M15 5l-7 7 7 7"/>',
  abajo: '<path d="M6 9l6 6 6-6"/>',
  tel: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  tienda: '<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/>',
  casa: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  moto: '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-2-6h-3"/><path d="M15 11h3l2 4"/><path d="M13 7h3"/>',
  basura: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  mas: '<path d="M12 5v14M5 12h14"/>',
  menos: '<path d="M5 12h14"/>',
  reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  candado: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  efectivo: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
  banco: '<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',
  qr: '<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>',
  mapa: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  copiar: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  salir: '<path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/>',
  lista: '<path d="M8 6h12M8 12h12M8 18h12M4 6v.01M4 12v.01M4 18v.01"/>',
  menu: '<path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 2-2 6 0 8v10"/>',
  ajustes: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  grafica: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  usuarios: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.4 0 4 1.3 4.5 4"/>',
  compartir: '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/>',
  estrella: '<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
  etiqueta: '<path d="M3 12.2V4h8.2L21 13.8 13.8 21z"/><circle cx="7.6" cy="8.6" r="1.6"/>'
};
function ico(n, cls) { return `<svg class="ic ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[n] || ''}</svg>`; }

/* ============ UTILIDADES ============ */
function $(s) { return document.querySelector(s); }
function ls(k, v) {
  if (v === undefined) { try { return JSON.parse(localStorage.getItem('pe_' + k)); } catch (e) { return null; } }
  try { v === null ? localStorage.removeItem('pe_' + k) : localStorage.setItem('pe_' + k, JSON.stringify(v)); } catch (e) { }
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { n = Number(n) || 0; return '$' + n.toLocaleString('es-MX', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
function hora(ms) { return ms ? new Date(ms).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }) : ''; }
function fechaCorta(ms) { return ms ? new Date(ms).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) + ' ' + hora(ms) : ''; }
function enMin(ms) { const m = Math.round((ms - Date.now()) / 60000); return m > 0 ? 'en ' + m + ' min' : m === 0 ? 'ahora' : 'hace ' + (-m) + ' min'; }
function html(h) { $('#vista').innerHTML = h; }
function iniciales(n) { return String(n || '?').split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase(); }
function estrellas(c, n) { return c ? `<span class="estrella">★</span> <b>${c}</b> <span class="muted small">(${n})</span>` : '<span class="tag t-pri">Nuevo</span>'; }
function toast(msg, tipo) {
  const t = $('#toast'); t.textContent = msg; t.className = 'on ' + (tipo || '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = '', tipo === 'err' ? 4500 : 2600);
}
function modal(h) { $('#modalCaja').innerHTML = h; $('#modal').classList.add('on'); }
function cerrarModal() { $('#modal').classList.remove('on'); $('#modalCaja').innerHTML = ''; S.chat = null; clearInterval(S._chatT); }
function visor(src) { $('#visorImg').src = src; $('#visor').classList.add('on'); }
function telLink(t, txt) { return t ? `<a class="btn sm" href="tel:${esc(t)}">${ico('tel', 's')} ${txt || 'Llamar'}</a>` : ''; }
function waLink(t, txt) { return t ? `https://wa.me/52${String(t).replace(/\D/g, '').slice(-10)}${txt ? '?text=' + encodeURIComponent(txt) : ''}` : ''; }
function hav(a, b, c, d) { const R = 6371, r = Math.PI / 180, x = Math.sin((c - a) * r / 2), y = Math.sin((d - b) * r / 2); return 2 * R * Math.asin(Math.sqrt(x * x + Math.cos(a * r) * Math.cos(c * r) * y * y)); }
function kmRuta(a, b, c, d) { return hav(a, b, c, d) * (S.conf ? S.conf.factorRuta : 1.35); }
function tarifa(km) { const c = S.conf; const v = c.envioBase + Math.max(0, km - c.kmIncluidos) * c.envioPorKm; return Math.ceil(v / 5) * 5; }
function gmaps(lat, lng) { return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`; }
function rolNombre(r) { return { comprador: 'Cliente', negocio: 'Negocio', repartidor: 'Repartidor', admin: 'Administrador', sistema: '' }[r] || r; }

async function api(accion, datos) {
  if (API_URL.indexOf('PEGA_AQUI') === 0) throw new Error('Falta configurar API_URL en index.html');
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, datos: datos || {}, token: S.token }) });
  } catch (e) { throw new Error('Sin conexión. Revisa tu internet.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('El servidor no respondió bien. Intenta de nuevo.'); }
  if (!j.ok) {
    if (j.error === 'SESION') { salir(true); throw new Error('Tu sesión terminó, vuelve a entrar.'); }
    if (j.error === 'BLOQUEADO') { vBloqueado(); throw new Error('Cuenta suspendida'); }
    throw new Error(j.error);
  }
  return j.data;
}

/* ============ CARGA DIFERIDA (mapas y Firebase) ============ */
const _cargas = {};
function cargarScript(src) {
  return _cargas[src] || (_cargas[src] = new Promise((ok, mal) => {
    const sc = document.createElement('script');
    sc.src = src; sc.async = true;
    sc.onload = ok; sc.onerror = () => { delete _cargas[src]; mal(new Error('No se pudo cargar un componente. Revisa tu internet.')); };
    document.head.appendChild(sc);
  }));
}

function menusLocales() { return ls('menus') || {}; }
function menuLocal(id) { const m = menusLocales()[id]; return m ? m.d : null; }
function guardarMenu(d) {
  if (!d || !d.negocio) return;
  const all = menusLocales();
  all[d.negocio.id] = { ver: d.ver || 0, t: Date.now(), d };

  }
}
function precargarImg(src) { if (src) { const i = new Image(); i.decoding = 'async'; i.src = src; } }

/** Ejecuta una acción desde un botón: lo desactiva mientras trabaja y muestra errores. */
async function act(btn, fn) {
  if (btn) { btn.disabled = true; btn._t = btn.innerHTML; btn.innerHTML = '⏳'; }
  try { await fn(); } catch (e) { toast(e.message, 'err'); }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = btn._t; } }
}

function comprimir(file, max) {
  max = max || 1200;
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onerror = () => mal(new Error('No se pudo leer la imagen'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => mal(new Error('Archivo de imagen no válido'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.78));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function copiar(txt, que) {
  try { await navigator.clipboard.writeText(String(txt)); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (x) { } t.remove();
  }
  toast((que || 'Dato') + ' copiado ✓');
}

function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22].forEach(t => {
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(0.25, a.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + t + 0.18);
      o.start(a.currentTime + t); o.stop(a.currentTime + t + 0.2);
    });
  } catch (e) { }
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

/**
 * Arranque rápido:
 * 1) se pinta de inmediato la pantalla con lo guardado en el teléfono (catálogo, usuario);
 * 2) UNA sola llamada al servidor ("arranque") trae configuración, sesión y catálogo actualizados;
 * 3) en reposo se precargan los menús más probables, sus fotos y la librería de mapas.
 */
async function arrancar() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
    // versión nueva instalada: se aplica sola si el usuario está en una pantalla donde no pierde nada
    let recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recargado || !S._swPrevio) return;
      if (['inicio', 'entrar', 'negPedidos', 'disponibles', 'admin'].includes(S.vista) && !$('#modal').classList.contains('on')) { recargado = true; location.reload(); }
    });
    S._swPrevio = !!navigator.serviceWorker.controller;
  }
  if (!S.token || !S.user) { S.token = null; S.user = null; }
  S._catProm = refrescarArranque();
  const deUrl = location.search;
  // la entrada base del historial es el inicio, para que "volver" funcione al llegar por un enlace
  history.replaceState({ v: inicioRol() }, '', location.pathname);
  if (!abrirDesdeUrl(deUrl)) ir(inicioRol(), null);
  quitarSplash();
  await S._catProm.catch(() => { });
  S._catProm = null;
  enReposo(cargarLeaflet, 2500);
}

function quitarSplash() {
  // se quita en cuanto hay algo que mostrar (antes esperaba 1.3 s fijos)
  const sp = $('#splash');
  const fuera = () => sp.classList.add('fuera');
  if (S._negs || S.token || S.vista !== 'inicio') requestAnimationFrame(() => setTimeout(fuera, 120));
  else { const t0 = Date.now(), chk = setInterval(() => { if (S._negs || Date.now() - t0 > 6000) { clearInterval(chk); fuera(); } }, 80); }
}

async function refrescarArranque() {
  const conToken = !!S.token;
  const d = await api('arranque');
  S.conf = d.config; ls('conf', S.conf);
  if (conToken && S.token) {
    if (d.sesion === 'BLOQUEADO') { vBloqueado(); return; }
    if (d.sesion === 'SESION') { salir(true); toast('Tu sesión terminó, vuelve a entrar.'); }
    else if (d.usuario) { S.user = d.usuario; S.negocio = d.negocio; ls('user', S.user); ls('negocio', S.negocio); }
  }
  if (d.catalogo) guardarCatalogo(d.catalogo);
  pintarNav();
  if (S.token && S.user) {
    iniciarSondeo();
    if (S.user.rol === 'repartidor') iniciarGPS();
    enReposo(() => activarPush(false).catch(() => { }), 1500);
  }
  enReposo(precargar, 600);
}

  S.token = d.token; S.user = d.usuario; S.negocio = d.negocio; S.conf = d.config;

  history.replaceState(null, '');
  const destino = S.despues && S.user.rol === 'comprador' ? S.despues : inicioRol();
  S.despues = null;

  if (S.user.rol === 'comprador') enReposo(precargar, 800);
}

function pushDisponible() {
  // Firebase se descarga hasta que se necesita; aquí solo se revisa que el teléfono pueda recibir avisos
  return typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.apiKey &&
    'serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window;
}
function esIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent || ''); }
function instalada() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }

/** Registra este teléfono para recibir notificaciones. pedir=true muestra el permiso del navegador. */
async function activarPush(pedir) {
  if (!S.token || !pushDisponible()) return false;
  if (Notification.permission === 'default') {
    if (!pedir) return false;
    const r = await Notification.requestPermission();
    if (r !== 'granted') { toast('Sin permiso no podemos avisarte. Puedes activarlo después en Perfil.', 'err'); pintarBannerPush(); return false; }
  }
  if (Notification.permission !== 'granted') return false;
  await cargarFirebase();
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const m = firebase.messaging();
  const fcm = await m.getToken({ vapidKey: FIREBASE_VAPID || undefined, serviceWorkerRegistration: reg });
  if (!fcm) return false;
  const clave = S.user.id + '|' + fcm;
  if (ls('fcm') !== clave) { await api('registrarDispositivo', { fcm, ua: navigator.userAgent.slice(0, 120) }); ls('fcm', clave); }
  if (!S._onMsg) {
    S._onMsg = true;
    // con la app abierta: sonido + aviso y se actualiza la pantalla al momento
    m.onMessage(p => { const d = p.data || {}; S._pushReciente = Date.now(); beep(); toast(d.titulo || APP); sondear(true); });
  }
  pintarBannerPush();
  return true;
}

  } else if (esIOS() && !instalada() && typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.apiKey) {

/** Abre la pantalla que trae una notificación (?pedido=ID o ?v=vista). */
function abrirDesdeUrl(url) {
  let q;
  try { q = new URL(url, location.href).searchParams; } catch (e) { return false; }
  const ped = q.get('pedido'), v = q.get('v'), neg = q.get('negocio');
  if (neg) { ir('negocio', neg); return true; }
  if (!S.token || (!ped && !v)) return false;
  if (ped) ir('pedido', ped); else if (VISTAS[v] && (NAV[rolActual()] || []).some(x => x[0] === v)) ir(v); else return false;
  return true;
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.abrir) abrirDesdeUrl(e.data.abrir); });

/* ============ COMPARTIR ============ */
function urlApp(params) {
  const base = location.origin + location.pathname.replace(/index\.html$/, '');
  return base + (params ? '?' + params : '');
}

function cargarQR() {
  if (window.QRCode) return Promise.resolve(window.QRCode);
  return new Promise((ok, mal) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload = () => window.QRCode ? ok(window.QRCode) : mal(new Error('No se pudo crear el QR'));
    sc.onerror = () => mal(new Error('No se pudo crear el QR. Revisa tu internet.'));
    document.head.appendChild(sc);
  });
}

const TXT_APP = '🍔 Pide comida a domicilio en La Cruz de Elota con Pídele. Pagas directo al negocio, sin comisiones.';

function compartirApp(btn) { return compartir(btn, 'Pídele', TXT_APP, urlApp(), 'Comparte Pídele', 'Pidele'); }
function compartirNegocio(btn, id, nombre) {
  return compartir(btn, nombre + ' en Pídele', '😋 Pide en ' + nombre + ' desde Pídele, a domicilio o para recoger.', urlApp('negocio=' + id), 'Comparte ' + nombre, nombre);
}

/** Usa el menú de compartir del teléfono; si no existe (o con conQR), muestra enlace, WhatsApp y QR. */
async function compartir(btn, titulo, texto, url, encabezado, archivoQR, conQR) {
  if (!conQR && navigator.share) {
    try { await navigator.share({ title: titulo, text: texto, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  S._compartir = { titulo, texto, url, archivoQR };
  modal(`<div style="text-align:center">
    <div class="row between"><span class="esp"></span><h2 style="margin:0">${esc(encabezado)}</h2><button class="redondo" onclick="cerrarModal()" aria-label="Cerrar">✕</button></div>
    <p class="muted" style="margin:8px 0 4px">Escanea el código o comparte el enlace</p>
    <div class="qrCaja"><div id="qrCodigo" class="cargando" style="width:210px;height:210px;padding:80px 0"></div></div>
    <div class="copiar" style="text-align:left"><div class="v" style="font-size:13px">${esc(url)}</div><button class="btn sm" onclick="copiar(S._compartir.url,'Enlace')">${ico('copiar', 's')}</button></div>
    <div class="btns">
      <a class="btn pri" href="https://wa.me/?text=${encodeURIComponent(texto + ' ' + url)}" target="_blank">${ico('chat', 's')} WhatsApp</a>
      <a class="btn" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank">Facebook</a>
      <button class="btn" onclick="act(this,descargarQR)">⬇ Descargar QR</button></div>
  </div>`);
  try {
    const QR = await cargarQR();
    const caja = $('#qrCodigo'); if (!caja) return;
    caja.className = ''; caja.style.padding = '0'; caja.innerHTML = '';
    new QR(caja, { text: url, width: 420, height: 420, colorDark: '#2C4521', colorLight: '#ffffff', correctLevel: QR.CorrectLevel.M });
  } catch (e) { const caja = $('#qrCodigo'); if (caja) { caja.className = 'muted small'; caja.style.padding = '60px 10px'; caja.textContent = e.message; } }
}

/** QR listo para imprimir: logo de texto arriba, código y nombre abajo. */
async function descargarQR() {
  const src = document.querySelector('#qrCodigo canvas');
  if (!src) throw new Error('El QR aún no está listo');
  const c = S._compartir, W = 900, H = 1180, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.fillStyle = '#3B5A2C'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#F6F1E8'; x.textAlign = 'center';
  x.font = '900 110px Nunito, Arial, sans-serif'; x.fillText('Pídele', W / 2, 160);
  x.font = '700 30px Nunito, Arial, sans-serif'; x.fillText('TU COMIDA FAVORITA, A UN CLICK', W / 2, 215);
  x.fillStyle = '#ffffff'; x.fillRect(150, 270, 600, 600);
  x.imageSmoothingEnabled = false; x.drawImage(src, 180, 300, 540, 540);
  x.fillStyle = '#F6F1E8';
  x.font = '800 46px Nunito, Arial, sans-serif'; x.fillText(c.titulo.replace(/ en Pídele$/, ''), W / 2, 950, W - 80);
  x.font = '600 32px Nunito, Arial, sans-serif'; x.fillText('Escanea y pide a domicilio', W / 2, 1010);
  x.font = '600 24px Nunito, Arial, sans-serif'; x.fillText(c.url.replace(/^https?:\/\//, ''), W / 2, 1110, W - 80);
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = 'QR-' + String(c.archivoQR || 'Pidele').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '-') + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('QR descargado ✓');
}

/* ============ SONDEO (actualizaciones) ============ */
/*
 * Cada cuánto se consulta al servidor. Con las notificaciones de Firebase los cambios llegan al momento
 * (y disparan una consulta inmediata), así que el sondeo es solo un respaldo.
 */
const SONDEO_MS = { comprador: 60000, negocio: 30000, repartidor: 20000, admin: 30000 };
function intervaloSondeo() {
  const r = S.user ? S.user.rol : '';
  // siguiendo un pedido que ya va en camino: más seguido para mover al repartidor en el mapa
  if (r === 'comprador' && S.vista === 'pedido' && S._trk && ['EN_CAMINO', 'LISTO', 'PREPARANDO'].includes(S._trk.estado)) return 20000;
  return SONDEO_MS[r] || 60000;
}
function iniciarSondeo() {
  clearTimeout(S._sondeo);
  const gen = S._genSondeo = (S._genSondeo || 0) + 1; // evita dos ciclos a la vez si se reinicia
  const ciclo = async () => {
    if (gen !== S._genSondeo) return;
    await sondear();
    if (S.token && gen === S._genSondeo) S._sondeo = setTimeout(ciclo, intervaloSondeo());
  };
  ciclo();
}
async function sondear(forzar) {
  if (!S.token || !S.user || (document.hidden && S.user.rol === 'comprador' && !forzar)) return;
  if (S._sondeando) return;
  S._sondeando = true;
  try {
    const d = await api('sondeo', S.user.rol === 'repartidor' && S.pos ? S.pos : {});
    const cambio = S.firma && d.firma !== S.firma;
    const masNuevos = d.nuevos > S.nuevos;
    if (S.firma && Date.now() - (S._pushReciente || 0) > 20000) {
      if (S.user.rol === 'negocio' && masNuevos) avisar('🔔 Tienes pedidos por atender', 'Revisa la pestaña Pedidos');
      else if (S.user.rol === 'repartidor' && masNuevos) avisar('📋 Hay pedidos disponibles', 'Abre Disponibles para tomarlos');
      else if (S.user.rol === 'comprador' && cambio) avisar('🔔 Tu pedido se actualizó');
    }
    S.firma = d.firma; S.nuevos = d.nuevos;
    if (S.user.estado !== d.estado) { S.user.estado = d.estado; ls('user', S.user); }
    pintarNav();
    S.ticks++;
    // en el seguimiento se repinta en cada consulta (mueve al repartidor); en las demás, al haber cambios
    const cada = S.vista === 'pedido' ? 1 : 4;
    if (S.auto && !$('#modal').classList.contains('on') && (cambio || forzar || S.ticks % cada === 0)) pintar(true);
    if (S.chat && forzar) cargarChat();
  } catch (e) { } finally { S._sondeando = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token) sondear(); });

function iniciarGPS() {
  if (!navigator.geolocation || S._gps) return;
  S._gps = navigator.geolocation.watchPosition(
    p => { S.pos = { lat: p.coords.latitude, lng: p.coords.longitude }; },
    () => { }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
}

/* ============ MAPAS ============ */
function nuevoMapa(id, lat, lng, zoom) {
  if (S.map) { try { S.map.remove(); } catch (e) { } }
  const m = L.map(id, { zoomControl: true, attributionControl: true }).setView([lat, lng], zoom || 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
  S.map = m;
  // si el usuario ya cambió de pantalla, el mapa se quitó: no hay que ajustarlo
  setTimeout(() => { if (S.map === m && document.body.contains(m.getContainer())) { try { m.invalidateSize(); } catch (e) { } } }, 250);
  return m;
}

/** Mapa para elegir un punto: clic o arrastrar el marcador. */
function mapaSelector(id, lat, lng, cb) {
  const c = S.conf || { centroLat: 23.9213, centroLng: -106.8916 };
  const ini = [lat || c.centroLat, lng || c.centroLng];
  const m = nuevoMapa(id, ini[0], ini[1], lat ? 17 : 15);
  const mk = L.marker(ini, { draggable: true, icon: pinIcono('🏠', '#3B5A2C') }).addTo(m);
  const fijar = (la, ln, centrar) => { mk.setLatLng([la, ln]); if (centrar) m.setView([la, ln], 17); cb(la, ln); };
  mk.on('dragend', () => { const p = mk.getLatLng(); fijar(p.lat, p.lng); });
  m.on('click', e => fijar(e.latlng.lat, e.latlng.lng));
  if (lat) cb(lat, lng);
  return { fijar };
}

function miUbicacion(cb) {
  if (!navigator.geolocation) { toast('Tu teléfono no permite ubicación', 'err'); return; }
  toast('Buscando tu ubicación…');
  navigator.geolocation.getCurrentPosition(
    p => cb(p.coords.latitude, p.coords.longitude),
    () => toast('No se pudo obtener tu ubicación. Activa el GPS y da permiso.', 'err'),
    { enableHighAccuracy: true, timeout: 15000 });
}

function pinIcono(txt, color) {
  return L.divIcon({ className: '', html: `<div class="pin" style="background:${color}">${txt}</div>`, iconSize: [36, 36], iconAnchor: [18, 18] });
}
function pinNum(txt, color) {
  return L.divIcon({ className: '', html: `<div class="pinN" style="background:${color}">${txt}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
}

/* ============ COMPONENTES DE PEDIDO ============ */
function etiqueta(e, p) {
  const cls = { NUEVO: 't-info', POR_PAGAR: 't-warn', PAGO_ENVIADO: 't-warn', PREPARANDO: 't-pri', LISTO: 't-pri', EN_CAMINO: 't-info', ENTREGADO: 't-ok', CANCELADO: 't-err' }[e] || 't-gray';
  let txt = EST[e] ? EST[e][1] + ' ' + EST[e][0] : e;
  if (e === 'LISTO' && p && p.tipoEntrega === 'recoger') txt = '📦 Listo para recoger';
  return `<span class="tag ${cls}">${txt}</span>`;
}

/** Texto de extras, "sin" y nota de un producto del pedido. */
function detalleItem(it) {
  const p = [];
  if (it.variante) p.push('<b>' + esc(it.variante) + '</b>');
  (it.extras || []).forEach(e => p.push('+ ' + esc(e.nombre)));
  (it.sin || []).forEach(s => p.push('Sin ' + esc(s)));
  if (it.nota) p.push('“' + esc(it.nota) + '”');
  return p.join(' · ');
}

function listaItems(items) {
  return items.map(it => {
    const d = detalleItem(it);
    const extra = (it.extras || []).reduce((s, e) => s + (Number(e.precio) || 0), 0);
    const pr = it.antes ? `<span class="tachado">${money((it.antes + extra) * it.cant)}</span><span class="precioPromo">${money(it.precio * it.cant)}</span>` : money(it.precio * it.cant);
    return `<div class="tot"><span>${it.cant} × ${esc(it.nombre)}${it.promo ? ' <span class="tag t-err">PROMO</span>' : ''}${d ? `<br><span class="detalle">${d}</span>` : ''}</span><span>${pr}</span></div>`;
  }).join('');
}

function resumenCobro(p) {
  const efe = p.metodoPago === 'efectivo';
  return `<div class="tot"><span>Subtotal</span><b>${money(p.subtotal)}</b></div>
    ${p.tipoEntrega === 'recoger' ? '<div class="tot"><span>Recoges en el negocio</span><b>$0</b></div>' : `<div class="tot"><span>Costo de envío</span><b>${money(p.envio)}</b></div>`}
    <div class="tot g"><span>Total</span><span>${money(p.total)}</span></div>
    <div class="muted small" style="margin-top:6px">${ico(efe ? 'efectivo' : 'banco', 's')} ${efe
      ? (p.tipoEntrega === 'recoger' ? 'Pago en efectivo al recoger.' : 'Pago en efectivo al repartidor: ' + money(p.total) + '.')
      : PAGO_TXT[p.metodoPago] + ' al negocio: ' + money(p.subtotal) + (p.envio ? ' · envío ' + money(p.envio) + ' en efectivo al repartidor.' : '.')}</div>`;
}

/** Botones de acción según el rol (negocio, repartidor, admin). */
function botonesPedido(p, enTarjeta) {
  const r = rolActual(), b = [], id = p.id;
  const efe = p.metodoPago === 'efectivo', recoger = p.tipoEntrega === 'recoger';
  if (r === 'negocio') {
    if (p.estado === 'NUEVO') {
      const ops = [10, 15, 20, 25, 30, 40, 50, 60, 90];
      const sug = p.minutosSugeridos || (S.negocio && S.negocio.tiempoPrep) || 20;
      const t = ops.find(m => m >= sug) || 90;
      b.push(`<select class="i" id="min_${id}" style="flex:1;min-width:110px">${ops.map(m => `<option value="${m}" ${m === t ? 'selected' : ''}>${m} min</option>`).join('')}</select>`);
      b.push(`<button class="btn ok" onclick="act(this,()=>accion('aceptarPedido',{id:'${id}',minutos:$('#min_${id}').value},'Pedido aceptado'))">Aceptar</button>`);
      b.push(`<button class="btn err" onclick="act(this,()=>cancelar('${id}','Rechazar'))">Rechazar</button>`);
    }
    if (p.estado === 'PAGO_ENVIADO') {
      if (p.comprobanteId) b.push(`<button class="btn" onclick="act(this,()=>verImagen('${id}','${p.comprobanteId}'))">🧾 Ver comprobante</button>`);
      b.push(`<button class="btn ok" onclick="act(this,()=>confirmarPago('${id}'))">Pago recibido ✓</button>`);
      b.push(`<button class="btn err" onclick="act(this,()=>noRecibido('${id}'))">No lo veo</button>`);
    }
    if (p.estado === 'POR_PAGAR') b.push(`<button class="btn ok" onclick="act(this,()=>confirmarPago('${id}'))">Ya me pagó ✓</button>`);
    if (p.estado === 'PREPARANDO') b.push(`<button class="btn" onclick="act(this,()=>accion('marcarListo',{id:'${id}'},'Marcado como listo'))">📦 Ya está listo</button>`);
    if (['PREPARANDO', 'LISTO'].includes(p.estado) && !recoger && p.repartidor) {
      b.push(`<button class="btn pri" onclick="act(this,()=>entregarRep('${id}',${efe ? p.subtotal : 0},'${esc(p.repartidor.nombre.replace(/['"\\]/g, ''))}'))">${ico('moto', 's')} Entregar a ${esc(p.repartidor.nombre.split(' ')[0])}${efe ? ' · cóbrale ' + money(p.subtotal) : ''}</button>`);
    }
    if (['PREPARANDO', 'LISTO'].includes(p.estado) && recoger) {
      b.push(`<button class="btn pri" onclick="act(this,()=>entregarCli('${id}',${efe ? p.total : 0}))">${ico('check', 's')} Entregado al cliente${efe ? ' · cobra ' + money(p.total) : ''}</button>`);
    }
    if (['POR_PAGAR', 'PAGO_ENVIADO', 'PREPARANDO', 'LISTO'].includes(p.estado) && !enTarjeta) b.push(`<button class="btn err" onclick="act(this,()=>cancelar('${id}'))">Cancelar</button>`);
  }
  if (r === 'repartidor' && p.repartidor && p.repartidor.id === S.user.id) {
    if (['PREPARANDO', 'LISTO'].includes(p.estado)) {
      b.push(`<a class="btn" href="${gmaps(p.negocio.lat, p.negocio.lng)}" target="_blank">${ico('mapa', 's')} Al negocio</a>`);
      b.push(`<button class="btn" onclick="act(this,()=>recogido('${id}'))">🛍️ Ya lo recogí</button>`);
      if (!enTarjeta) b.push(`<button class="btn err" onclick="act(this,()=>liberar('${id}'))">Liberar pedido</button>`);
    }
    if (p.estado === 'EN_CAMINO') {
      b.push(`<a class="btn pri" href="${gmaps(p.lat, p.lng)}" target="_blank">${ico('mapa', 's')} Abrir en Maps</a>`);
      b.push(`<button class="btn" onclick="copiarUbicacion('${id}')">${ico('copiar', 's')} Copiar ubicación</button>`);
      b.push(`<button class="btn ok" onclick="act(this,()=>entregado('${id}',${efe ? p.total : p.envio}))">${ico('check', 's')} Entregado</button>`);
    }
  }
  if (r === 'admin' && ACTIVOS.includes(p.estado) && !enTarjeta) b.push(`<button class="btn err" onclick="act(this,()=>cancelar('${id}'))">Cancelar (admin)</button>`);
  if (r !== 'comprador') b.push(`<button class="btn" onclick="abrirChat('${id}')">${ico('chat', 's')} Chat</button>`);
  return b.length ? `<div class="btns">${b.join('')}</div>` : '';
}

async function accion(nombre, datos, msg) {
  await api(nombre, datos);
  if (msg) toast(msg);
  await pintar(true);
}
async function cancelar(id, palabra) {
  const motivo = prompt((palabra || 'Cancelar') + ' pedido. Escribe el motivo:');
  if (motivo === null) return;
  await accion('cancelarPedido', { id, motivo: motivo || 'Sin motivo' }, 'Pedido cancelado');
}
async function confirmarPago(id) {
  if (!confirm('¿Confirmas que el dinero YA está en tu cuenta? Revisa tu app del banco antes de confirmar.')) return;
  await accion('confirmarPago', { id }, 'Pago confirmado, ¡a preparar!');
}
async function noRecibido(id) {
  const m = prompt('¿Qué le decimos al cliente? (ej. "No se refleja aún", "El monto no coincide")');
  if (m === null) return;
  await accion('pagoNoRecibido', { id, motivo: m }, 'Se avisó al cliente');
}
async function entregarRep(id, cobro, nombre) {
  if (!confirm('¿Entregas el pedido a ' + nombre + '?' + (cobro ? '\nCóbrale ' + money(cobro) + ' de la comida (pago en efectivo).' : ''))) return;
  await accion('entregarRepartidor', { id }, '¡Pedido en camino! 🛵');
}
async function entregarCli(id, cobro) {
  if (!confirm('¿El cliente ya recogió su pedido?' + (cobro ? '\nCobra ' + money(cobro) + ' en efectivo.' : ''))) return;
  await accion('entregarCliente', { id }, 'Pedido entregado ✓');
}
async function recogido(id) {
  if (!confirm('¿Ya tienes el pedido contigo?')) return;
  await accion('marcarRecogido', { id }, '¡En camino!');
}
async function entregado(id, cobro) {
  if (!confirm('¿Entregaste el pedido y cobraste ' + money(cobro) + ' en efectivo?\nLos datos de quien recibe se borrarán.')) return;
  await accion('marcarEntregado', { id }, '¡Entrega completada!');
}
async function liberar(id) {
  const m = prompt('¿Por qué liberas el pedido? Otro repartidor podrá tomarlo.');
  if (m === null) return;
  await accion('liberarPedido', { id, motivo: m }, 'Pedido liberado');
}
async function verImagen(pedidoId, fileId) {
  toast('Cargando imagen…');
  visor(await api('imagen', { pedidoId, fileId }));
}
/** Copia la ubicación de entrega para usarla en Waze, WhatsApp u otra app. */
function copiarUbicacion(id) {
  const p = (S._pedidosVistos || {})[id]; if (!p) return;
  const txt = `${p.recibe ? p.recibe.nombre + ' · ' + p.recibe.telefono + '\n' : ''}${p.direccion}${p.referencia ? ' (' + p.referencia + ')' : ''}\nhttps://maps.google.com/?q=${p.lat},${p.lng}`;
  copiar(txt, 'Ubicación');
}
function recordar(lista) { S._pedidosVistos = S._pedidosVistos || {}; lista.forEach(p => S._pedidosVistos[p.id] = p); }

/* ============ CHAT ============ */
async function abrirChat(pid) {
  S.chat = pid;
  modal(`<div class="chat">
    <div class="row between"><b>Mensajes del pedido</b><button class="btn sm" onclick="cerrarModal()">Cerrar</button></div>
    <div id="msgs" class="msgs"><div class="cargando">Cargando…</div></div>
    <div class="chatIn">
      <label class="redondo verde">📷<input type="file" accept="image/*" hidden onchange="chatImagen(this)"></label>
      <input class="i" id="chatTxt" placeholder="Escribe un mensaje…" onkeydown="if(event.key==='Enter')chatEnviar()">
      <button class="btn pri" onclick="chatEnviar()">➤</button>
    </div></div>`);
  // con el chat abierto se revisa cada 8 s (solo mientras está abierto; los avisos push lo actualizan al momento)
  clearInterval(S._chatT);
  S._chatT = setInterval(() => { if (!document.hidden) cargarChat(); }, 8000);
  await cargarChat();
}
async function cargarChat() {
  if (!S.chat) return;
  const pid = S.chat;
  try {
    const l = await api('mensajes', { pedidoId: pid });
    const box = $('#msgs'); if (!box || S.chat !== pid) return;
    const abajo = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.innerHTML = l.length ? l.map(m => `<div class="msg ${m.mio ? 'mio' : ''} ${m.rol === 'sistema' ? 'sis' : ''}">
      ${m.rol === 'sistema' ? '' : `<small>${esc(m.nombre)} · ${esc(rolNombre(m.rol))} · ${hora(m.fecha)}</small>`}
      ${m.texto ? `<div>${esc(m.texto)}</div>` : ''}
      ${m.imagenId ? `<button class="lnk" onclick="act(this,()=>verImagen('${pid}','${m.imagenId}'))">🖼️ Ver imagen</button>` : ''}
    </div>`).join('') : '<div class="vacio">Aún no hay mensajes</div>';

/* ============ CLIENTE: CATÁLOGO, PREFERENCIAS Y PRECARGA ============ */
/** Productos en carrito: de un negocio, o de todos si no se indica. */
function itemsCarrito(negId) {
  if (negId) return Object.values(((S.carritos || {})[negId] || {}).items || {});
  return carritosLista().reduce((a, c) => a.concat(Object.values(c.items)), []);
}

function guardarCatalogo(c) {
  S._negs = c.negocios || []; S.promos = c.promos || []; S._catT = Date.now();
  ls('negs', S._negs); ls('promos', S.promos);
  if (S.vista === 'inicio' && $('#listaNeg')) pintarInicioDatos();
}
/** Pide el catálogo (negocios + promos) sin duplicar llamadas si ya hay una en curso. */
function cargarCatalogo() {
  if (S._catProm) return S._catProm;
  const p = api('catalogo').then(guardarCatalogo);
  S._catProm = p;
  p.catch(() => { }).finally(() => { if (S._catProm === p) S._catProm = null; });
  return p;
}

// preferencias del cliente en este teléfono: +1 al abrir un negocio, +3 al pedirle
function prefs() { return ls('pref') || {}; }
function sumarPref(id, k) { const p = prefs(); p[id] = Math.min(200, (p[id] || 0) + k); ls('pref', p); }
function puntaje(n) { const p = prefs(); return (p[n.id] || 0) * 3 + (n.pop || 0) + (n.calif || 0) * 0.3 + (n.abierto ? 2 : 0); }
function prefCategorias() {
  const p = prefs(), c = {};
  (S._negs || []).forEach(n => { if (p[n.id]) c[n.categoria] = (c[n.categoria] || 0) + p[n.id]; });
  return c;
}

/**
 * Precarga en segundo plano los menús (y primeras fotos) de los negocios que este cliente
 * probablemente abrirá: primero los que más pide, luego los más pedidos en general.
 * Una sola llamada para todos; los que ya están guardados y no cambiaron no se vuelven a pedir.
 */
async function precargar() {
  if (!S._negs || !esCliente() || S._precargando) return;
  if (navigator.connection && navigator.connection.saveData) return; // modo "ahorro de datos"
  S._precargando = true;
  try {
    const top = S._negs.filter(n => n.abierto).sort((a, b) => puntaje(b) - puntaje(a)).slice(0, 6);
    const loc = menusLocales();
    const faltan = top.filter(n => !loc[n.id] || loc[n.id].ver !== n.menuVer).map(n => n.id);
    if (faltan.length) (await api('menus', { ids: faltan })).forEach(aplicarMenuFresco);
    top.slice(0, 3).forEach(n => {
      precargarImg(n.portada); precargarImg(n.logo);
      const m = menuLocal(n.id);
      if (m) m.productos.filter(p => p.foto).slice(0, 6).forEach(p => precargarImg(p.foto));
    });
    (S.promos || []).slice(0, 4).forEach(p => precargarImg(p.imagen));
  } catch (e) { } finally { S._precargando = false; }
}

/** Menú recién traído del servidor: se guarda y sus promociones reemplazan a las guardadas de ese negocio. */
function aplicarMenuFresco(m) {
  if (!m || !m.negocio) return;
  guardarMenu(m);
  if (Array.isArray(m.promos)) {
    S.promos = (S.promos || []).filter(p => p.negocioId !== m.negocio.id).concat(m.promos);
    ls('promos', S.promos);
  }
}

/* ---------- precios con promoción ---------- */
function promosDe(negId) { return (S.promos || []).filter(p => p.negocioId === negId); }
function promoProducto(negId, prodId, variante) {
  for (const p of promosDe(negId)) {
    const x = (p.productos || []).find(y => y.productoId === prodId && (y.variante || '') === (variante || '') && y.precioPromo > 0);
    if (x) return { id: p.id, precioPromo: x.precioPromo, titulo: p.titulo, vigencia: p.vigencia };
  }
  return null;
}
/** Precio de un producto (o de su variante) con la promoción vigente, si hay. */
function precioBase(negId, p, variante) {
  let base = Number(p.precio) || 0;
  if (variante) { const v = (p.variantes || []).find(x => x.nombre === variante); if (v) base = Number(v.precio) || 0; }
  const pr = promoProducto(negId, p.id, variante || '');
  return pr && pr.precioPromo < base ? { precio: pr.precioPromo, antes: base, promo: pr.id } : { precio: base, antes: 0, promo: '' };
}
function tienePromo(negId, p) { return idsPromo(negId).has(p.id); }
/** Productos que están en la promoción del día de un negocio (con o sin precio especial). */
function idsPromo(negId) { const s = new Set(); promosDe(negId).forEach(p => (p.productos || []).forEach(x => s.add(x.productoId))); return s; }
const SEC_PROMO = '🏷️ Promo del día';
function seccionesMenu(d) {
  const secs = [...new Set(d.productos.map(p => p.categoria))];
  const base = secs.length > 1 ? ['Todo', ...secs] : secs;
  const ids = idsPromo(d.negocio.id);
  return d.productos.some(p => ids.has(p.id)) ? [SEC_PROMO, ...base] : base;
}
function precioTxt(p, negId) {
  negId = negId || p.negocioId || (S._menu && S._menu.negocio.id);
  const vars = p.variantes || [];
  if (vars.length > 1) {
    const ps = vars.map(v => precioBase(negId, p, v.nombre));
    const min = ps.reduce((a, b) => (b.precio < a.precio ? b : a));
    return `Desde ${min.antes ? `<span class="precioPromo">${money(min.precio)}</span>` : money(min.precio)}`;
  }
  const b = precioBase(negId, p, vars.length === 1 ? vars[0].nombre : '');
  return b.antes ? `<span class="tachado">${money(b.antes)}</span><span class="precioPromo">${money(b.precio)}</span>` : money(b.precio);
}

/** Ajusta los precios del carrito con el menú y promos más recientes. Devuelve true si algo cambió. */
function repreciarCarrito(menuD) {
  const c = menuD && menuD.negocio ? (S.carritos || {})[menuD.negocio.id] : null;
  if (!c) return false;
  const prods = {};
  menuD.productos.forEach(p => prods[p.id] = p);
  let cambio = false;
  Object.values(c.items).forEach(it => {
    const p = prods[it.id];
    if (!p) { delete c.items[it.key]; cambio = true; return; } // ya no está disponible
    const b = precioBase(c.negocioId, p, it.variante);
    const ex = (it.extras || []).map(e => (p.extras || []).find(x => x.nombre === e.nombre)).filter(Boolean);
    const extra = ex.reduce((s, e) => s + (Number(e.precio) || 0), 0);
    const unit = b.precio + extra;
    if (unit !== it.precio || ex.length !== (it.extras || []).length) { it.precio = unit; it.extras = ex; cambio = true; }
    it.promo = b.promo; it.antes = b.antes ? b.antes + extra : 0;
  });
  guardarCarritos();
  return cambio;
}

/* ============ CLIENTE: INICIO, BANNER Y CATEGORÍAS ============ */

/** Rango de tiempo estimado: preparación + traslado. */
function rangoTiempo(n) {
  let viaje = 10;
  const u = S.user;
  if (u && u.lat && n.lat && S.conf) viaje = Math.round(kmRuta(n.lat, n.lng, u.lat, u.lng) / S.conf.velocidadKmh * 60 + 3);
  const a = Math.round((n.tiempoPrep + viaje) / 5) * 5;
  return a + '–' + (a + 15) + ' min';
}
function distanciaTxt(n) {
  const u = S.user;
  return u && u.lat && n.lat ? kmRuta(n.lat, n.lng, u.lat, u.lng).toFixed(1) + ' km' : '';
}

/* ---------- banner de promociones ---------- */
/** Promos ordenadas para este cliente: sus categorías y negocios favoritos primero, abiertos antes que cerrados. */
function promosOrdenadas(cat) {

  return (S.promos || []).filter(p => !cat || cat === 'Todos' || cat === 'Promociones' || p.categoria === cat)

}

function slidePromo(p) {

}

function pintarBanner(cat) {

/** Avanza solo cada 5 s; se detiene un rato si el cliente lo desliza con el dedo. */
function iniciarCarrusel(n) {
  const f = $('#promoFila'); if (!f) return;
  let i = 0, pausa = 0;
  const ancho = () => (f.children[0] ? f.children[0].offsetWidth + 10 : 1);
  f.addEventListener('scroll', () => {
    i = Math.round(f.scrollLeft / ancho());
    const pts = $('#puntos'); if (pts) [...pts.children].forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive: true });
  ['touchstart', 'pointerdown', 'wheel'].forEach(ev => f.addEventListener(ev, () => { pausa = Date.now(); }, { passive: true }));
  S._carrusel = setInterval(() => {
    if (!document.body.contains(f)) { clearInterval(S._carrusel); return; }
    if (document.hidden || Date.now() - pausa < 8000) return;
    f.scrollTo({ left: ((i + 1) % n) * ancho(), behavior: 'smooth' });
  }, 5000);
}

/** Renglones con los productos de una promoción (nombre, precio normal tachado y precio especial). */

    <span>${x.precioPromo ? `<span class="tachado">${money(x.precioAntes)}</span><b class="precioPromo">${money(x.precioPromo)}</b>` : `<span class="muted">${money(x.precioAntes)}</span>`}</span></div>`).join('')}
    ${l.length > max ? `<div class="muted">y ${l.length - max} más…</div>` : ''}</div>`;
}

}

/** Al tocar una promo: abre el negocio y, si va ligada a un producto, su hoja con la opción ya elegida. */
function abrirPromo(id) {

  const prods = p.productos || [];

  if (prods.length === 1) { S._abrirProd = prods[0].productoId; S._abrirVar = prods[0].variante || ''; }
  else if (prods.length > 1) S._abrirSec = SEC_PROMO;
  if (S.vista === 'negocio' && S.params === p.negocioId) {

    else if (S._abrirSec) { S._abrirSec = null; S._sec.tab = 'menu'; S._sec.s = SEC_PROMO; tabNegocio('menu'); }

  return `<div style="height:64px"></div><div class="barra" onclick="ir('carrito')"><span>${ico('bolsa', 's')} ${txt}</span><span>${money(t)}</span></div>`;

function buscarDemora() { clearTimeout(S._tB); S._tB = setTimeout(buscarAhora, 350); }
async function buscarAhora() {
