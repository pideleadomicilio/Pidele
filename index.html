<!-- Mapas (Leaflet) y Firebase ya no frenan la primera pantalla: se cargan cuando hacen falta -->
<script src="firebase-config.js"></script>
<style>
:root{
  --pri:#3B5A2C; --pri2:#2C4521; --pri-s:#E5ECDC; --pri-xs:#F0F4EA;
  --bg:#F6F1E8; --card:#FFFDF8; --tx:#22281D; --tx2:#716C60; --ln:#E8E1D3;
  --ok:#3B7A2C; --ok-s:#E1F0D8; --warn:#9A6206; --warn-s:#FBEFD5; --err:#B42318; --err-s:#FBE3E0;
  --info:#2F5D8A; --info-s:#E2ECF6; --star:#E9A23B; --moto:#D9822B;
  --r:18px; --sh:0 1px 2px rgba(40,35,20,.05),0 4px 14px rgba(40,35,20,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.42 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.sinNav{padding-bottom:0}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
svg.ic.s{width:17px;height:17px} svg.ic.l{width:28px;height:28px}

/* splash */
#splash{position:fixed;inset:0;z-index:999;background:var(--pri);color:#F6F1E8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s}
#splash.fuera{opacity:0;pointer-events:none}
#splash .carga-trazo{color:#F6F1E8;width:168px;height:auto}
.marcaPueblo{font-weight:900;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-top:4px;color:var(--pri)}
#top .logo small{display:block;font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;font-weight:900;opacity:.85;margin-top:-2px}
.marcaTxt{font-weight:900;font-size:58px;letter-spacing:-1.5px;line-height:1}
.marcaSub{font-size:12.5px;letter-spacing:3px;font-weight:700;text-transform:uppercase;opacity:.9;text-align:center}

/* barra superior (negocio, repartidor, admin) */
header{position:sticky;top:0;z-index:50;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:none;align-items:center;gap:10px}
header .logo{font-weight:900;font-size:21px;flex:1;letter-spacing:-.4px}
header .yo{font-size:12px;opacity:.92;text-align:right;line-height:1.15;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:7px 13px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}

main{max-width:720px;margin:0 auto;padding:14px 16px 24px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;transform:translate3d(0,0,0);-webkit-transform:translate3d(0,0,0);will-change:transform;background:var(--card);border-top:1px solid var(--ln);display:none;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:110px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:#9A9486;padding:2px;cursor:pointer;position:relative}
nav button.on{color:var(--pri)}
/* iPhone: mientras el teclado está abierto se ocultan la barra de abajo y la del carrito (iOS las deja "flotando" a media pantalla) */
body.teclado nav,body.teclado .barra{display:none!important}
nav .badge,.badgeC{position:absolute;top:-4px;right:calc(50% - 22px);background:var(--pri);color:#fff;border:2px solid var(--card);border-radius:999px;font-size:10px;font-weight:800;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* tipografía y bloques */
h1{font-size:25px;font-weight:900;margin:6px 0 14px;letter-spacing:-.4px;line-height:1.15}
h2{font-size:20px;font-weight:800;margin:6px 0 12px}
h3{font-size:16.5px;font-weight:800;margin:18px 0 10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2);font-size:13.5px}
.small{font-size:12.5px}
.b{font-weight:800}
.hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
.titBar{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.titBar h2{margin:0;flex:1;text-align:center;font-size:19px}
.titBar .esp{width:40px}
.redondo{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);flex-shrink:0;position:relative;text-decoration:none}
.redondo.verde{background:var(--pri-s);color:var(--pri);box-shadow:none}

/* botones y formularios */
.btn{border:1.5px solid var(--ln);background:var(--card);border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--tx);font-size:14.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pill{border-radius:999px;padding:14px 18px;font-size:16px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.err{color:var(--err);border-color:#EFC4BE}
.btn.full{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1;min-width:118px}
label.f{display:block;margin:12px 0 5px;font-size:13.5px;font-weight:800;color:var(--tx)}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--ln);border-radius:14px;padding:12px 13px;background:var(--card);outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
textarea.i{min-height:70px;resize:vertical}
.conIco{position:relative}
.conIco svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx2)}
.conIco input{padding-left:42px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.t-ok{background:var(--ok-s);color:var(--ok)} .t-warn{background:var(--warn-s);color:var(--warn)} .t-err{background:var(--err-s);color:var(--err)}
.t-info{background:var(--info-s);color:var(--info)} .t-gray{background:#EEE8DD;color:var(--tx2)} .t-pri{background:var(--pri-s);color:var(--pri)}
.aviso{border-radius:14px;padding:11px 13px;margin:0 0 12px;font-size:14px;font-weight:700}
.aviso.warn{background:var(--warn-s);color:var(--warn)} .aviso.err{background:var(--err-s);color:var(--err)}
.aviso.info{background:var(--info-s);color:var(--info)} .aviso.ok{background:var(--ok-s);color:var(--ok)}
.vacio{text-align:center;color:var(--tx2);padding:36px 12px}
.vacio .big{font-size:42px;display:block;margin-bottom:8px}
.cargando{text-align:center;color:var(--tx2);padding:48px}

@keyframes g{to{transform:rotate(360deg)}}
.estrella{color:var(--star)}

/* inicio */
.ubicTop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ubicTop .u{flex:1;min-width:0;cursor:pointer}
.ubicTop .u b{display:flex;align-items:center;gap:4px;font-size:14px}
.ubicTop .u small{display:block;color:var(--tx2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buscar{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--ln);border-radius:16px;padding:12px 14px;background:var(--card);color:var(--tx2);cursor:text;margin-bottom:14px}
.buscar input{border:0;outline:none;background:none;flex:1;min-width:0;color:var(--tx)}
.catFila{display:flex;gap:12px;overflow-x:auto;margin:0 -16px 4px;padding:2px 16px 10px;scrollbar-width:none}
.catFila::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;width:66px;text-align:center;cursor:pointer;background:none;border:0;padding:0}
.cat .cu{width:62px;height:62px;margin:0 auto;border-radius:18px;background:var(--card);border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:27px;transition:.15s}
.cat b{display:block;font-size:11.5px;font-weight:700;margin-top:6px;color:var(--tx);line-height:1.15}
.cat.on .cu{background:var(--pri);border-color:var(--pri);box-shadow:0 6px 14px rgba(59,90,44,.3)}
.secHead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px}
.secHead h3{margin:0}
.secHead button{background:none;border:0;color:var(--pri);font-weight:800;cursor:pointer;font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/** Nombre del municipio debajo de la palabra Pídele. */
const marcaPueblo = (color) => `<div class="marcaPueblo"${color ? ' style="color:' + color + '"' : ''}>${esc(MARCA.corto)}</div>`;
/** Cada municipio guarda su sesión, carritos y menús por separado en el teléfono. */
const prefijoDe = id => 'pe_' + (id === PUEBLOS[0].id ? '' : id + '_');
const LSP = prefijoDe(PUEBLO.id);
function lsDe(id, k, v) {
  const key = prefijoDe(id) + k;
  if (v === undefined) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  try { v === null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(v)); } catch (e) { }
}
/** Cambiar de municipio: se recarga la app conectada al servidor de ese municipio. */
function cambiarPueblo(id, query) {
  try { localStorage.setItem('pe_pueblo', id); } catch (e) { }
  location.href = location.pathname + (query ? '?' + query : '');
}
/*
 * La ciudad la decide la ubicación (no se ofrece elegir):
 * - La primera vez es obligatoria; si está dentro de una ciudad (radio del municipio) se queda en ella.
 * - Fuera de las dos ciudades elige una, y solo puede pagar por transferencia.
 * - Si después abre la app estando en la otra ciudad, cambia sola, con opción de regresar a la suya.
 * - Los administradores se cambian libres desde su panel.
 */
const lsG = (k, v) => { try { if (v === undefined) return localStorage.getItem('pe_' + k); if (v === null) localStorage.removeItem('pe_' + k); else localStorage.setItem('pe_' + k, String(v)); } catch (e) { return null; } };
/** Centro y radio de un municipio (la ubicación registrada en su servidor). */
async function centroDe(pb) {
  S._centros = S._centros || {};
  if (!S._centros[pb.id]) {
    const c = pb.id === PUEBLO.id && S.conf && S.conf.centroLat ? S.conf : await apiDe(pb, 'configPublica', {}, null);
    S._centros[pb.id] = { lat: Number(c.centroLat), lng: Number(c.centroLng), radio: Number(c.radioMunicipioKm) || 15 };
  }
  return S._centros[pb.id];
}
function gpsAhora(motivo) {
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) { mal(new Error('Tu teléfono no permite ubicación.')); return; }
    navigator.geolocation.getCurrentPosition(p => ok({ lat: p.coords.latitude, lng: p.coords.longitude, precision: Math.round(p.coords.accuracy || 0) }),
      () => mal(new Error('Activa tu ubicación ' + (motivo || 'para continuar') + '.')), { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  });
}
/** ¿En qué ciudad estás? La más cercana dentro de su radio, o null. */
async function puebloDeUbicacion(g) {
  let mejor = null;
  for (const pb of PUEBLOS) {
    const c = await centroDe(pb), km = hav(g.lat, g.lng, c.lat, c.lng);
    if (km <= c.radio && (!mejor || km < mejor.km)) mejor = { pb, km };
  }

/** Llamada al servidor de un municipio (el administrador general consulta también los otros). */
async function apiDe(pb, accion, datos, token, propio, modo) {
  const URL1 = pb.api, ALT = pb.alt;
  // id de la operación: si se reenvía por la ruta alterna, el servidor no la repite
  const rid = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const cuerpo = JSON.stringify(Object.assign({ accion, datos: datos || {}, token, rid }, modo ? { modo } : {}));
  let alt = false;
  try { alt = Number(localStorage.getItem('pe_rutaAlt')) > Date.now(); } catch (e) { }
  const intento = async url => {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: cuerpo });
    const t = await r.text();
    try { return JSON.parse(t); } catch (e) { const er = new Error('NOJSON'); er.noLlego = true; throw er; }
  };
  const recordar = v => { try { if (v) localStorage.setItem('pe_rutaAlt', Date.now() + 864e5); else localStorage.removeItem('pe_rutaAlt'); } catch (e) { } };
  let j;
  try {
    j = await intento(alt && ALT ? ALT : URL1);
  } catch (e1) {
    if (!ALT) throw new Error(e1.noLlego ? 'El servidor no respondió bien. Intenta de nuevo.' : 'Sin conexión. Revisa tu internet.');
    try { j = await intento(alt ? URL1 : ALT); recordar(!alt); }
    catch (e2) { throw new Error(e1.noLlego && e2.noLlego ? 'El servidor no respondió bien. Intenta de nuevo.' : 'Sin conexión. Revisa tu internet.'); }
  }
  if (!j.ok) {
    if (j.error === 'SESION' && propio) { salir(true); throw new Error('Tu sesión terminó, vuelve a entrar.'); }
    if (j.error === 'BLOQUEADO' && propio) { vBloqueado(); throw new Error('Cuenta suspendida'); }
    throw new Error(j.error);
  }
  return j.data;
}

/** Ejecuta una acción desde un botón: lo desactiva mientras trabaja y muestra errores. */

function comprimir(file, max) {
  max = max || 1200;
  // SVG: se dibuja a la medida exacta y se guarda como imagen normal (sin el código del SVG, que podría traer scripts)
  const svg = file && (file.type === 'image/svg+xml' || /\.svg$/i.test(file.name || ''));
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onerror = () => mal(new Error('No se pudo leer la imagen'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => mal(new Error(svg ? 'Ese SVG no se pudo abrir. Expórtalo de nuevo (con el texto convertido a curvas) o súbelo en PNG/JPG.' : 'Archivo de imagen no válido'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (svg) {
          // sin ancho/alto en el archivo, se usa la proporción de su viewBox
          const vb = String(fr.result).match(/viewBox=["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)/i);
          if (vb && (!w || !h || w < 50)) { w = +vb[1]; h = +vb[2]; }
          if (!w || !h) { w = 1200; h = 600; }
        }
        const k = svg ? max / Math.max(w, h) : Math.min(1, max / Math.max(w, h)); // el SVG se amplía sin perder nitidez
        const c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.78));
      };
      img.src = svg ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(fr.result) : fr.result;
    };
    if (svg) fr.readAsText(file); else fr.readAsDataURL(file);
  });
}

async function copiar(txt, que) {
  try { await navigator.clipboard.writeText(String(txt)); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (x) { } t.remove();
  }
  toast((que || 'Dato') + ' copiado ✓');
}

function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22].forEach(t => {
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(0.25, a.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + t + 0.18);
      o.start(a.currentTime + t); o.stop(a.currentTime + t + 0.2);
    });
  } catch (e) { }
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function avisar(titulo, cuerpo) {
  beep();
  toast(titulo);
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) {
    navigator.serviceWorker.ready.then(r => r.showNotification(titulo, { body: cuerpo || '', icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'pe', renotify: true })).catch(() => { });
  }
}

/* ============ ARRANQUE Y SESIÓN ============ */
/**
 * Arranque rápido:
 * 1) se pinta de inmediato la pantalla con lo guardado en el teléfono (catálogo, usuario);
 * 2) UNA sola llamada al servidor ("arranque") trae configuración, sesión y catálogo actualizados;
 * 3) en reposo se precargan los menús más probables, sus fotos y la librería de mapas.
 */
async function arrancar() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
    // versión nueva instalada: se aplica sola si el usuario está en una pantalla donde no pierde nada
    let recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recargado || !S._swPrevio) return;
      if (['inicio', 'entrar', 'negPedidos', 'disponibles', 'admin'].includes(S.vista) && !$('#modal').classList.contains('on')) { recargado = true; location.reload(); }
    });
    S._swPrevio = !!navigator.serviceWorker.controller;
  }
  if (!S.token || !S.user) { S.token = null; S.user = null; }
  S._catProm = refrescarArranque();
  const deUrl = location.search;
  // la entrada base del historial es el inicio, para que "volver" funcione al llegar por un enlace
  history.replaceState({ v: inicioRol() }, '', location.pathname);
  if (!abrirDesdeUrl(deUrl)) ir(inicioRol(), null);
  quitarSplash();
  await S._catProm.catch(() => { });
  S._catProm = null;
  enReposo(cargarLeaflet, 2500);
}

function quitarSplash() {
  // se quita en cuanto hay algo que mostrar (antes esperaba 1.3 s fijos)
  const sp = $('#splash');
  const fuera = () => sp.classList.add('fuera');
  if (S._negs || S.token || S.vista !== 'inicio') requestAnimationFrame(() => setTimeout(fuera, 120));
  else { const t0 = Date.now(), chk = setInterval(() => { if (S._negs || Date.now() - t0 > 6000) { clearInterval(chk); fuera(); } }, 80); }
}

async function refrescarArranque() {
  const conToken = !!S.token;
  const d = await api('arranque');
  S.conf = d.config; ls('conf', S.conf);
  if (conToken && S.token) {
    if (d.sesion === 'BLOQUEADO') { vBloqueado(); return; }
    if (d.sesion === 'SESION') { salir(true); toast('Tu sesión terminó, vuelve a entrar.'); }
    else if (d.usuario) {
      S.user = d.usuario; S.negocio = d.negocio; ls('user', S.user); ls('negocio', S.negocio);
      if (S.user.cambiarPass && S.vista !== 'nuevaClave') ir('nuevaClave');
      else setTimeout(pedirAviso, 1200);
    }
  }
  if (d.catalogo) guardarCatalogo(d.catalogo);
  pintarNav();
  if (S.token && S.user) {
    iniciarSondeo();
    if (rolActual() === 'repartidor') iniciarGPS();
    enReposo(() => activarPush(false).catch(() => { }), 1500);
  }
  enReposo(precargar, 600);
  ubicarAlAbrir();
}

function guardarSesion(d) {
  S.token = d.token; S.user = d.usuario; S.negocio = d.negocio; S.conf = d.config; S.modoCliente = false; ls('modoCliente', null); S.modoRep = false; ls('modoRep', null);
  ls('token', S.token); ls('user', S.user); ls('negocio', S.negocio); ls('conf', S.conf);
  history.replaceState(null, '');
  // entró con contraseña temporal: primero crea una nueva
  const destino = S.user.cambiarPass ? 'nuevaClave' : S.despues && S.user.rol === 'comprador' ? S.despues : inicioRol();
  if (destino === 'compartido') history.replaceState({ v: inicioRol() }, '', location.pathname);
  S.despues = null;
  ir(destino); // el inicio ya está cargado desde que se abrió la pantalla de entrar: aparece al instante
  if (destino !== 'nuevaClave') setTimeout(pedirAviso, 1200);
  iniciarSondeo();
  if (S.user.rol === 'repartidor') iniciarGPS();
  activarPush(false).catch(() => { });
  if (S.user.rol === 'comprador') enReposo(precargar, 800);
}

function salir(silencioso) {
  quitarPush();
  if (!silencioso && S.token) api('salir', { token: S.token }).catch(() => { });
  ['token', 'user', 'negocio', 'entrega', 'modoCliente', 'modoRep', 'modoServicio'].forEach(k => ls(k, null));
  S.modoCliente = false; S.modoRep = false; S.modoServicio = false; S.token = null; S.user = null; S.negocio = null; S.firma = ''; S._yaAbrioEntregas = false; S.nuevos = 0; S.despues = null; S.entrega = null;
  clearTimeout(S._sondeo); S._genSondeo = (S._genSondeo || 0) + 1;
  if (S._gps && navigator.geolocation) { navigator.geolocation.clearWatch(S._gps); S._gps = null; }

/* ============ NOTIFICACIONES ============ */
function pushDisponible() {
  // Firebase se descarga hasta que se necesita; aquí solo se revisa que el teléfono pueda recibir avisos
  return typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.apiKey &&
    'serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window;
}
function esIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent || ''); }
function instalada() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }

/** Registra este teléfono para recibir notificaciones. pedir=true muestra el permiso del navegador. */
async function activarPush(pedir) {
  if (!S.token || !pushDisponible()) return false;
  if (Notification.permission === 'default') {
    if (!pedir) return false;
    const r = await Notification.requestPermission();
    if (r !== 'granted') { toast('Sin permiso no podemos avisarte. Puedes activarlo después en Perfil.', 'err'); pintarBannerPush(); return false; }
  }
  if (Notification.permission !== 'granted') return false;
  await cargarFirebase();
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const m = firebase.messaging();
  const fcm = await m.getToken({ vapidKey: FIREBASE_VAPID || undefined, serviceWorkerRegistration: reg });
  if (!fcm) return false;
  const clave = S.user.id + '|' + fcm;
  if (ls('fcm') !== clave) { await api('registrarDispositivo', { fcm, ua: navigator.userAgent.slice(0, 120) }); ls('fcm', clave); }
  if (!S._onMsg) {
    S._onMsg = true;
    // con la app abierta: sonido + aviso y se actualiza la pantalla al momento
    m.onMessage(p => { const d = p.data || {}; S._pushReciente = Date.now(); beep(); toast(d.titulo || APP); sondear(true); });
  }
  pintarBannerPush();
  return true;
}

async function botonActivarPush(btn) {
  await act(btn, async () => { if (await activarPush(true)) toast('¡Listo! Te avisaremos de tus pedidos 🔔'); });
}

function quitarPush() {
  const f = ls('fcm');
  if (f && S.token) api('quitarDispositivo', { fcm: f.split('|')[1] }).catch(() => { });
  ls('fcm', null);
}

/** Aviso para activar notificaciones (solo si se pueden y aún no se decidió). */
function bannerPush() {
  if (!S.token || ls('pushNo')) return '<div id="bannerPush"></div>';
  let h = '';
  if (pushDisponible() && Notification.permission === 'default') {
    const txt = { comprador: 'Te avisamos cuando tu pedido avance, aunque tengas la app cerrada.', negocio: 'Entérate al instante de cada pedido nuevo y cada comprobante.', repartidor: 'Recibe al momento los pedidos disponibles.', admin: 'Recibe avisos de cuentas por aprobar.' }[S.user.rol];
    h = `<div class="bannerPush"><span style="font-size:26px">🔔</span><div class="t"><b>Activa las notificaciones</b>${txt}</div>
      <button class="btn" onclick="botonActivarPush(this)">Activar</button><button class="x" onclick="ls('pushNo',1);pintarBannerPush()" aria-label="Ahora no">✕</button></div>`;
  } else if (esIOS() && !instalada() && typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.apiKey) {
    h = `<div class="bannerPush"><span style="font-size:26px">📲</span><div class="t"><b>Instala la app para recibir avisos</b>En iPhone: botón Compartir → “Agregar a inicio” y ábrela desde ahí.</div>
      <button class="x" onclick="ls('pushNo',1);pintarBannerPush()" aria-label="Cerrar">✕</button></div>`;
  }
  return `<div id="bannerPush">${h}</div>`;
}
function pintarBannerPush() { const b = $('#bannerPush'); if (b && b.outerHTML !== undefined) b.outerHTML = bannerPush(); }

function estadoPushTexto() {
  if (!pushDisponible()) return esIOS() && !instalada() ? 'Para recibir avisos en iPhone, instala la app (Compartir → Agregar a inicio).' : '';
  if (Notification.permission === 'granted') return ls('fcm') ? '🔔 Notificaciones activas en este teléfono' : '';

/** Abre la pantalla que trae una notificación (?pedido=ID o ?v=vista). */
function abrirDesdeUrl(url) {
  let q;
  try { q = new URL(url, location.href).searchParams; } catch (e) { return false; }
  const ped = q.get('pedido'), v = q.get('v'), neg = q.get('negocio');
  if (PUEBLO_PEND && q.get('pueblo') === PUEBLO_PEND) return false; // enlace de otro municipio: primero se comprueba la ubicación
  if (neg) { ir('negocio', neg); return true; }
  if (q.get('inv')) {
    if (S.token) { ir(inicioRol(), null); setTimeout(() => toast('Esa invitación es para crear una cuenta nueva: cierra tu sesión para usarla'), 500); }
    else vInvitacion(q.get('inv'));
    return true;
  }
  if (q.get('instalar')) { ir(inicioRol(), null); setTimeout(instalarApp, 600); return true; }
  if (q.get('compartido')) {
    if (!S.token) { S.despues = 'compartido'; ir('entrar'); setTimeout(() => toast('Entra a tu cuenta para enviar tu comprobante'), 400); return true; }
    ir('compartido'); return true;
  }
  if (!S.token || (!ped && !v)) return false;
  if (v === 'disponibles' && esAdminU()) { modoRepartidor(true); return true; } // aviso de un pedido de muestra
  if (ped) ir('pedido', ped); else if (VISTAS[v] && (navRol().some(x => x[0] === v) || ((v === 'adminComisiones' || v === 'moderacion') && rolActual() === 'admin') || (v === 'suscripcion' && ['negocio', 'repartidor'].includes(rolActual())))) ir(v); else return false;
  return true;
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.abrir) abrirDesdeUrl(e.data.abrir); });

function urlApp(params) {

}

function cargarQR() {
  if (window.QRCode) return Promise.resolve(window.QRCode);
  return new Promise((ok, mal) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload = () => window.QRCode ? ok(window.QRCode) : mal(new Error('No se pudo crear el QR'));
    sc.onerror = () => mal(new Error('No se pudo crear el QR. Revisa tu internet.'));
    document.head.appendChild(sc);
  });
}

    <div class="btns">

/** QR listo para imprimir: logo de texto arriba, código y nombre abajo. */
async function descargarQR() {
  const src = document.querySelector('#qrCodigo canvas');
  if (!src) throw new Error('El QR aún no está listo');
  const c = S._compartir, W = 900, H = 1180, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.fillStyle = '#3B5A2C'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#F6F1E8'; x.textAlign = 'center';
  x.font = '900 110px Nunito, Arial, sans-serif'; x.fillText('Pídele', W / 2, 160);
  x.font = '700 30px Nunito, Arial, sans-serif'; x.fillText('TU COMIDA FAVORITA, A UN CLICK', W / 2, 215);
  x.fillStyle = '#ffffff'; x.fillRect(150, 270, 600, 600);
  x.imageSmoothingEnabled = false; x.drawImage(src, 180, 300, 540, 540);
  x.fillStyle = '#F6F1E8';
  x.font = '800 46px Nunito, Arial, sans-serif'; x.fillText(c.titulo.replace(/ en Pídele$/, ''), W / 2, 950, W - 80);
  x.font = '600 32px Nunito, Arial, sans-serif'; x.fillText('Escanea y pide a domicilio', W / 2, 1010);
  x.font = '600 24px Nunito, Arial, sans-serif'; x.fillText(c.url.replace(/^https?:\/\//, ''), W / 2, 1110, W - 80);
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = 'QR-' + String(c.archivoQR || 'Pidele').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '-') + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('QR descargado ✓');
}

/* ============ SONDEO (actualizaciones) ============ */
/*
 * Cada cuánto se consulta al servidor. Con las notificaciones de Firebase los cambios llegan al momento
 * (y disparan una consulta inmediata), así que el sondeo es solo un respaldo.
 */
const SONDEO_MS = { comprador: 60000, negocio: 30000, repartidor: 20000, admin: 30000 };
function intervaloSondeo() {
  const r = S.user ? S.user.rol : '';
  // siguiendo un pedido que ya va en camino: más seguido para mover al repartidor en el mapa
  if (r === 'comprador' && S.vista === 'pedido' && S._trk && ['EN_CAMINO', 'LISTO', 'PREPARANDO'].includes(S._trk.estado)) return 20000;
  return SONDEO_MS[r] || 60000;
}
function iniciarSondeo() {
  clearTimeout(S._sondeo);
  const gen = S._genSondeo = (S._genSondeo || 0) + 1; // evita dos ciclos a la vez si se reinicia
  const ciclo = async () => {
    if (gen !== S._genSondeo) return;
    await sondear();
    if (S.token && gen === S._genSondeo) S._sondeo = setTimeout(ciclo, intervaloSondeo());
  };
  ciclo();
}
async function sondear(forzar) {
  if (!S.token || !S.user || (document.hidden && S.user.rol === 'comprador' && !forzar)) return;
  if (S._sondeando) return;
  S._sondeando = true;
  try {
    const d = await api('sondeo', rolActual() === 'repartidor' && S.pos ? S.pos : {});
    const cambio = S.firma && d.firma !== S.firma;
    const masNuevos = d.nuevos > S.nuevos;
    if (d.turno && S.user.rol === 'repartidor') S.user.turno = d.turno;
    if (S.firma && Date.now() - (S._pushReciente || 0) > 20000) {
      if (S.user.rol === 'negocio' && masNuevos) avisar('🔔 Tienes pedidos por atender', 'Revisa la pestaña Pedidos');
      else if (rolActual() === 'repartidor' && masNuevos && (!d.turno || d.turno.disponible)) avisar(S.modoRep ? '🧪 Pedido de muestra para entregar' : '📋 Hay pedidos disponibles', 'Abre Disponibles para tomarlos');
      else if (S.user.rol === 'comprador' && cambio) avisar('🔔 Tu pedido se actualizó');
    }
    S.firma = d.firma; S.nuevos = d.nuevos;
    if (S.user.estado !== d.estado) { S.user.estado = d.estado; ls('user', S.user); }
    pintarNav();
    S.ticks++;
    // en el seguimiento se repinta en cada consulta (mueve al repartidor); en las demás, al haber cambios
    const cada = S.vista === 'pedido' ? 1 : 4;
    if (S.auto && !$('#modal').classList.contains('on') && (cambio || forzar || S.ticks % cada === 0)) pintar(true);
    if (S.chat && forzar) cargarChat();
  } catch (e) { } finally { S._sondeando = false; }
}

function iniciarGPS() {
  if (!navigator.geolocation || S._gps) return;
  S._gps = navigator.geolocation.watchPosition(
    p => {
      const antes = S.pos;
      S.pos = { lat: p.coords.latitude, lng: p.coords.longitude }; S.gpsErr = 0;
      if (!antes && $('#avisoGPS')) pintar(true); // se acaba de activar: quitar el aviso
    },
    e => { S.gpsErr = e.code || 2; if (e.code === 1) { navigator.geolocation.clearWatch(S._gps); S._gps = null; } },
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
}

/** El repartidor toca "Activar ubicación": se pide el permiso; si está bloqueado, se explica cómo habilitarlo. */
async function activarUbicacion() {
  if (!navigator.geolocation) { ayudaUbicacion('sin'); return; }
  try {
    if (navigator.permissions) {
      const st = await navigator.permissions.query({ name: 'geolocation' });
      if (st.state === 'denied') { ayudaUbicacion('bloqueada'); return; }

  toast('Buscando tu ubicación…');

    e => { ayudaUbicacion(e.code === 1 ? 'bloqueada' : 'apagada'); listo(); },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }));
}

         <li>Revisa que la <b>Ubicación</b> del teléfono esté encendida (desliza desde arriba de la pantalla).</li></ol>`;

/* ============ MAPAS ============ */
function nuevoMapa(id, lat, lng, zoom) {
  if (S.map) { try { S.map.remove(); } catch (e) { } }
  const m = L.map(id, { zoomControl: true, attributionControl: true }).setView([lat, lng], zoom || 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
  S.map = m;
  // si el usuario ya cambió de pantalla, el mapa se quitó: no hay que ajustarlo
  setTimeout(() => { if (S.map === m && document.body.contains(m.getContainer())) { try { m.invalidateSize(); } catch (e) { } } }, 250);
  return m;
}

/** Mapa para elegir un punto: clic o arrastrar el marcador. */
function mapaSelector(id, lat, lng, cb) {
  const c = S.conf || { centroLat: 23.9213, centroLng: -106.8916 };
  const ini = [lat || c.centroLat, lng || c.centroLng];
  const m = nuevoMapa(id, ini[0], ini[1], lat ? 17 : 15);
  const mk = L.marker(ini, { draggable: true, icon: pinIcono('🏠', '#3B5A2C') }).addTo(m);
  const fijar = (la, ln, centrar) => { mk.setLatLng([la, ln]); if (centrar) m.setView([la, ln], 17); cb(la, ln); };
  mk.on('dragend', () => { const p = mk.getLatLng(); fijar(p.lat, p.lng); });
  m.on('click', e => fijar(e.latlng.lat, e.latlng.lng));
  if (lat) cb(lat, lng);
  return { fijar };
}

function miUbicacion(cb) {
  if (!navigator.geolocation) { toast('Tu teléfono no permite ubicación', 'err'); return; }
  toast('Buscando tu ubicación…');
  navigator.geolocation.getCurrentPosition(
    p => cb(p.coords.latitude, p.coords.longitude),
    () => toast('No se pudo obtener tu ubicación. Activa el GPS y da permiso.', 'err'),
    { enableHighAccuracy: true, timeout: 15000 });
}

function pinIcono(txt, color) {

/* ============ TARIFAS POR HORARIO Y ZONAS (2.11) — mismo cálculo que el servidor ============ */
function minutosSinaloa(t) {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Mazatlan', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(t || Date.now()));
  const g = k => +((p.find(x => x.type === k) || {}).value || 0);
  return (g('hour') % 24) * 60 + g('minute');
}
function tabuladores() { const l = (S.conf && S.conf.tarifas) || []; return l.length ? l : [{ desde: '00:00', min: 0, base: 30 }]; }
function baseAhora(t) { const tabs = tabuladores(), m = minutosSinaloa(t); let b = tabs[tabs.length - 1]; tabs.forEach(x => { if (x.min <= m) b = x; }); return b.base; }
function zonaDe(lat, lng) { let mejor = null, dm = Infinity; ((S.conf && S.conf.zonas) || []).forEach(z => { const d = hav(lat, lng, z.lat, z.lng) * 1000; if (d <= z.radio && d < dm) { dm = d; mejor = z; } }); return mejor; }
function tarifa(km, lat, lng) {
  const c = S.conf, base = baseAhora(), minima = Math.min(...tabuladores().map(x => x.base));
  const z = lat ? zonaDe(lat, lng) : null;
  if (z) return Math.ceil((z.tarifa + base - minima) / 5) * 5;
  return Math.ceil((base + Math.max(0, km - c.kmIncluidos) * c.envioPorKm) / 5) * 5;
}
function textoTarifas() {
  return tabuladores().map((x, i, a) => 'desde las ' + horaTxt(x.desde) + ' ' + money(x.base)).join(' · ');
}
function horaTxt(hhmm) { const [h, m] = String(hhmm).split(':').map(Number); return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? ' am' : ' pm'); }

/* ---------- editores de Ajustes: tabuladores y zonas (también los usa el administrador local) ---------- */
function campoEspecial(c) {

      ${l.slice(0, 3).map((x, i) => `<div class="row" style="gap:8px;margin-top:6px"><span class="muted small" style="width:70px">${['☀️ Día', '🌆 Tarde', '🌙 Noche'][i]}</span>
        <input class="i tabH" type="time" value="${esc(x.desde)}" oninput="leerTabuladores()"><span class="muted">$</span><input class="i tabB" type="number" min="0" value="${esc(x.base)}" oninput="leerTabuladores()"></div>`).join('')}

function leerTabuladores() {

  const inp = document.querySelector('.cfg[data-k="tarifasHorario"]'); if (inp) inp.value = JSON.stringify(h.map((x, i) => ({ desde: x, base: b[i] })).filter(x => x.desde));

function listaZonasHTML() {

async function editarZona(i) {
  const c = S.conf || {}, z = i >= 0 ? Object.assign({}, S._zonas[i]) : { nombre: '', tarifa: 80, radio: 800, lat: 0, lng: 0 };
  S._zonaEd = z; S._zonaIdx = i;
  modal(`<div class="row between"><h2 style="margin:0">${i >= 0 ? 'Editar zona' : 'Nueva zona'}</h2><button class="redondo" onclick="cerrarModal()" aria-label="Cerrar">✕</button></div>

    <div id="mapaZona" class="mapa alto"></div>
    <div class="btns"><button class="btn pri pill full" onclick="act(this,guardarZona)">Guardar zona</button></div>`);
  await cargarLeaflet();
  const sel = mapaSelector('mapaZona', z.lat || c.centroLat, z.lng || c.centroLng, (la, ln) => { S._zonaEd.lat = la; S._zonaEd.lng = ln; circuloZona(); });
  if (!z.lat) { S._zonaEd.lat = 0; }
  setTimeout(() => { try { S.map.setZoom(z.lat ? 14 : 12); } catch (e) { } }, 50);

function circuloZona() {
  const z = S._zonaEd; if (!S.map || !z || !z.lat) return;
  const r = Number(($('#zRad') || {}).value) || 800;
  if (S._circ) S._circ.remove();
  S._circ = L.circle([z.lat, z.lng], { radius: r, color: '#3B5A2C', fillOpacity: .15 }).addTo(S.map);

function guardarZona() {
  const z = S._zonaEd;
  z.nombre = $('#zNom').value.trim(); z.tarifa = Number($('#zTar').value) || 0; z.radio = Number($('#zRad').value) || 800;
  if (z.nombre.length < 2) throw new Error('Escribe el nombre de la zona');
  if (!z.lat) throw new Error('Toca el mapa en el centro de la zona');
  z.lat = Math.round(z.lat * 1e5) / 1e5; z.lng = Math.round(z.lng * 1e5) / 1e5;
  if (S._zonaIdx >= 0) S._zonas[S._zonaIdx] = z; else S._zonas.push(z);

}

function botonesMod(p) {

  if (p.estado === 'NUEVO') b.push(`<button class="btn sm ok" onclick="aceptarMod('${p.id}',${p.minutosSugeridos || 20})">✅ Aceptar por el negocio</button>`);
  if (p.tipoEntrega === 'domicilio' && ['NUEVO', 'POR_PAGAR', 'PAGO_ENVIADO', 'PREPARANDO', 'LISTO'].includes(p.estado)) b.push(`<button class="btn sm pri" onclick="act(this,()=>asignarMod('${p.id}'))">🛵 ${p.repartidor ? 'Reasignar' : 'Asignar'} repartidor</button>`);
  if (!p.servicio) b.push(`<button class="btn sm" onclick="metodoMod('${p.id}','${p.metodoPago}')">💳 Cambiar pago</button>`);
  b.push(`<button class="btn sm err" onclick="act(this,()=>cancelar('${p.id}'))">Cancelar</button>`);
  return b.join('');
}

/* ============ COMPONENTES DE PEDIDO ============ */
function etiqueta(e, p) {
  if (p && p.muestra) return '<span class="tag t-warn" style="margin-right:4px">🧪 MUESTRA</span>' + etiqueta(e, Object.assign({}, p, { muestra: false }));
  if (p && p.servicio) return '<span class="tag t-pri" style="margin-right:4px">🛵 Servicio</span>' + etiqueta(e, Object.assign({}, p, { servicio: false }));
  if (p && p.foraneo) return `<span class="tag t-info" style="margin-right:4px">📍 ${esc(p.zona && p.zona !== 'Foráneo' ? p.zona : 'Foráneo')}</span>` + etiqueta(e, Object.assign({}, p, { foraneo: false }));
  const cls = { NUEVO: 't-info', POR_PAGAR: 't-warn', PAGO_ENVIADO: 't-warn', PREPARANDO: 't-pri', LISTO: 't-pri', EN_CAMINO: 't-info', ENTREGADO: 't-ok', CANCELADO: 't-err' }[e] || 't-gray';
  let txt = EST[e] ? EST[e][1] + ' ' + EST[e][0] : e;
  if (e === 'LISTO' && p && p.tipoEntrega === 'recoger') txt = '📦 Listo para recoger';
  return `<span class="tag ${cls}">${txt}</span>`;
}

/** Texto de extras, "sin" y nota de un producto del pedido. */
function detalleItem(it) {
  const p = [];
  if (it.variante) p.push('<b>' + esc(it.variante) + '</b>');
  (it.mods || []).forEach(m => p.push(esc(m.grupo) + ': <b>' + (m.opciones || m.o || []).map(o => esc(o.nombre)).join(', ') + '</b>'));
  (it.extras || []).forEach(e => p.push('+ ' + esc(e.nombre)));
  (it.sin || []).forEach(s => p.push('Sin ' + esc(s)));
  if (it.nota) p.push('“' + esc(it.nota) + '”');
  return p.join(' · ');
}

function listaItems(items) {
  return items.map(it => {
    const d = detalleItem(it);
    const extra = (it.extras || []).reduce((s, e) => s + (Number(e.precio) || 0), 0);
    const pr = it.antes ? `<span class="tachado">${money((it.antes + extra) * it.cant)}</span><span class="precioPromo">${money(it.precio * it.cant)}</span>` : money(it.precio * it.cant);
    return `<div class="tot"><span>${it.cant} × ${esc(it.nombre)}${it.promo ? ' <span class="tag t-err">PROMO</span>' : ''}${it.desc ? ' <span class="tag t-err">−' + money(it.desc) + '</span>' : ''}${d ? `<br><span class="detalle">${d}</span>` : ''}</span><span>${pr}</span></div>`;
  }).join('');
}

function resumenCobro(p) {
  const efe = p.metodoPago === 'efectivo';
  const ds = p.descuento ? `<div class="tot"><span>Productos</span><b>${money(p.subtotal + p.descuento)}</b></div>` + (p.descuentos || []).map(x => `<div class="tot" style="color:var(--ok,#1a7f4b)"><span>🏷️ ${esc(x.etiqueta || '')} · ${esc(x.titulo)}</span><b>−${money(x.monto)}</b></div>`).join('') : '';
  return `${ds}<div class="tot"><span>Subtotal</span><b>${money(p.subtotal)}</b></div>
    ${p.servicio ? '' : p.tipoEntrega === 'recoger' ? '<div class="tot"><span>Recoges en el negocio</span><b>$0</b></div>' : `<div class="tot"><span>Costo de envío</span><b>${money(p.envio)}</b></div>`}
    <div class="tot g"><span>Total</span><span>${money(p.total)}</span></div>
    <div class="muted small" style="margin-top:6px">${ico(efe ? 'efectivo' : 'banco', 's')} ${efe
      ? (p.servicio ? 'Servicio del repartidor: paga ' + money(p.subtotal) + ' en efectivo al recogerlo.' : p.tipoEntrega === 'recoger' ? 'Pago en efectivo al recoger.' : 'Pago en efectivo al repartidor: ' + money(p.total) + '.')
      : p.envioEn === 'negocio' ? PAGO_TXT[p.metodoPago] + ' al negocio: ' + money(p.montoTransferencia) + ' (incluye el envío).'
      : PAGO_TXT[p.metodoPago] + ' al negocio: ' + money(p.subtotal) + (p.envio ? ' · envío ' + money(p.envio) + ' al repartidor (efectivo o transferencia).' : '.')}</div>`;
}

/** Botones de acción según el rol (negocio, repartidor, admin). */
function botonesPedido(p, enTarjeta) {
  const r = rolActual(), b = [], id = p.id;
  const efe = p.metodoPago === 'efectivo', recoger = p.tipoEntrega === 'recoger';
  if (r === 'negocio') {
    if (p.estado === 'NUEVO') {
      const ops = [10, 15, 20, 25, 30, 40, 50, 60, 90];
      const sug = p.minutosSugeridos || (S.negocio && S.negocio.tiempoPrep) || 20;
      const t = ops.find(m => m >= sug) || 90;
      b.push(`<select class="i" id="min_${id}" style="flex:1;min-width:110px">${ops.map(m => `<option value="${m}" ${m === t ? 'selected' : ''}>${m} min</option>`).join('')}</select>`);
      b.push(`<button class="btn ok" onclick="act(this,()=>accion('aceptarPedido',{id:'${id}',minutos:$('#min_${id}').value},'Pedido aceptado'))">Aceptar</button>`);
      b.push(`<button class="btn err" onclick="act(this,()=>cancelar('${id}','Rechazar'))">Rechazar</button>`);
    }
    if (p.estado === 'PAGO_ENVIADO') {
      if (p.comprobanteId) b.push(`<button class="btn" onclick="act(this,()=>verImagen('${id}','${p.comprobanteId}'))">🧾 Ver comprobante</button>`);
      b.push(`<button class="btn ok" onclick="act(this,()=>confirmarPago('${id}'))">Pago recibido ✓</button>`);
      b.push(`<button class="btn err" onclick="act(this,()=>noRecibido('${id}'))">No lo veo</button>`);
    }
    if (p.estado === 'POR_PAGAR') b.push(`<button class="btn ok" onclick="act(this,()=>confirmarPago('${id}'))">Ya me pagó ✓</button>`);
    if (p.estado === 'PREPARANDO') b.push(`<button class="btn" onclick="act(this,()=>accion('marcarListo',{id:'${id}'},'Marcado como listo'))">📦 Ya está listo</button>`);
    if (['PREPARANDO', 'LISTO'].includes(p.estado) && !recoger && p.repartidor) {
      const pagaEnv = p.envioEn === 'negocio' ? p.envio : 0;
      b.push(`<button class="btn pri" onclick="act(this,()=>entregarRep('${id}',${efe ? p.subtotal : 0},'${esc(p.repartidor.nombre.replace(/['"\\]/g, ''))}',${pagaEnv}))">${ico('moto', 's')} Entregar a ${esc(p.repartidor.nombre.split(' ')[0])}${efe ? ' · cóbrale ' + money(p.subtotal) : pagaEnv ? ' · págale ' + money(pagaEnv) + ' de envío' : ''}</button>`);
    }
    if (['PREPARANDO', 'LISTO'].includes(p.estado) && recoger) {
      b.push(`<button class="btn pri" onclick="act(this,()=>entregarCli('${id}',${efe ? p.total : 0}))">${ico('check', 's')} Entregado al cliente${efe ? ' · cobra ' + money(p.total) : ''}</button>`);
    }
    // reparto propio del negocio
    const rep = (S.negocio && S.negocio.reparto) || 'pidele';
    if (['PREPARANDO', 'LISTO'].includes(p.estado) && !recoger && !p.repartidor && (p.propio || rep !== 'pidele')) {
      b.push(`<button class="btn pri" onclick="elegirRepPropio('${id}')">${ico('moto', 's')} Enviar con mi repartidor</button>`);
    } else if (['PREPARANDO', 'LISTO'].includes(p.estado) && !recoger && !p.repartidor && (p.sinRepartidor || p.estado === 'LISTO')) {
      // nadie lo ha tomado: el negocio puede mandarlo por su cuenta o escribirle a un repartidor
      b.push(`<button class="btn pri" onclick="porMisMedios('${id}')">${ico('moto', 's')} Lo envío por mis medios</button>`);
      b.push(`<button class="btn" onclick="act(this,()=>directorioRep('${id}'))">📒 Repartidores disponibles</button>`);
    }
    if (p.estado === 'EN_CAMINO' && p.propio) {
      if (p.repPropio && p.repPropio.telefono) b.push(`<a class="btn" href="${waLink(p.repPropio.telefono, fichaReparto(p))}" target="_blank">${ico('chat', 's')} Reenviar ficha a ${esc(p.repPropio.nombre.split(' ')[0])}</a>`);
      b.push(`<button class="btn ok" onclick="act(this,()=>entregadoPropio('${id}'))">${ico('check', 's')} Ya se entregó</button>`);
      if (!enTarjeta) b.push(`<button class="btn err" onclick="act(this,()=>cancelar('${id}'))">Cancelar</button>`);
    }
    if (['POR_PAGAR', 'PAGO_ENVIADO', 'PREPARANDO', 'LISTO'].includes(p.estado) && !enTarjeta) b.push(`<button class="btn err" onclick="act(this,()=>cancelar('${id}'))">Cancelar</button>`);
  }
  if (r === 'repartidor' && p.servicio && p.estado === 'NUEVO' && !enTarjeta) b.push(`<button class="btn err" onclick="act(this,()=>cancelar('${id}'))">Cancelar servicio</button>`);
  if (r === 'repartidor' && p.repartidor && p.repartidor.id === S.user.id) {
    if (['PREPARANDO', 'LISTO'].includes(p.estado)) {
      b.push(`<a class="btn" href="${gmaps(p.negocio.lat, p.negocio.lng)}" target="_blank">${ico('mapa', 's')} Al negocio</a>`);
      b.push(`<button class="btn" onclick="act(this,()=>recogido('${id}'))">🛍️ Ya lo recogí</button>`);
      if (!enTarjeta) b.push(p.servicio ? `<button class="btn err" onclick="act(this,()=>cancelar('${id}'))">Cancelar servicio</button>` : `<button class="btn err" onclick="act(this,()=>liberar('${id}'))">Liberar pedido</button>`);
    }
    if (p.estado === 'EN_CAMINO' && p.servicio) b.push(`<button class="btn ok" onclick="act(this,()=>entregado('${id}',0))">${ico('check', 's')} Ya lo entregué</button>`);
    else if (p.estado === 'EN_CAMINO') {
      b.push(`<a class="btn pri" href="${gmaps(p.lat, p.lng)}" target="_blank">${ico('mapa', 's')} Abrir en Maps</a>`);
      b.push(`<button class="btn" onclick="copiarUbicacion('${id}')">${ico('copiar', 's')} Copiar ubicación</button>`);
      b.push(`<button class="btn ok" onclick="act(this,()=>entregado('${id}',${efe ? p.total : p.envio}))">${ico('check', 's')} Entregado</button>`);
    }
  }
  if ((r === 'admin' || r === 'moderador') && !enTarjeta) b.push(botonesMod(p));
  if (p.puedeCalificar && (r === 'negocio' || r === 'repartidor')) {
    const nomRep = p.repartidor ? p.repartidor.nombre.split(' ')[0] : '';
    b.push(`<button class="btn" onclick='calificarCruzado("${id}","${r}",${JSON.stringify(p.negocio.nombre).replace(/'/g, '&#39;')},${JSON.stringify(p.comprador.nombre).replace(/'/g, '&#39;')},${JSON.stringify(nomRep).replace(/'/g, '&#39;')})'>⭐ Calificar</button>`);
  }
  if (p.puedeReabrir) b.push(`<button class="btn" onclick="act(this,()=>reabrir('${id}'))">↩️ Aún no se entrega</button>`);
  if (r !== 'comprador') b.push(`<button class="btn" onclick="abrirChat('${id}')">${ico('chat', 's')} Chat</button>`);
  return b.length ? `<div class="btns">${b.join('')}</div>` : '';
}

async function accion(nombre, datos, msg) {
  await api(nombre, datos);
  if (msg) toast(msg);
  await pintar(true);
}
async function cancelar(id, palabra) {
  const motivo = prompt((palabra || 'Cancelar') + ' pedido. Escribe el motivo:');
  if (motivo === null) return;
  await accion('cancelarPedido', { id, motivo: motivo || 'Sin motivo' }, 'Pedido cancelado');
}
async function confirmarPago(id) {
  if (!confirm('¿Confirmas que el dinero YA está en tu cuenta? Revisa tu app del banco antes de confirmar.')) return;
  await accion('confirmarPago', { id }, 'Pago confirmado, ¡a preparar!');
}
async function noRecibido(id) {
  const m = prompt('¿Qué le decimos al cliente? (ej. "No se refleja aún", "El monto no coincide")');
  if (m === null) return;
  await accion('pagoNoRecibido', { id, motivo: m }, 'Se avisó al cliente');
}
async function entregarRep(id, cobro, nombre, pagaEnvio) {
  if (!confirm('¿Entregas el pedido a ' + nombre + '?' + (cobro ? '\nCóbrale ' + money(cobro) + ' de la comida (pago en efectivo).' : '') + (pagaEnvio ? '\nPágale ' + money(pagaEnvio) + ' en efectivo por el envío (el cliente te lo pagó en su transferencia).' : ''))) return;
  await accion('entregarRepartidor', { id }, '¡Pedido en camino! 🛵');
}
/** Ficha para el repartidor del negocio: solo el primer nombre de quien recibe (privacidad). */
function fichaReparto(p) {
  const rec = p.recibe || { nombre: p.comprador.nombre, telefono: p.comprador.telefono };
  const nom = String(rec.nombre || '').trim().split(/\s+/)[0] || 'Cliente';
  const tel = String(rec.telefono || p.comprador.telefono || '');
  const cobro = p.metodoPago === 'efectivo' ? `${money(p.total)} en efectivo (pedido ${money(p.subtotal)}${p.envio ? ' + envío ' + money(p.envio) : ''})`
    : p.envio ? `${money(p.envio)} del envío (la comida ya está pagada)` : 'Nada, ya está pagado';
  return [`🛵 *Entrega ${p.folio}* · ${p.negocio.nombre}`, '',
    `👤 Recibe: ${nom}`, tel ? `📞 Tel: ${tel}` : '',
    `📍 ${p.direccion}${p.referencia ? '\n🏠 Ref: ' + p.referencia : ''}`,
    p.lat ? `🗺️ Ubicación: https://maps.google.com/?q=${p.lat},${p.lng}` : '',
    `💵 Cobrar: ${cobro}`, p.notas ? `📝 Nota: ${p.notas}` : '',
    `📦 ${p.items.reduce((s, i) => s + i.cant, 0)} producto(s)`].filter(Boolean).join('\n');
}

/* ============ CHAT ============ */
async function abrirChat(pid) {
  S.chat = pid;
  modal(`<div class="chat">
    <div class="row between"><b>Mensajes del pedido</b><button class="btn sm" onclick="cerrarModal()">Cerrar</button></div>
    <div id="msgs" class="msgs"><div class="cargando">Cargando…</div></div>
    <div class="chatIn">
      <label class="redondo verde">📷<input type="file" accept="image/*" hidden onchange="chatImagen(this)"></label>
      <input class="i" id="chatTxt" placeholder="Escribe un mensaje…" onkeydown="if(event.key==='Enter')chatEnviar()">
      <button class="btn pri" onclick="chatEnviar()">➤</button>
    </div></div>`);
  // con el chat abierto se revisa cada 8 s (solo mientras está abierto; los avisos push lo actualizan al momento)
  clearInterval(S._chatT);
  S._chatT = setInterval(() => { if (!document.hidden) cargarChat(); }, 8000);
  await cargarChat();
}
async function cargarChat() {
  if (!S.chat) return;
  const pid = S.chat;
  try {
    const l = await api('mensajes', { pedidoId: pid });
    const box = $('#msgs'); if (!box || S.chat !== pid) return;
    const abajo = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.innerHTML = l.length ? l.map(m => `<div class="msg ${m.mio ? 'mio' : ''} ${m.rol === 'sistema' ? 'sis' : ''}">
      ${m.rol === 'sistema' ? '' : `<small>${esc(m.nombre)} · ${esc(rolNombre(m.rol))} · ${hora(m.fecha)}</small>`}
      ${m.texto ? `<div>${esc(m.texto)}</div>` : ''}
      ${m.imagenId ? `<button class="lnk" onclick="act(this,()=>verImagen('${pid}','${m.imagenId}'))">${/comprobante/i.test(m.texto || '') ? '🧾 Ver comprobante' : '🖼️ Ver imagen'}</button>` : ''}
    </div>`).join('') : '<div class="vacio">Aún no hay mensajes</div>';
    if (abajo || !box._ya) { box.scrollTop = box.scrollHeight; box._ya = true; }
  } catch (e) { }
}
async function chatEnviar() {
  const i = $('#chatTxt'); const t = i.value.trim(); if (!t) return;
  i.value = '';
  try { await api('enviarMensaje', { pedidoId: S.chat, texto: t }); await cargarChat(); }
  catch (e) { toast(e.message, 'err'); i.value = t; }
}
async function chatImagen(inp) {
  const f = inp.files[0]; if (!f) return;
  toast('Enviando imagen…');
  try { const img = await comprimir(f); await api('enviarMensaje', { pedidoId: S.chat, imagen: img }); await cargarChat(); }
  catch (e) { toast(e.message, 'err'); }
}

/* ============ CLIENTE: CATÁLOGO, PREFERENCIAS Y PRECARGA ============ */
/** Productos en carrito: de un negocio, o de todos si no se indica. */
function itemsCarrito(negId) {
  if (negId) return Object.values(((S.carritos || {})[negId] || {}).items || {});
  return carritosLista().reduce((a, c) => a.concat(Object.values(c.items)), []);
}

function guardarCatalogo(c) {
  S._negs = c.negocios || []; S.promos = c.promos || []; S._catT = Date.now();
  ls('negs', S._negs); ls('promos', S.promos);
  if (S.vista === 'inicio' && $('#listaNeg')) pintarInicioDatos();
}
/** Pide el catálogo (negocios + promos) sin duplicar llamadas si ya hay una en curso. */
function cargarCatalogo() {
  if (S._catProm) return S._catProm;
  const p = api('catalogo').then(guardarCatalogo);
  S._catProm = p;
  p.catch(() => { }).finally(() => { if (S._catProm === p) S._catProm = null; });
  return p;
}

// preferencias del cliente en este teléfono: +1 al abrir un negocio, +3 al pedirle
function prefs() { return ls('pref') || {}; }
function sumarPref(id, k) { const p = prefs(); p[id] = Math.min(200, (p[id] || 0) + k); ls('pref', p); }
function puntaje(n) { const p = prefs(); return (p[n.id] || 0) * 3 + (n.pop || 0) + (n.calif || 0) * 0.3 + (n.abierto ? 2 : 0); }
function prefCategorias() {
  const p = prefs(), c = {};
  (S._negs || []).forEach(n => { if (p[n.id]) c[n.categoria] = (c[n.categoria] || 0) + p[n.id]; });
  return c;
}

/**
 * Precarga en segundo plano los menús (y primeras fotos) de los negocios que este cliente
 * probablemente abrirá: primero los que más pide, luego los más pedidos en general.
 * Una sola llamada para todos; los que ya están guardados y no cambiaron no se vuelven a pedir.
 */
async function precargar() {
  if (!S._negs || !esCliente() || S._precargando) return;
  if (navigator.connection && navigator.connection.saveData) return; // modo "ahorro de datos"
  S._precargando = true;
  try {
    const top = S._negs.filter(n => n.abierto).sort((a, b) => puntaje(b) - puntaje(a)).slice(0, 6);
    const loc = menusLocales();
    const faltan = top.filter(n => !loc[n.id] || loc[n.id].ver !== n.menuVer).map(n => n.id);
    if (faltan.length) (await api('menus', { ids: faltan })).forEach(aplicarMenuFresco);
    top.slice(0, 3).forEach(n => {
      precargarImg(n.portada); precargarImg(n.logo);
      const m = menuLocal(n.id);
      if (m) m.productos.filter(p => p.foto).slice(0, 6).forEach(p => precargarImg(p.foto));
    });
    (S.promos || []).slice(0, 4).forEach(p => precargarImg(p.imagen));
  } catch (e) { } finally { S._precargando = false; }
}

/** Menú recién traído del servidor: se guarda y sus promociones reemplazan a las guardadas de ese negocio. */
function aplicarMenuFresco(m) {
  if (!m || !m.negocio) return;
  guardarMenu(m);
  if (Array.isArray(m.promos)) {
    S.promos = (S.promos || []).filter(p => p.negocioId !== m.negocio.id).concat(m.promos);
    ls('promos', S.promos);
  }
}

/* ---------- precios con promoción ---------- */
function promosDe(negId) { return (S.promos || []).filter(p => p.negocioId === negId); }
const mecDe = p => (p.tipo || 'promocion') === 'promocion' ? (p.mecanica || 'precio') : '';
/** Promos con 2x1, %, $, regalo o primera compra de un negocio (las que calcula descuentosPromo). */
function mecsDe(negId) { return promosDe(negId).filter(p => mecDe(p) && mecDe(p) !== 'precio'); }
/** ¿La promo incluye este producto (o todo el menú)? */
const enPromo = (p, prodId, lista) => (lista || p.aplica || []).some(x => x.productoId === '*' || x.productoId === prodId);
function promoProducto(negId, prodId, variante) {
  for (const p of promosDe(negId).filter(x => mecDe(x) === 'precio' || !mecDe(x))) {
    const x = (p.productos || []).find(y => y.productoId === prodId && (y.variante || '') === (variante || '') && y.precioPromo > 0);
    if (x) return { id: p.id, precioPromo: x.precioPromo, titulo: p.titulo, vigencia: p.vigencia };
  }
  return null;
}
/** Precio de un producto (o de su variante) con la promoción vigente, si hay. */
/** Grupos de opciones de un producto: los suyos ("p:0"…) y los de su sección (mismas reglas que el servidor). */
function gruposDe(p, grupos) {
  const m = x => String(x || '').toLowerCase().trim(), cat = m(p.categoria || 'General'), sub = m(p.subcategoria);
  const sec = (grupos || []).filter(g => !(g.excluir || []).includes(p.id) && ((g.productos || []).includes(p.id) || (g.categorias || []).some(c => {
    const k = m(c).split('>').map(x => x.trim());
    return k.length > 1 ? k[0] === cat && k[1] === sub : k[0] === cat;
  })));
  return (p.opciones || []).map((g, i) => Object.assign({ id: 'p:' + i }, g)).concat(sec);
}
function precioBase(negId, p, variante) {
  let base = Number(p.precio) || 0;
  if (variante) { const v = (p.variantes || []).find(x => x.nombre === variante); if (v) base = Number(v.precio) || 0; }
  const pr = promoProducto(negId, p.id, variante || '');
  return pr && pr.precioPromo < base ? { precio: pr.precioPromo, antes: base, promo: pr.id } : { precio: base, antes: 0, promo: '' };
}
function tienePromo(negId, p) { return !!etiquetaProducto(negId, p.id); }
/** Etiqueta de la tarjeta del producto: 2x1, -15%, -$21, 🎁, PROMO… */
function etiquetaProducto(negId, prodId) {
  const l = promosDe(negId).filter(x => mecDe(x));
  const m = l.find(x => mecDe(x) !== 'precio' && mecDe(x) !== 'primera' && enPromo(x, prodId));
  if (m) return mecDe(m) === 'regalo' ? '🎁 Con regalo' : m.etiqueta || etiquetaPromo(m);
  const r = l.find(x => mecDe(x) === 'regalo' && (x.regalos || []).some(y => y.productoId === prodId));
  if (r) return '🎁 Gratis';
  return l.some(x => mecDe(x) === 'precio' && (x.productos || []).some(y => y.productoId === prodId)) ? 'PROMO' : '';
}
/** Productos que están en la promoción del día de un negocio (con o sin precio especial). */
function idsPromo(negId, tipo) {
  const s = new Set();
  promosDe(negId).filter(p => (p.tipo || 'promocion') === (tipo || 'promocion') && mecDe(p) !== 'primera').forEach(p => {
    (p.productos || []).forEach(x => s.add(x.productoId));
    (p.regalos || []).forEach(x => s.add(x.productoId));
  });
  return s;
}

/**
 * Descuentos de las promociones de un pedido (mismo cálculo en la app y en el servidor).
 * lineas: [{i, id, variante, base, bruto, cant, especial}]  base = precio normal del producto/variante (sin extras);
 *   bruto = precio de la línea por pieza (con extras); especial = la línea ya tiene precio especial (no entra a otras promos).
 * promos: [{id, titulo, mecanica, valor, lleva, paga, tope, aplica:[{productoId, variante}], regalos:[{productoId, variante}]}]
 * primera: true si es la primera compra del cliente en ese negocio.
 * Reglas: lo gratis o descontado es solo el precio del producto y su variante (extras y opciones se cobran);
 * cada pieza recibe la mejor promo para el cliente; el % de primera compra se suma sobre lo que queda.
 */
function descuentosPromo(lineas, promos, primera) {
  var r2 = function (x) { return Math.round(x * 100) / 100; };
  var entra = function (l, u) {
    return (l || []).some(function (x) {
      if (x.productoId === '*') return true;
      return x.productoId === u.id && (x.variante === '*' || String(x.variante || '') === u.variante);
    });
  };
  var uds = [];
  (lineas || []).forEach(function (l) {
    if (l.especial) return;
    for (var k = 0; k < l.cant; k++) uds.push({ i: l.i, id: l.id, variante: String(l.variante || ''), base: Number(l.base) || 0, usada: false });
  });
  var lista = (promos || []).filter(function (p) { return ['nxm', 'pct', 'monto', 'regalo'].indexOf(p.mecanica) >= 0; });
  var porPieza = lista.filter(function (p) { return p.mecanica === 'pct' || p.mecanica === 'monto'; });
  var grupales = lista.filter(function (p) { return p.mecanica === 'nxm' || p.mecanica === 'regalo'; });
  var valorPieza = function (p, u) {
    if (!entra(p.aplica, u)) return 0;
    return p.mecanica === 'pct' ? r2(u.base * Math.min(100, Number(p.valor) || 0) / 100) : Math.min(Number(p.valor) || 0, u.base);
  };
  var mejorPieza = function (u) {
    var m = 0;
    porPieza.forEach(function (p) { m = Math.max(m, valorPieza(p, u)); });
    return m;
  };
  // 2x1, 3x2 y regalos: se elige primero la que más le ahorra al cliente frente a su mejor descuento por pieza
  var plan = function (p) {
    var libres = uds.filter(function (u) { return !u.usada; });
    var el = libres.filter(function (u) { return entra(p.aplica, u); });
    var usa = [], gratis = [];
    if (p.mecanica === 'nxm') {
      var L = Number(p.lleva) || 2, P = Number(p.paga) || 1;
      var s = el.slice().sort(function (a, b) { return b.base - a.base; });
      for (var g = 0; g + L <= s.length; g += L) {
        var grupo = s.slice(g, g + L);
        usa = usa.concat(grupo);
        gratis = gratis.concat(grupo.slice(P)); // se cobran las de mayor precio
      }
    } else {
      var Lr = Math.max(1, Number(p.lleva) || 1);
      var reg = libres.filter(function (u) { return entra(p.regalos, u); }).sort(function (a, b) { return b.base - a.base; });
      for (var n = reg.length; n > 0; n--) {
        var dar = reg.slice(0, n);
        var compras = el.filter(function (u) { return dar.indexOf(u) < 0; }).sort(function (a, b) { return a.base - b.base; });
        if (compras.length >= n * Lr) { usa = dar.concat(compras.slice(0, n * Lr)); gratis = dar; break; }
      }
    }
    var total = r2(gratis.reduce(function (t, u) { return t + u.base; }, 0));
    var pierde = r2(usa.reduce(function (t, u) { return t + mejorPieza(u); }, 0));
    return { usa: usa, gratis: gratis, total: total, gana: r2(total - pierde) };
  };
  // corre un orden de promos de grupo y luego los descuentos por pieza
  var correr = function (ordenG) {
    uds.forEach(function (u) { u.usada = false; });
    var res = {}, orden = [], porLinea = {};
    var anotar = function (p, u, m) {
      if (!(m > 0)) return;
      if (!res[p.id]) { res[p.id] = { id: p.id, titulo: p.titulo, mecanica: p.mecanica, etiqueta: etiquetaPromo(p), monto: 0 }; orden.push(p.id); }
      res[p.id].monto = r2(res[p.id].monto + m);
      porLinea[u.i] = r2((porLinea[u.i] || 0) + m);
    };
    ordenG.forEach(function (p) {
      var x = plan(p);
      if (!(x.total > 0 && x.gana > 0)) return;
      x.usa.forEach(function (u) { u.usada = true; });
      x.gratis.forEach(function (u) { anotar(p, u, u.base); });
    });
    // % y $ por pieza: a cada pieza libre, la mejor
    uds.forEach(function (u) {
      if (u.usada) return;
      var best = null, m = 0;
      porPieza.forEach(function (p) { var v = valorPieza(p, u); if (v > m) { m = v; best = p; } });
      if (best) { u.usada = true; anotar(best, u, m); }
    });
    return { res: res, orden: orden, porLinea: porLinea, total: r2(orden.reduce(function (t, id) { return t + res[id].monto; }, 0)) };
  };
  // se prueban los órdenes posibles de 2x1/regalos (son pocos) y se queda el que más ahorra al cliente
  var ordenes = [];
  var permutar = function (hechos, resto) {
    if (!resto.length) { ordenes.push(hechos); return; }
    resto.forEach(function (p, k) { permutar(hechos.concat([p]), resto.slice(0, k).concat(resto.slice(k + 1))); });
  };
  if (grupales.length <= 5) permutar([], grupales);
  else ordenes.push(grupales.slice().sort(function (a, b) { return plan(b).gana - plan(a).gana; }));
  var mejorR = null;
  ordenes.forEach(function (o) { var x = correr(o); if (!mejorR || x.total > mejorR.total + 0.001) mejorR = x; });
  var res = mejorR.res, orden = mejorR.orden, porLinea = mejorR.porLinea;
  var total = r2(orden.reduce(function (t, id) { return t + res[id].monto; }, 0));
  // primera compra en el negocio: % sobre lo que queda del pedido (con extras), con tope opcional
  var pp = (promos || []).filter(function (p) { return p.mecanica === 'primera'; }).sort(function (a, b) { return (Number(b.valor) || 0) - (Number(a.valor) || 0); })[0];
  var primeraM = 0;
  if (pp && primera) {
    var bruto = (lineas || []).reduce(function (t, l) { return t + (Number(l.bruto) || 0) * l.cant; }, 0);
    primeraM = r2(Math.max(0, bruto - total) * Math.min(100, Number(pp.valor) || 0) / 100);
    if (Number(pp.tope) > 0) primeraM = Math.min(primeraM, Number(pp.tope));
    if (primeraM > 0) { res[pp.id] = { id: pp.id, titulo: pp.titulo, mecanica: 'primera', etiqueta: etiquetaPromo(pp), monto: primeraM }; orden.push(pp.id); total = r2(total + primeraM); }
  }
  return { total: total, promos: orden.map(function (id) { return res[id]; }), porLinea: porLinea, primera: primeraM, hayPrimera: !!pp };
}

/** Texto corto de la mecánica: 2x1, 3x2, -15%, -$21, Regalo, -10% 1ª compra. */
function etiquetaPromo(p) {
  var v = Number(p.valor) || 0;
  switch (p.mecanica) {
    case 'nxm': return (Number(p.lleva) || 2) + 'x' + (Number(p.paga) || 1);
    case 'pct': return '-' + v + '%';
    case 'monto': return '-$' + v;
    case 'regalo': return '🎁 Regalo';
    case 'primera': return '-' + v + '% 1ª compra';
    default: return 'PROMO';
  }
}

/** Descuentos de un carrito con las promos guardadas del negocio. */
function descCarrito(c) {
  const its = Object.values(c.items || {});
  const lineas = its.map((x, i) => ({ i, id: x.id, variante: x.variante || '', base: x.base || x.antes || x.precio, bruto: x.precio, cant: x.cant, especial: !!x.promo }));
  const ps = mecsDe(c.negocioId);
  const r = descuentosPromo(lineas, ps, (S._primera || {})[c.negocioId] === true);
  r.its = its;
  r.bruto = subtotalCarrito(c);
  r.neto = Math.round((r.bruto - r.total) * 100) / 100;
  // primera compra aún sin confirmar (invitado o sin respuesta del servidor)
  const pp = ps.find(p => mecDe(p) === 'primera');
  r.primeraNota = pp && (S._primera || {})[c.negocioId] === undefined ? pp : null;
  r.regalos = regalosPendientes(lineas, ps);
  return r;
}
/**
 * Regalos que el cliente ya ganó pero aún no agrega al carrito: [{promo, faltan}].
 * Se simula agregar el regalo y se ve si de verdad saldría gratis (con las demás promos que ya usa).
 */
function regalosPendientes(lineas, promos) {
  const base = descuentosPromo(lineas, promos, false).total;
  return promos.filter(p => mecDe(p) === 'regalo' && (p.regalos || []).some(x => x.disponible !== false)).map(p => {
    const r = p.regalos.find(x => x.disponible !== false);
    let faltan = 0;
    for (let k = 1; k <= 5; k++) {
      const extra = { i: lineas.length, id: r.productoId, variante: r.variante === '*' ? '*' : r.variante || '', base: r.precioAntes, bruto: r.precioAntes, cant: k };
      const x = descuentosPromo(lineas.concat([extra]), promos, false);
      if (x.total - base >= k * r.precioAntes - 0.01) faltan = k; else break;
    }
    return { promo: p, faltan };
  }).filter(x => x.faltan > 0);
}
/** "Agrega tu regalo": abre el producto de regalo (si hay varios, el cliente elige). */
function agregarRegalo(negId, promoId) {
  const p = promosDe(negId).find(x => x.id === promoId); if (!p) return;
  const l = (p.regalos || []).filter(x => x.disponible !== false);
  const abrir = x => { cerrarModal(); S._abrirProd = x.productoId; S._abrirVar = x.variante === '*' ? '' : x.variante; ir('negocio', negId); };
  if (l.length === 1) { abrir(l[0]); return; }
  S._regalosOp = l.map(x => () => abrir(x));
  modal(`<div class="row between"><h2 style="margin:0">🎁 Elige tu regalo</h2><button class="redondo" onclick="cerrarModal()" aria-label="Cerrar">✕</button></div>
    <div class="muted small" style="margin:6px 0 10px">${esc(p.titulo)} · el producto va gratis; los extras se cobran.</div>
    ${l.map((x, i) => `<div class="opcion" onclick="S._regalosOp[${i}]()"><span class="ico">🎁</span><div class="grow"><b>${esc(x.nombre)}${x.variante && x.variante !== '*' ? ' · ' + esc(x.variante) : ''}</b><small>Normal ${money(x.precioAntes)} · gratis</small></div></div>`).join('')}`);
}
/** En cuáles negocios del carrito es la primera compra del cliente (para el % de bienvenida). */
async function cargarPrimera(ids) {
  if (!S.token || !S.user || rolActual() !== 'comprador') return;
  S._primera = S._primera || {};
  const faltan = ids.filter(id => S._primera[id] === undefined && mecsDe(id).some(p => mecDe(p) === 'primera'));
  if (!faltan.length) return;
  try { Object.assign(S._primera, await api('primeraCompra', { ids: faltan })); } catch (e) { }
}
/** Renglones de descuento de un carrito (y aviso de primera compra / regalo). */
function lineasDesc(c, r) {
  return r.promos.map(x => `<div class="tot" style="color:var(--ok,#1a7f4b)"><span>🏷️ ${esc(x.etiqueta)} · ${esc(x.titulo)}</span><span>−${money(x.monto)}</span></div>`).join('')
    + (r.primeraNota ? `<div class="muted small" style="margin:2px 0">🎉 ${esc(r.primeraNota.etiqueta || etiquetaPromo(r.primeraNota))}: si es tu primera compra en ${esc(c.negocio)} se descuenta al confirmar.</div>` : '');
}
const SEC_PROMO = '🏷️ Promo del día', SEC_NOVEDAD = '📣 Novedades';
const esPromo = p => (p.tipo || 'promocion') === 'promocion';
function seccionesMenu(d) {
  const secs = [...new Set(d.productos.map(p => p.categoria))];
  const base = secs.length > 1 ? ['Todo', ...secs] : secs;
  const ids = idsPromo(d.negocio.id), nov = idsPromo(d.negocio.id, 'anuncio');
  const extra = [];
  if (d.productos.some(p => ids.has(p.id))) extra.push(SEC_PROMO);
  if (d.productos.some(p => nov.has(p.id))) extra.push(SEC_NOVEDAD);
  return [...extra, ...base];
}
function precioTxt(p, negId) {
  negId = negId || p.negocioId || (S._menu && S._menu.negocio.id);
  const vars = p.variantes || [];
  if (vars.length > 1) {
    const ps = vars.map(v => precioBase(negId, p, v.nombre));
    const min = ps.reduce((a, b) => (b.precio < a.precio ? b : a));
    return `Desde ${min.antes ? `<span class="precioPromo">${money(min.precio)}</span>` : money(min.precio)}`;
  }
  const b = precioBase(negId, p, vars.length === 1 ? vars[0].nombre : '');
  return b.antes ? `<span class="tachado">${money(b.antes)}</span><span class="precioPromo">${money(b.precio)}</span>` : money(b.precio);
}

/** Ajusta los precios del carrito con el menú y promos más recientes. Devuelve true si algo cambió. */
function repreciarCarrito(menuD) {
  const c = menuD && menuD.negocio ? (S.carritos || {})[menuD.negocio.id] : null;
  if (!c) return false;
  const prods = {};
  menuD.productos.forEach(p => prods[p.id] = p);
  let cambio = false;
  Object.values(c.items).forEach(it => {
    const p = prods[it.id];
    if (!p) { delete c.items[it.key]; cambio = true; return; } // ya no está disponible
    const b = precioBase(c.negocioId, p, it.variante);
    const ex = (it.extras || []).map(e => (p.extras || []).find(x => x.nombre === e.nombre)).filter(Boolean);
    const gs = gruposDe(p, menuD.grupos);
    const mods = (it.mods || []).map(m => { const g = gs.find(x => x.id === m.g); return g ? Object.assign({}, m, { o: m.o.map(o => g.opciones.find(x => x.nombre === o.nombre)).filter(Boolean) }) : null; }).filter(m => m && m.o.length);
    if (JSON.stringify(mods) !== JSON.stringify(it.mods || [])) { it.mods = mods; cambio = true; }
    const extra = ex.reduce((s, e) => s + (Number(e.precio) || 0), 0) + mods.reduce((s, m) => s + m.o.reduce((a, o) => a + (Number(o.precio) || 0), 0), 0);
    const unit = b.precio + extra;
    if (unit !== it.precio || ex.length !== (it.extras || []).length) { it.precio = unit; it.extras = ex; cambio = true; }
    it.promo = b.promo; it.antes = b.antes ? b.antes + extra : 0; it.base = b.antes || b.precio;
  });
  guardarCarritos();
  return cambio;
}

/** Rango de tiempo estimado: preparación + traslado. */
function rangoTiempo(n) {
  let viaje = 10;
  const u = S.user;
  if (u && u.lat && n.lat && S.conf) viaje = Math.round(kmRuta(n.lat, n.lng, u.lat, u.lng) / S.conf.velocidadKmh * 60 + 3);
  const a = Math.round((n.tiempoPrep + viaje) / 5) * 5;
  return a + '–' + (a + 15) + ' min';
}
function distanciaTxt(n) {
  const u = S.user;
  return u && u.lat && n.lat ? kmRuta(n.lat, n.lng, u.lat, u.lng).toFixed(1) + ' km' : '';
}
