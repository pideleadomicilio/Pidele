      <div class="kpi"><b>${d.totales.foraneos || 0}</b><span>📍 Foráneos entregados</span></div>
      <div class="kpi"><b>${d.totales.servicios || 0}</b><span>🛵 Servicios de repartidores</span></div></div>
    <div class="card"><div class="row between wrap" style="gap:6px"><b>${met === 'ventas' ? 'Ventas' : 'Pedidos entregados'}</b>
      <div class="tabs" style="margin:0">${tab('pedidos', 'Pedidos', 'met')}${tab('ventas', 'Ventas', 'met')}</div></div>
      <div class="tabs" style="margin:8px 0">${tab('dia', '30 días', 'per')}${tab('semana', '12 semanas', 'per')}${tab('mes', '12 meses', 'per')}</div>
      ${barrasSVG(serie.map(x => x[met]), ets, fmtMet, 'estC1')}</div>
    <div class="card"><b>¿A qué hora piden?</b><div class="muted small">Pedidos por hora del día (desde el inicio)</div>
      ${barrasSVG(hrs.map(h => h[1]), hrs.map(h => h[0] + ':00'), v => v + ' pedidos', 'estC2', 3)}</div>
    <div class="card"><b>¿Qué día piden más?</b>
      ${barrasSVG(orden.map(i => d.porDiaSemana[i]), orden.map(i => DS[i]), v => v + ' pedidos', 'estC3', 1)}</div>
    <h3>🏆 Más vendidos (últimos 30 días)</h3>
    ${d.tops.map(t => `<div class="card">${d.tops.length > 1 ? `<b>📍 ${esc(t.pueblo)}</b>` : ''}${t.top.length ? t.top.map(x => `<div class="tot"><span><b>${x.pos}.</b> ${esc(x.nombre)}</span>${x.pos <= 3 ? ['🥇', '🥈', '🥉'][x.pos - 1] : ''}</div>`).join('') : '<div class="vacio">Aún no hay ventas</div>'}</div>`).join('')}
    <div class="muted small" style="margin:4px 2px">El top va solo por posición, sin montos. Las ventas son la suma de los productos (sin envío) de los pedidos entregados.</div>
    <div class="btns"><button class="btn" onclick="copiarResumenEst()">📋 Copiar resumen sin nombres</button></div>
    <div style="height:20px"></div>`);
}
/** Texto para compartir (ej. con negocios interesados): solo totales del municipio, sin nombres ni montos por negocio. */
function copiarResumenEst() {
  const d = S._est; if (!d) return;
  copiar(`Pídele ${d.pueblo || PUEBLO.nombre}\nÚltimos 30 días: ${d.mes.pedidos} pedidos entregados, ${money(d.mes.ventas)} en ventas.\nÚltimos 7 días: ${d.semana.pedidos} pedidos.\nDesde el inicio: ${d.totales.pedidos} pedidos y ${d.totales.domicilio} envíos a domicilio.\n${d.totales.negocios} negocios activos.`, 'Resumen');
}

async function guardarConfig() {
  const valores = {};
  document.querySelectorAll('.cfg').forEach(i => valores[i.dataset.k] = i.value);
  if (document.querySelector('.plCfg')) valores.planes = JSON.stringify(planesDelEditor());
  await api('adminGuardarConfig', { valores });
  S.conf = await api('configPublica'); ls('conf', S.conf);
  if (S._cfgOrig) { Object.assign(S._cfgOrig, valores); S._planesCfg = S.conf.planes || S._planesCfg; setTimeout(cfgCambio, 60); } // después de que el botón termine de cargar
  toast('Ajustes guardados ✓');
}


/* ============ RECORRIDO GUIADO (primera vez de cada tipo de cuenta) ============ */
/*
 * Cada paso: { sel, titulo, texto, ir?, si? }. Ilumina el elemento "sel" (si no está, el globo va al centro),
 * con una flecha que lo señala. Los pasos con "si" que dé falso se saltan (ej. ya instaló o ya verificó).
 * Se muestra una sola vez por tipo de cuenta en este teléfono; se repite desde Perfil → "Ver guía otra vez".
 */
const tourVisto = k => !!lsG('tour_' + k);
function tourKey() { const r = rolActual(); return r === 'invitado' ? 'invitado' : r === 'comprador' ? 'cliente' : r; }
async function iniciarTour(k, forzar) {
  k = k || tourKey();
  if (navigator.webdriver && !lsG('tourTest')) return; // pruebas automáticas
  if (!TOURS[k] || (!forzar && tourVisto(k)) || $('#tour') || $('#bloqueoUbic')) return;
  if ($('#modal').classList.contains('on')) return;
  const pasos = TOURS[k]().filter(p => !p.si || p.si());
  if (!pasos.length) return;
  S._tour = { k, pasos, i: 0 };
  const d = document.createElement('div'); d.id = 'tour';
  d.innerHTML = '<div class="hueco"></div><div class="flecha"></div><div class="globo"></div>';
  document.body.appendChild(d);
  await pasoTour(0);
}
async function pasoTour(i) {
  const t = S._tour; if (!t) return;
  if (i >= t.pasos.length) { cerrarTour(); return; }
  t.i = i;
  const p = t.pasos[i], d = $('#tour'); if (!d) return;
  if (p.ir && S.vista !== p.ir) { await ir(p.ir); await new Promise(r => setTimeout(r, 700)); }
  const el = p.sel ? document.querySelector(p.sel) : null;
  if (el && el.scrollIntoView) { el.scrollIntoView({ block: 'center' }); await new Promise(r => setTimeout(r, 250)); }
  const g = d.querySelector('.globo'), h = d.querySelector('.hueco'), f = d.querySelector('.flecha');
  const ult = i === t.pasos.length - 1;
  g.innerHTML = `<h3>${p.titulo}</h3><p>${typeof p.texto === 'function' ? p.texto() : p.texto}</p>
    <div class="pie"><button class="lnk small" onclick="cerrarTour()">${ult ? '' : 'Saltar guía'}</button>
      <div class="puntos">${t.pasos.map((x, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="row" style="gap:6px">${i ? `<button class="btn sm" onclick="pasoTour(${i - 1})">Atrás</button>` : ''}<button class="btn sm pri" onclick="pasoTour(${i + 1})">${ult ? '¡Listo!' : 'Siguiente'}</button></div></div>`;
  const vh = window.innerHeight;
  if (el) {
    const r = el.getBoundingClientRect(), pad = 6;
    Object.assign(h.style, { display: '', left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px' });
    const abajo = r.top + r.height / 2 < vh / 2;
    const gh = g.offsetHeight;
    const top = abajo ? Math.min(r.bottom + 18, vh - gh - 12) : Math.max(12, r.top - gh - 18);
    g.style.top = top + 'px';
    const fx = Math.max(28, Math.min(window.innerWidth - 46, r.left + r.width / 2 - 9));
    Object.assign(f.style, { display: '', left: fx + 'px', top: (abajo ? top - 8 : top + gh - 10) + 'px' });
  } else {
    h.style.display = 'none'; f.style.display = 'none';
    Object.assign(h.style, { left: '50%', top: '50%', width: '0px', height: '0px' });
    g.style.top = Math.max(12, (vh - g.offsetHeight) / 2) + 'px';
  }
}
function cerrarTour() {
  const t = S._tour; if (t) lsG('tour_' + t.k, '1');
  S._tour = null; const d = $('#tour'); if (d) d.remove();
  if (t && t.vuelta && S.vista !== t.vuelta) ir(t.vuelta);
}
/** Perfil → "Ver guía otra vez". */
function repetirTour() { const k = tourKey(); lsG('tour_' + k, null); iniciarTour(k, true); }
const navBtn = n => '#nav button:nth-child(' + n + ')';
const pruebaTxt = () => {
  const u = S.user || {}, sus = u.rol === 'repartidor' ? u.suscripcion : (S.negocio || {}).suscripcion;
  return textoPrueba(sus && sus.vence, true) || 'Aquí ves tu fecha de pago y cómo pagar tu mensualidad.';
};
const TOURS = {
  invitado: () => [
    { titulo: '👋 ¡Bienvenido a Pídele!', texto: `Te mostramos los negocios de <b>${esc(PUEBLO.nombre)}</b>, donde estás. Te enseñamos lo básico en unos pasos.` },
    { sel: '#tarjInst', titulo: '📲 Instala la app', texto: 'Tenla en tu pantalla de inicio: abre más rápido y te llegan los avisos de tu pedido.', si: () => !instalada() && !!$('#tarjInst') },
    { sel: '#promoBanner', titulo: '🏷️ Promociones del día', texto: '2x1, descuentos y regalos de los negocios. Toca una para verla.', si: () => !!$('#promoBanner .slide') },
    { sel: '#catFila', titulo: '🍔 Elige lo que se te antoje', texto: 'Busca por categoría, o con el buscador de arriba.' },
    { sel: navBtn(3), titulo: '👤 Crea tu cuenta', texto: 'Para pedir, toca <b>Entrar</b> y crea tu cuenta. Solo necesitas tu nombre y tu teléfono.' }
  ],
  cliente: () => [
    { titulo: '🎉 ¡Ya tienes tu cuenta!', texto: 'Te mostramos cómo pedir en unos pasos.' },
    { ir: 'perfil', sel: '#tarjVerif', titulo: '✅ Verifica tu número', texto: 'Toca aquí y envía el mensaje por WhatsApp. Así puedes pagar en efectivo.', si: () => S.user && !S.user.telVerificado },
    { ir: 'inicio', sel: '#promoBanner', titulo: '🏷️ Pon atención aquí', texto: 'Aquí salen las promociones del día. ¡No te las pierdas!', si: () => !tourVisto('invitado') },
    { ir: 'inicio', sel: '#listaNeg', titulo: '😋 Elige un negocio', texto: 'Entra a su menú, toca lo que quieras y agrégalo. Abajo aparece tu carrito con el total; toca <b>Ver pedido</b> para continuar.' },
    { ir: 'inicio', sel: navBtn(3), titulo: '🧾 Sigue tu pedido', texto: 'En <b>Pedidos</b> ves si el negocio ya lo aceptó y por dónde va el repartidor en el mapa.' },
    { ir: 'inicio', sel: navBtn(4), titulo: '⚙️ Tu perfil', texto: 'Tu dirección, tu teléfono y esta guía, por si la quieres ver otra vez.' }
  ],
  negocio: () => [
    { titulo: '🏪 ¡Bienvenido a Pídele!', texto: 'Te mostramos cómo dejar listo tu negocio para recibir pedidos.' },
    { sel: navBtn(4), titulo: '1 · Completa tu negocio', texto: 'En <b>Negocio</b>: ubicación en el mapa, horario, logo, portada y formas de pago.' },
    { sel: navBtn(2), titulo: '2 · Sube tu menú', texto: 'En <b>Menú</b> agrega tus productos uno por uno, o todos de una vez con la plantilla de Excel.' },
    { sel: navBtn(3), titulo: '3 · Crea una promoción', texto: 'En <b>Banners</b>: un 2x1, un descuento o un regalo para salir en el inicio de la app.' },
    { sel: navBtn(1), titulo: '4 · Recibe pedidos', texto: 'Aquí llegan con aviso. Eliges en cuántos minutos estará listo y tocas <b>Aceptar</b>.' },
    { sel: navBtn(5), titulo: '💳 Tu suscripción', texto: () => pruebaTxt() + ' En Perfil también puedes <b>Pedir comida</b> a otros negocios.' }
  ],
  repartidor: () => [
    { titulo: '🛵 ¡Bienvenido a Pídele!', texto: 'Te mostramos cómo empezar a repartir.' },
    { ir: 'perfil', sel: '#tarjVerif', titulo: '✅ Verifica tu número', texto: 'Toca aquí y envía el mensaje por WhatsApp.', si: () => S.user && !S.user.telVerificado },
    { ir: 'disponibles', sel: '#vista .card', titulo: '🟢 Tu turno', texto: 'Cuando estés <b>Disponible</b> te llegan avisos de pedidos. Puedes tomar un descanso con un toque.' },
    { ir: 'disponibles', titulo: '📋 Toma un pedido', texto: 'En <b>Disponibles</b> ves a qué hora sale, la distancia y cuánto ganas. Toca <b>Tomar pedido</b>.' },
    { ir: 'disponibles', sel: navBtn(2), titulo: '🗺️ Tu ruta', texto: 'En <b>Mis entregas</b> ves la ruta del negocio al cliente y lo que llevas cobrado hoy.' },
    { ir: 'disponibles', sel: navBtn(3), titulo: '💳 Tu mensualidad', texto: () => pruebaTxt() }
  ]
};

/* ============ INSTALACIÓN PWA ============ */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); S.instalar = e; $('#btnInstalar').style.display = '';
  const t = $('#tarjInst'); if (t && t.tagName) t.outerHTML = tarjetaInstalar();
});
window.addEventListener('appinstalled', () => { S.instalar = null; const t = $('#tarjInst'); if (t && t.tagName) t.remove(); toast('¡Pídele quedó instalada! 🎉'); });
function esIOS() { return /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
/** Tarjeta en Inicio para instalar la app (se puede ocultar por 7 días). */
function tarjetaInstalar() {
  if (instalada()) return '';
  let no = 0; try { no = Number(localStorage.getItem('pe_instNo')) || 0; } catch (e) { }
  if (Date.now() - no < 7 * 864e5) return '';
  return `<div class="card row" id="tarjInst" style="border:2px solid var(--pri);gap:10px"><span style="font-size:30px">📲</span>
    <div class="grow"><b>Instala Pídele en tu teléfono</b><div class="muted small">Ábrela con un toque desde tu pantalla de inicio y recibe avisos de tus pedidos.</div>
      <div class="btns" style="margin-top:6px"><button class="btn pri sm" onclick="instalarApp()">⬇ Instalar</button><button class="lnk small" onclick="try{localStorage.setItem('pe_instNo',Date.now())}catch(e){};$('#tarjInst').remove()">Ahora no</button></div></div></div>`;
}
function instalarApp() {
  if (S.instalar) {
    S.instalar.prompt();
    S.instalar.userChoice.finally(() => { S.instalar = null; $('#btnInstalar').style.display = 'none'; const t = $('#tarjInst'); if (t && t.tagName) t.remove(); });
    return;
  }
  guiaInstalar();
}
/** Guía con pasos grandes: en iPhone no existe un botón que instale solo. */
function guiaInstalar() {
  if (instalada()) { toast('Pídele ya está instalada en este teléfono ✓'); return; }
  const paso = (n, t, d) => `<div class="row" style="gap:12px;align-items:flex-start;margin:12px 0"><span style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:900">${n}</span><div><b>${t}</b>${d ? `<div class="muted small">${d}</div>` : ''}</div></div>`;
  const ios = esIOS(), noSafari = ios && /CriOS|FxiOS|EdgiOS|GSA\//i.test(navigator.userAgent);
  const svgCompartir = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-5px"><path d="M12 3v12M7 8l5-5 5 5"/><rect x="4" y="11" width="16" height="10" rx="2"/></svg>';
  modal(`<div class="row between"><h2 style="margin:0">Instalar Pídele</h2><button class="redondo" onclick="cerrarModal()" aria-label="Cerrar">✕</button></div>
    ${ios ? `${noSafari ? '<div class="aviso warn" style="margin-top:10px">Si no ves la opción, abre esta página en <b>Safari</b>.</div>' : ''}
      ${paso(1, 'Toca el botón Compartir ' + svgCompartir, 'Está abajo en el centro (o arriba a la derecha en iPad).')}
      ${paso(2, 'Elige “Agregar a pantalla de inicio” ➕', 'Si no aparece, desliza la lista hacia arriba.')}
      ${paso(3, 'Toca “Agregar”', 'Listo: abre Pídele desde el ícono en tu pantalla de inicio.')}`
    : `${paso(1, 'Toca el menú ⋮ del navegador', 'Arriba a la derecha en Chrome.')}
      ${paso(2, 'Elige “Instalar app” o “Agregar a pantalla de inicio”', '')}
      ${paso(3, 'Confirma con “Instalar”', 'Listo: abre Pídele desde el ícono en tu pantalla de inicio.')}`}
    <div class="btns"><button class="btn pill full" onclick="cerrarModal()">Entendido</button></div>`);
}

arrancar();
</script>
