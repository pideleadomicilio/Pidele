      <div class="row between"><div><b>Aceptar efectivo</b><div class="muted small">A domicilio, el repartidor te paga la comida al recogerla y la cobra al cliente.</div></div>
        <label class="sw"><input type="checkbox" id="nEfe" ${n.efectivo ? 'checked' : ''}><i></i></label></div>
      <hr class="hr"><b>Transferencia y CoDi (opcional)</b><div class="muted small">Si los registras, tus clientes podrán pagarte directo, sin comisiones.</div>
      <label class="f">Banco</label><input class="i" id="nBan" value="${esc(n.banco)}" placeholder="BBVA, Banorte, Nu, Mercado Pago…">
      <label class="f">Titular de la cuenta</label><input class="i" id="nTit" value="${esc(n.titular)}">
      <label class="f">CLABE (18 dígitos)</label><input class="i" id="nCla" inputmode="numeric" maxlength="22" value="${esc(n.clabe)}">
      <label class="f">Número de tarjeta (16 dígitos, opcional)</label><input class="i" id="nTar" inputmode="numeric" maxlength="22" value="${esc(n.tarjeta)}">
      <label class="f">QR de CoDi / Dimo</label>
      <div class="row wrap"><span id="qrEst" class="tag ${n.qrId ? 't-ok' : 't-gray'}">${n.qrId ? 'QR cargado' : 'Sin QR'}</span>
        ${n.qrId ? `<button class="btn sm" onclick="act(this,async()=>visor(await api('imagen',{fileId:'${n.qrId}'})))">Ver</button>` : ''}
        <label class="btn sm">${ico('qr', 's')} Subir QR<input type="file" accept="image/*" hidden onchange="imgNegocio(this,'qr')"></label></div>
    </div>
    <div class="btns"><button class="btn pri pill full" onclick="act(this,guardarNegocio)">Guardar cambios</button></div><div style="height:20px"></div>`);
  S._selN = mapaSelector('mapaNeg', n.lat, n.lng, (a, b) => { S._negPos = { lat: a, lng: b }; });
}
async function imgNegocio(inp, tipo) {
  const f = inp.files[0]; if (!f) return;
  const img = await comprimir(f, tipo === 'portada' ? 1200 : tipo === 'qr' ? 1000 : 500);
  if (tipo === 'logo') {
    S._logo = img;
    const mi = $('#nLogoMini');
    if (mi && mi.tagName) mi.src = img; else $('#nPortPrev').insertAdjacentHTML('beforeend', `<img class="mini" id="nLogoMini" src="${img}" alt="">`);
  } else if (tipo === 'portada') {
    S._portada = img;
    const mini = $('#nLogoMini');
    $('#nPortPrev').innerHTML = `<img class="portada" src="${img}" alt="">` + (mini && mini.outerHTML ? mini.outerHTML : '');
  } else { S._qr = img; $('#qrEst').textContent = 'QR nuevo listo para guardar'; $('#qrEst').className = 'tag t-info'; }
}
async function guardarNegocio() {
  const v = id => $('#' + id).value;
  const n = await api('guardarNegocio', {
    nombre: v('nNom'), categoria: v('nCat'), descripcion: v('nDes'), horarios: leerHorario(), tiempoPrep: v('nTie'), telefono: v('nTel'),
    direccion: v('nDir'), lat: S._negPos.lat, lng: S._negPos.lng, banco: v('nBan'), titular: v('nTit'), clabe: v('nCla'), tarjeta: v('nTar'),
    efectivo: $('#nEfe').checked, logoImagen: S._logo || undefined, qrImagen: S._qr || undefined, portadaImagen: S._portada || undefined
  });
  S.negocio = n; ls('negocio', n); toast('Datos guardados ✓'); pintar(true);
}
function filasHorario(hs) {
  hs = hs && hs.length === 7 ? hs : DIAS.map(() => ({ on: true, a: '09:00', c: '21:00' }));
  return [1, 2, 3, 4, 5, 6, 0].map(d => { const h = hs[d]; return `<div class="hRow ${h.on ? '' : 'off'}">
    <label><input type="checkbox" id="hOn${d}" ${h.on ? 'checked' : ''} onchange="this.closest('.hRow').classList.toggle('off',!this.checked)">${DIAS[d]}</label>
    <input type="time" id="hA${d}" value="${esc(h.a || '09:00')}"><input type="time" id="hC${d}" value="${esc(h.c || '21:00')}"></div>`; }).join('');
}
function leerHorario() { return DIAS.map((x, d) => ({ on: $('#hOn' + d).checked, a: $('#hA' + d).value, c: $('#hC' + d).value })); }
function copiarLunes() {
  const on = $('#hOn1').checked, a = $('#hA1').value, c = $('#hC1').value;
  [0, 2, 3, 4, 5, 6].forEach(d => { $('#hOn' + d).checked = on; $('#hA' + d).value = a; $('#hC' + d).value = c; $('#hOn' + d).closest('.hRow').classList.toggle('off', !on); });
  toast('Horario copiado; recuerda guardar');
}

/* ============ REPARTIDOR ============ */
async function vDisponibles() {
  const d = await api('disponibles', S.pos || {});
  S.esperaHasta = Date.now() + d.esperaMs;
  const lleno = d.activos >= d.maxActivos;
  html(`${pendienteAviso()}${bannerPush()}
    <div class="card row between"><div><div class="muted small">Siguiente pedido</div><div class="espera" id="espera">${textoEspera()}</div></div>
      <div style="text-align:right"><div class="muted small">Activos</div><b style="font-size:22px">${d.activos}/${d.maxActivos}</b></div></div>
    ${!S.pos ? `<div class="aviso warn">📡 Activa el GPS para ver qué pedidos te quedan en ruta y para que el cliente vea dónde vas.</div>` : ''}
    ${lleno ? `<div class="aviso info">Ya tienes el máximo de pedidos activos. Entrega uno para tomar otro.</div>` : ''}
    <div class="muted small" style="margin-bottom:8px">Puedes tomar 1 pedido cada ${d.minutosEntreTomas} min, para que el trabajo se reparta entre todos.</div>
    ${d.lista.length ? d.lista.map(x => `<div class="card">
      <div class="row between"><div><b>${esc(x.negocio)}</b><div class="muted small">${x.folio} · ${x.piezas} productos</div></div>${x.estado === 'LISTO' ? '<span class="tag t-ok">Ya está listo</span>' : `<span class="tag t-pri">Sale ${hora(x.horaSalida)}</span>`}</div>
      <div class="row wrap" style="margin-top:8px;gap:16px">
        <div><div class="muted small">Sale</div><b>${x.estado === 'LISTO' ? 'Ya' : enMin(x.horaSalida)}</b></div>
        <div><div class="muted small">Entrega</div><b>${x.distanciaKm} km</b></div>
        <div><div class="muted small">Tu envío</div><b>${money(x.envio)}</b></div></div>
      <div class="small" style="margin-top:8px">${x.metodoPago === 'efectivo' ? `${ico('efectivo', 's')} <b>Efectivo:</b> necesitas ${money(x.subtotal)} para pagar al negocio` : `${ico('banco', 's')} Comida pagada por ${PAGO_TXT[x.metodoPago]}`}</div>
      <div class="aviso ${x.viabilidad.viable ? 'ok' : 'warn'}" style="margin:10px 0 0">${x.viabilidad.viable ? '✅' : '⚠️'} ${esc(x.viabilidad.motivo)}</div>
      <div class="btns"><a class="btn" href="${gmaps(x.negLat, x.negLng)}" target="_blank">${ico('mapa', 's')} Ver negocio</a>
        <button class="btn pri tomar" ${S.user.estado !== 'activo' || lleno ? 'disabled' : ''} onclick="act(this,()=>tomar('${x.id}'))">Tomar pedido</button></div></div>`).join('')
    : `<div class="vacio"><span class="big">🛵</span>No hay pedidos disponibles ahorita.<br>Te avisamos cuando haya uno.</div>`}`);
  relojEspera();
}
function textoEspera() {
  const ms = S.esperaHasta - Date.now();
  if (ms <= 0) return '<span style="color:var(--ok)">¡Disponible!</span>';
  const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function relojEspera() {
  clearInterval(S._reloj);
  const tick = () => {
    const e = $('#espera'); if (!e || !e.tagName) { clearInterval(S._reloj); return; }
    e.innerHTML = textoEspera();
    const espera = S.esperaHasta > Date.now();
    document.querySelectorAll('.tomar').forEach(b => { if (espera) { b.disabled = true; b.dataset.w = 1; } else if (b.dataset.w) { b.disabled = S.user.estado !== 'activo'; delete b.dataset.w; } });
  };
  tick(); S._reloj = setInterval(tick, 1000);
}
async function tomar(id) {
  await api('tomarPedido', { id });
  toast('¡Pedido tomado! 🛵');
  ir('entregas');
}

async function vEntregas(p, silencioso) {
  const d = await api('misEntregas', S.pos || {});
  recordar(d.pedidos);
  const firma = JSON.stringify(d.ruta.map(s => s.tipo + s.pedidoId));
  if (silencioso && S.map && $('#mapaRuta') && d.pedidos.length && S._rutaFirma === firma) { $('#listaEnt').innerHTML = tarjetasEntrega(d); return; }
  S._rutaFirma = firma;
  html(`${pendienteAviso()}
    <div class="kpis"><div class="kpi"><b>${d.hoy.entregas}</b><span>Entregas hoy</span></div><div class="kpi"><b>${money(d.hoy.envios)}</b><span>Envíos cobrados hoy</span></div></div>
    ${d.pedidos.length ? `<div class="card"><div class="row between"><b>${ico('mapa', 's')} Tu ruta</b><span class="muted small">${d.kmRuta} km · ~${d.minRuta} min</span></div>
      <div id="mapaRuta" class="mapa alto" style="margin-top:8px"></div>
      <div style="margin-top:8px">${d.ruta.map((s, i) => `<div class="parada"><div class="num ${s.tipo === 'recoger' ? 'r' : 'e'}">${i + 1}</div><div class="grow"><b>${s.tipo === 'recoger' ? 'Recoger en' : 'Entregar a'} ${esc(s.nombre)}</b><div class="muted small">${s.folio}</div></div><a class="btn sm" href="${gmaps(s.lat, s.lng)}" target="_blank">${ico('mapa', 's')}</a></div>`).join('')}</div>
      <div class="btns"><a class="btn pri pill full" href="${urlRuta(d.ruta)}" target="_blank">${ico('mapa', 's')} Abrir ruta completa en Google Maps</a></div></div>
      <div id="listaEnt">${tarjetasEntrega(d)}</div>`
    : `<div class="vacio"><span class="big">🛵</span>No tienes entregas activas.<br><br><button class="btn pri pill" onclick="ir('disponibles')">Ver pedidos disponibles</button></div>`}`);
  if (d.pedidos.length) dibujarRuta(d.ruta);
}
function tarjetasEntrega(d) {
  return d.pedidos.map(x => `<div class="card">
    <div class="row between" onclick="ir('pedido','${x.id}')" style="cursor:pointer"><div><b>${x.folio}</b> · ${esc(x.negocio.nombre)}</div>${etiqueta(x.estado, x)}</div>
    ${x.alerta ? `<div class="aviso warn" style="margin:8px 0 0">⏰ ${esc(x.alerta)}</div>` : ''}
    <div class="small" style="margin-top:8px">${cobroRepartidor(x)}</div>
    ${x.estado === 'EN_CAMINO' ? bloqueRecibe(x) : `<div class="muted small" style="margin-top:6px">${x.estado === 'LISTO' ? '📦 Listo en el negocio' : '👩‍🍳 Sale ' + hora(x.horaSalida) + ' (' + enMin(x.horaSalida) + ')'} · ${telLink(x.negocio.telefono, 'Negocio')}</div>`}
    ${botonesPedido(x, true)}</div>`).join('');
}
function urlRuta(ruta) {
  if (!ruta.length) return '#';
  const pts = ruta.map(s => s.lat + ',' + s.lng);
  const dest = pts.pop();
  let u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(dest);
  if (S.pos) u += '&origin=' + encodeURIComponent(S.pos.lat + ',' + S.pos.lng);
  if (pts.length) u += '&waypoints=' + encodeURIComponent(pts.slice(0, 9).join('|'));
  return u;
}
function dibujarRuta(ruta) {
  const ini = S.pos || ruta[0];
  const m = nuevoMapa('mapaRuta', ini.lat, ini.lng, 15);
  const pts = [];
  if (S.pos) { L.marker([S.pos.lat, S.pos.lng], { icon: pinIcono('🛵', '#D9822B') }).addTo(m); pts.push([S.pos.lat, S.pos.lng]); }
  ruta.forEach((s, i) => {
    L.marker([s.lat, s.lng], { icon: pinNum(i + 1, s.tipo === 'recoger' ? '#D9822B' : '#3B5A2C') }).addTo(m).bindPopup((s.tipo === 'recoger' ? 'Recoger: ' : 'Entregar: ') + esc(s.nombre));
    pts.push([s.lat, s.lng]);
  });
  if (pts.length > 1) { L.polyline(pts, { color: '#3B5A2C', weight: 4, opacity: .7, dashArray: '6 8' }).addTo(m); m.fitBounds(pts, { padding: [30, 30] }); }
}

/* ============ ADMINISTRADOR ============ */
async function vAdmin() {
  const d = await api('adminResumen');
  const nt = d.notificaciones || {};
  html(`${bannerPush()}<h2>Resumen</h2>
    ${nt.configuradas ? '' : '<div class="aviso warn">🔕 Notificaciones sin configurar en el servidor (falta FCM_CUENTA). La app funciona, pero sin avisos con la app cerrada.</div>'}
    <div class="kpis">
      <div class="kpi"><b>${d.hoy.pedidos}</b><span>Pedidos hoy</span></div>
      <div class="kpi"><b>${d.activos}</b><span>Pedidos activos</span></div>
      <div class="kpi"><b>${d.hoy.entregados}</b><span>Entregados hoy</span></div>
      <div class="kpi"><b>${d.hoy.cancelados}</b><span>Cancelados hoy</span></div>
      <div class="kpi"><b>${money(d.hoy.vendido)}</b><span>Vendido hoy</span></div>
      <div class="kpi"><b>${d.negociosAbiertos}</b><span>Negocios abiertos</span></div></div>
    ${nt.configuradas ? `<div class="card muted">🔔 ${nt.dispositivos} teléfono(s) con notificaciones activas</div>` : ''}
    <div class="card muted">👥 ${d.usuarios.compradores} clientes · ${d.usuarios.negocios} negocios · ${d.usuarios.repartidores} repartidores · ${d.usuarios.bloqueados} bloqueados</div>
    <h3>Por aprobar (${d.pendientes.length})</h3>
    ${d.pendientes.length ? d.pendientes.map(tarjetaUsuario).join('') : '<div class="vacio">Nadie pendiente ✨</div>'}`);
}
function tarjetaUsuario(x) {
  const est = { activo: 't-ok', pendiente: 't-warn', bloqueado: 't-err' }[x.estado];
  return `<div class="card"><div class="row between"><div><b>${esc(x.nombre)}</b> <span class="muted small">${esc(rolNombre(x.rol))}</span>
      <div class="muted small">${esc(x.telefono)} · alta ${fechaCorta(x.fechaAlta)}</div>
      ${x.negocio ? `<div class="small">🏪 ${esc(x.negocio)} · ${esc(x.categoria)} ${x.negocioListo ? '<span class="tag t-ok">Datos completos</span>' : '<span class="tag t-warn">Falta ubicación</span>'}</div>` : ''}
      ${x.vehiculo ? `<div class="small">🛵 ${esc(x.vehiculo)}</div>` : ''}</div><span class="tag ${est}">${x.estado}</span></div>
    ${x.notasAdmin ? `<div class="muted small" style="margin-top:6px">📝 ${esc(x.notasAdmin)}</div>` : ''}
    <div class="btns">${x.estado !== 'activo' ? `<button class="btn ok sm" onclick="act(this,()=>estadoUsuario('${x.id}','activo'))">${x.estado === 'pendiente' ? 'Aprobar' : 'Reactivar'}</button>` : ''}
      ${x.estado !== 'bloqueado' && x.rol !== 'admin' ? `<button class="btn err sm" onclick="act(this,()=>estadoUsuario('${x.id}','bloqueado'))">Bloquear</button>` : ''}
      <a class="btn sm" href="${waLink(x.telefono)}" target="_blank">${ico('chat', 's')} WhatsApp</a></div></div>`;
}
async function estadoUsuario(id, estado) {
  let nota = '';
  if (estado === 'bloqueado') { nota = prompt('Motivo del bloqueo (queda registrado):'); if (nota === null) return; }
  await api('adminEstadoUsuario', { usuarioId: id, estado, nota });
  toast(estado === 'activo' ? 'Cuenta activada ✓' : 'Cuenta bloqueada');
  pintar(true);
}
async function vAdminUsuarios(p, silencioso) {
  const f = S._fu || { q: '', rol: '', estado: '' };
  if (!silencioso || !$('#listaU')) {
    html(`<h2>Usuarios</h2>
      <div class="buscar">${ico('search', 's')}<input id="uq" placeholder="Nombre, teléfono o negocio" value="${esc(f.q)}" onchange="filtrarU()"></div>
      <div class="row"><select class="i" id="ur" onchange="filtrarU()"><option value="">Todos los roles</option>${['comprador', 'negocio', 'repartidor', 'admin'].map(r => `<option value="${r}" ${f.rol === r ? 'selected' : ''}>${rolNombre(r)}</option>`).join('')}</select>
      <select class="i" id="ue" onchange="filtrarU()"><option value="">Todos</option>${['activo', 'pendiente', 'bloqueado'].map(e => `<option ${f.estado === e ? 'selected' : ''}>${e}</option>`).join('')}</select></div>
      <div id="listaU" style="margin-top:12px"><div class="cargando">Cargando…</div></div>`);
  }
  const l = await api('adminUsuarios', f);
  $('#listaU').innerHTML = l.length ? l.map(tarjetaUsuario).join('') : '<div class="vacio">Sin resultados</div>';
}
function filtrarU() { S._fu = { q: $('#uq').value, rol: $('#ur').value, estado: $('#ue').value }; pintar(true); }
async function vAdminPedidos() {
  const t = S.tabAdmPed;
  const l = await api('adminPedidos', { todos: t === 'semana' });
  html(`<h2>Pedidos</h2>
    <div class="tabs"><button class="${t === 'activos' ? 'on' : ''}" onclick="S.tabAdmPed='activos';pintar()">Activos</button><button class="${t === 'semana' ? 'on' : ''}" onclick="S.tabAdmPed='semana';pintar()">Últimos 7 días</button></div>
    ${l.length ? l.map(x => `<div class="card" onclick="ir('pedido','${x.id}')" style="cursor:pointer">
      <div class="row between"><div><b>${x.folio}</b> · ${esc(x.negocio.nombre)}<div class="muted small">${esc(x.comprador.nombre)} · ${fechaCorta(x.creado)} · ${money(x.total)} · ${PAGO_TXT[x.metodoPago]}${x.repartidor ? ' · 🛵 ' + esc(x.repartidor.nombre) : ''}</div></div>${etiqueta(x.estado, x)}</div>
      ${x.alerta ? `<div class="aviso warn" style="margin:8px 0 0">⏰ ${esc(x.alerta)}</div>` : ''}
      ${x.estado === 'CANCELADO' && x.motivo ? `<div class="muted small">✖️ ${esc(x.canceladoPor)}: ${esc(x.motivo)}</div>` : ''}
      ${x.califNegocio ? `<div class="small">Restaurante <span class="estrella">${'★'.repeat(x.califNegocio)}</span>${x.califRepartidor ? ' · Entrega <span class="estrella">' + '★'.repeat(x.califRepartidor) + '</span>' : ''}</div>` : ''}</div>`).join('') : '<div class="vacio">Sin pedidos</div>'}`);
}
async function vAdminConfig() {
  const l = await api('adminConfig');
  html(`<h2>Ajustes de la app</h2>
    <div class="card">${l.map(c => `<label class="f">${esc(c.descripcion || c.clave)}</label><input class="i cfg" data-k="${esc(c.clave)}" value="${esc(c.valor)}">`).join('')}
    <div class="btns"><button class="btn pri pill full" onclick="act(this,guardarConfig)">Guardar ajustes</button></div></div>`);
}
async function guardarConfig() {
  const valores = {};
  document.querySelectorAll('.cfg').forEach(i => valores[i.dataset.k] = i.value);
  await api('adminGuardarConfig', { valores });
  S.conf = await api('configPublica'); ls('conf', S.conf);
  toast('Ajustes guardados ✓');
}

/* ============ INSTALACIÓN PWA ============ */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.instalar = e; $('#btnInstalar').style.display = ''; });
function instalarApp() {
  if (!S.instalar) { toast('Usa el menú del navegador → "Agregar a pantalla de inicio"'); return; }
  S.instalar.prompt();
  S.instalar.userChoice.finally(() => { S.instalar = null; $('#btnInstalar').style.display = 'none'; });
}

arrancar();
</script>
