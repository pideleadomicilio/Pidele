<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pide tu factura · Pídele</title>
<meta name="theme-color" content="#2F4A1E">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Pídele 3.5.0 · página de factura independiente: no usa la app ni su copia guardada, así funciona con cualquier versión */
:root{--pri:#2F4A1E;--bg:#F6F4EE;--card:#fff;--tx:#1d1d1b;--tx2:#5f5f58;--ln:#e2ded3;--ok:#2E7D32;--err:#C62828;--warn:#B26A00;--info:#E8F0FA}
@media (prefers-color-scheme:dark){:root{--pri:#9CC36B;--bg:#141613;--card:#1E211C;--tx:#EEEDE8;--tx2:#A9A99F;--ln:#33372F;--info:#1d2733}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.cab{display:flex;gap:12px;align-items:center;margin:4px 0 14px}
.cab img,.cab .e{width:52px;height:52px;border-radius:14px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--card);flex:none}
.cab b{font-size:18px;display:block}.muted{color:var(--tx2)}.small{font-size:14px}
.marca{margin-left:auto;font-weight:900;color:var(--pri);font-size:15px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:10px 0}
h2{margin:0 0 6px;font-size:21px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
button,.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:999px;background:var(--pri);color:#fff;font:inherit;font-weight:800;font-size:17px;text-align:center;text-decoration:none;cursor:pointer}
.btn2{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.lnk{background:none;color:var(--pri);padding:6px;margin-top:6px;font-weight:700;font-size:15px;text-decoration:underline}
button[disabled]{opacity:.55}
.aviso{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;background:var(--info)}
.err{background:#fdecea;color:#7f1d1d}.warn{background:#fff4e0;color:#5c3800}
@media (prefers-color-scheme:dark){.err{background:#3a1d1d;color:#ffb4b4}.warn{background:#3a2c12;color:#ffd79a}}
.c{text-align:center}.big{font-size:46px}
</style>
</head>
<body>
<div class="w" id="app"><div class="card c"><div class="big">🧾</div><div class="muted">Cargando tu ticket…</div></div></div>
<script>
(function () {
  // Servidores (los mismos de la app). Las ciudades nuevas mandan su servidor en el link (&s=).
  var ALT = 'https://pidele-whatsapp.pidele-soporte.workers.dev/api';
  var SRV = {
    lacruz: { api: 'https://script.google.com/macros/s/AKfycbw16py7HK64D_1W5C5leitt313r_tviHv9NYsgH2_ZSu_z_1IWJcynEMsNSySrTUqu7pQ/exec', alt: ALT },
    cosala: { api: 'https://script.google.com/macros/s/AKfycbzS9hFJRNcWzytF8OL9grSpzx2jhQu49U7rEou6wKoCpt6HtVMmteXUmw75dg9gU_iJ0Q/exec', alt: ALT + '/cosala' }
  };
  var q = new URLSearchParams(location.search), TOKEN = q.get('t') || q.get('fac') || '', CIU = q.get('c') || q.get('pueblo') || 'lacruz', SID = q.get('s') || '';
  var S = SRV[CIU] || (SID && /^[\w-]{20,120}$/.test(SID) ? { api: 'https://script.google.com/macros/s/' + SID + '/exec', alt: '' } : SRV.lacruz);
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var money = function (n) { n = Number(n) || 0; return '$' + n.toLocaleString('es-MX', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
  var D = null, tel = '', info = null, otros = false, ocupado = false;

  function llamar(accion, datos) {
    var cuerpo = JSON.stringify({ accion: accion, datos: datos || {}, token: null, rid: Date.now().toString(36) + Math.random().toString(36).slice(2, 10) });
    var uno = function (url) {
      var ctl = window.AbortController ? new AbortController() : null, to = ctl ? setTimeout(function () { ctl.abort(); }, 20000) : null;
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: cuerpo, signal: ctl ? ctl.signal : undefined })
        .then(function (r) { return r.text(); }).then(function (t) { if (to) clearTimeout(to); return JSON.parse(t); });
    };
    return uno(S.api).catch(function (e) { if (!S.alt) throw e; return uno(S.alt); })
      .catch(function () { throw new Error('No hubo conexión con el servidor. Revisa tu señal e intenta de nuevo.'); })
      .then(function (j) { if (!j.ok) throw new Error(j.error === 'SESION' ? 'Intenta de nuevo.' : j.error || 'No se pudo'); return j.data; });
  }
  function cab() {
    if (!D) return '';
    return '<div class="cab">' + (D.logo ? '<img src="' + esc(D.logo) + '" alt="">' : '<span class="e">🧾</span>') + '<div><b>' + esc(D.negocio) + '</b><div class="muted small">Ticket ' + esc(D.folio) + ' · ' + esc(String(D.dia || '').split('-').reverse().join('/')) + ' · ' + money(D.total) + '</div></div><span class="marca">Pídele</span></div>';
  }
  function waBtn(txt) {
    if (!D || !D.wa) return '';
    var n = String(D.wa).replace(/\D/g, ''); if (n.length === 10) n = '52' + n;
    var m = 'Hola, quiero la factura de mi ticket ' + (D.folio || '') + ' del ' + String(D.dia || '').split('-').reverse().join('/') + ' por ' + money(D.total) + '.';
    return '<a class="btn btn2" href="https://wa.me/' + n + '?text=' + encodeURIComponent(m) + '">💬 ' + (txt || 'Escribir al negocio por WhatsApp') + '</a>';
  }
  function pinta(h) { $('app').innerHTML = cab() + h; window.scrollTo(0, 0); }
  function error(msg) { pinta('<div class="card c"><div class="big">🧾</div><h2>No se pudo abrir</h2><div class="muted">' + esc(msg) + '</div>' + waBtn() + '<button class="lnk" onclick="location.reload()">Intentar de nuevo</button></div>'); }
  function opciones(o, sel) { return '<option value="">Elige…</option>' + Object.keys(o || {}).map(function (k) { return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + k + ' · ' + esc(o[k]) + '</option>'; }).join(''); }
  function aviso(t, cls) { var a = $('msg'); if (a) { a.className = 'aviso ' + (cls || 'err'); a.textContent = t; a.style.display = ''; a.scrollIntoView({ block: 'center' }); } }

  function pasoTel() {
    pinta('<div class="card"><h2>🧾 Pide tu factura</h2><div class="muted small">Escribe tu teléfono (el link se mandó al que termina en <b>' + esc(String(D.telMask || '').slice(-5)) + '</b>).</div>' +
      '<input id="tel" inputmode="tel" maxlength="14" placeholder="10 dígitos" style="font-size:24px;text-align:center;margin-top:12px">' +
      '<div id="msg" style="display:none"></div><button id="b1">Continuar</button></div>');
    $('b1').onclick = function () {
      var t = ($('tel').value || '').replace(/\D/g, '').slice(-10);
      if (t.length !== 10) return aviso('Escribe tu teléfono a 10 dígitos');
      boton($('b1'), llamar('facLinkTel', { token: TOKEN, tel: t }).then(function (r) { tel = t; info = r; pasoDatos(); }));
    };
  }
  function pasoDatos() {
    var g = info && info.guardados;
    if (g && !otros) {
      pinta('<div class="card"><h2>🧾 Pide tu factura</h2><div class="muted small">Tienes datos fiscales guardados en tu cuenta de Pídele:</div>' +
        '<div style="margin:10px 0"><b>' + esc(g.nombre) + '</b><div class="muted small">RFC ' + esc(g.rfc) + ' · ' + esc(g.email) + '</div></div>' +
        '<div id="msg" style="display:none"></div><button id="bG">Pedir factura con estos datos</button><button class="lnk" id="bO">Usar otros datos</button></div>');
      $('bG').onclick = function () { enviar(true, $('bG')); };
      $('bO').onclick = function () { otros = true; pasoDatos(); };
      return;
    }
    pinta('<div class="card"><h2>✍️ Tus datos fiscales</h2><div class="muted small">Tal como aparecen en tu constancia de situación fiscal.</div>' +
      '<label>RFC</label><input id="rfc" maxlength="13" autocapitalize="characters" style="text-transform:uppercase" placeholder="13 letras y números (12 si es empresa)">' +
      '<label>Nombre o razón social</label><input id="nom" autocapitalize="characters" style="text-transform:uppercase">' +
      '<label>Régimen fiscal</label><select id="reg">' + opciones(D.regimenes, '') + '</select>' +
      '<label>Código postal fiscal</label><input id="cp" inputmode="numeric" maxlength="5">' +
      '<label>Uso de la factura</label><select id="uso">' + opciones(D.usos, 'G03') + '</select>' +
      '<label>Correo para recibir la factura</label><input id="mail" type="email" placeholder="correo@ejemplo.com">' +
      '<div id="msg" style="display:none"></div><button id="bE">Enviar mis datos</button>' + (g ? '<button class="lnk" id="bV">Usar mis datos guardados</button>' : '') + '</div>' +
      '<div class="muted small c">Puedes facturar hasta el ' + esc(new Date(D.vence).toLocaleDateString('es-MX', { day: 'numeric', month: 'long' })) + '.</div>');
    $('reg').onchange = function () { var r = this.value, u = $('uso'); if ((r === '616' || r === '605') && /^[GI]/.test(u.value)) u.value = 'S01'; else if (r !== '616' && r !== '605' && u.value === 'S01') u.value = 'G03'; };
    $('bE').onclick = function () { enviar(false, $('bE')); };
    if (g) $('bV').onclick = function () { otros = false; pasoDatos(); };
  }
  function enviar(guardados, b) {
    var d = { token: TOKEN, tel: tel };
    if (guardados) d.usarGuardados = true;
    else {
      var v = function (id) { return ($(id).value || '').trim(); };
      d.rfc = v('rfc').toUpperCase().replace(/[\s-]/g, ''); d.nombre = v('nom').toUpperCase(); d.regimen = v('reg'); d.cp = v('cp'); d.uso = v('uso'); d.email = v('mail');
      if (d.rfc.length < 12 || d.rfc.length > 13) return aviso('El RFC no es válido (13 caracteres si eres persona física, 12 si es empresa)');
      if (d.nombre.length < 3) return aviso('Escribe tu nombre o razón social');
      if (!d.regimen) return aviso('Elige tu régimen fiscal');
      if (!/^\d{5}$/.test(d.cp)) return aviso('El código postal fiscal debe tener 5 números');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return aviso('Escribe el correo donde quieres recibir tu factura');
    }
    boton(b, llamar('facLinkEnviar', d).then(function (r) { listo(false, r && r.resico); }));
  }
  function listo(emitida, resico) {
    pinta('<div class="card c"><div class="big">' + (emitida ? '✅' : '📨') + '</div><h2>' + (emitida ? 'Tu factura ya está timbrada' : '¡Listo! Ya tienen tus datos') + '</h2>' +
      '<div class="muted">' + (emitida ? 'Te llegó a tu correo. Si no la ves, revisa tu carpeta de spam o pídela al negocio.' : esc(D.negocio) + ' timbrará tu factura y te llegará a tu correo.') + '</div>' +
      (resico ? '<div class="aviso warn" style="text-align:left">' + esc(resico) + '</div>' : '') +
      '<a class="btn btn2" href="./">Conoce Pídele: pide a domicilio y usa tu monedero</a></div>');
  }
  function boton(b, prom) {
    if (ocupado) return; ocupado = true; var t = b.textContent; b.disabled = true; b.textContent = 'Un momento…';
    prom.catch(function (e) { aviso(e.message); }).then(function () { ocupado = false; if (document.body.contains(b)) { b.disabled = false; b.textContent = t; } });
  }

  if (!TOKEN) { error('Este link está incompleto. Pídele al negocio que te lo mande de nuevo.'); return; }
  llamar('facLinkVer', { token: TOKEN, v2: true }).then(function (d) {
    D = d;
    if (d.error) return error(d.error);
    if (d.estado === 'pendiente' || d.estado === 'emitida') return listo(d.estado === 'emitida');
    if (d.info) { info = d.info; pasoDatos(); } else pasoTel();
  }).catch(function (e) { error(e.message); });
})();
</script>
</body>
</html>
